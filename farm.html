<style>
:root{--main:#3fa34d;--ink:#33294a;--soft:#fff9f0}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'Gowun Dodum',system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,#fff9f0,#fff 45%,color-mix(in srgb,var(--main) 16%,#fff));min-height:100vh;font-size:18px;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
h1,h2,h3,.btn,.hud,.jua{font-family:'Jua','Gowun Dodum',sans-serif;font-weight:400}
button{font:inherit;color:inherit;cursor:pointer}
/* HUD */
.hud{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;background:#ffffffe6;backdrop-filter:blur(6px);border-bottom:3px solid color-mix(in srgb,var(--main) 40%,#fff)}
.hud a{text-decoration:none;color:var(--ink);background:#fff;border:2px solid #ebe4f3;border-radius:999px;padding:4px 11px}
.hud .t{font-size:19px;white-space:nowrap}
.chip{background:#fff;border:2px solid #ebe4f3;border-radius:999px;padding:3px 11px;font-size:17px;white-space:nowrap;transition:transform .2s}
.chip.pulse{animation:pulse .5s}@keyframes pulse{50%{transform:scale(1.25)}}
.chip.money{background:#fff6d6;border-color:#f3cf55}
.goalbar{flex:1;min-width:120px;height:14px;border-radius:999px;background:#efeaf6;overflow:hidden;position:relative}
.goalbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--main),#ffd166);border-radius:999px;transition:width .8s}
.lvpill{background:var(--main);color:#fff;border-radius:999px;padding:3px 10px;font-size:14px}
.ib{background:#fff;border:2px solid #ebe4f3;border-radius:50%;width:36px;height:36px;padding:0;font-size:18px}
#wrap{max-width:980px;margin:0 auto;padding:10px 10px 60px}
/* 장면 */
.scene{position:relative;height:min(52vh,420px);min-height:300px;border-radius:26px;overflow:hidden;box-shadow:0 8px 0 #0000000d,0 12px 30px #0000001a;user-select:none}
.sky{position:absolute;inset:0;transition:background 1.2s}
.sun{position:absolute;width:64px;height:64px;font-size:54px;line-height:64px;text-align:center;transform:translate(-50%,-50%);transition:left .3s linear,top .3s linear;z-index:1;filter:drop-shadow(0 0 18px #ffd86b)}
.ground{position:absolute;left:0;right:0;bottom:0;height:62%;transition:filter 1.2s}
.world{position:absolute;inset:0;z-index:3}
.night .ground{filter:brightness(.55) saturate(.8)}
.night .world{filter:brightness(.75)}
.cloud{position:absolute;font-size:46px;opacity:.9;animation:drift 40s linear infinite;z-index:2}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(1100px)}}
.wx{position:absolute;inset:0;pointer-events:none;z-index:8;overflow:hidden}
.drop{position:absolute;top:-20px;width:2px;height:18px;background:linear-gradient(#9fd2ff00,#5aa9f0);animation:rain .7s linear infinite}
@keyframes rain{to{transform:translateY(480px)}}
.flake{position:absolute;top:-20px;color:#fff;animation:snow 4s linear infinite;font-size:16px}
@keyframes snow{to{transform:translate(30px,480px) rotate(360deg)}}
.heat{position:absolute;inset:0;background:radial-gradient(circle at 80% 0,#ff9d3d55,transparent 60%);animation:heat 2s ease-in-out infinite}
@keyframes heat{50%{opacity:.4}}
.daybanner{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(.6);z-index:20;font-family:Jua;font-size:46px;color:#fff;text-shadow:0 4px 0 #0004,0 0 20px #0005;opacity:0;pointer-events:none;white-space:nowrap}
.daybanner.show{animation:banner 1.6s ease forwards}
@keyframes banner{20%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}35%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
/* 효과 */
.fx{position:fixed;z-index:60;pointer-events:none;font-family:Jua;font-weight:400;transform:translate(-50%,-50%);white-space:nowrap}
.float{animation:floatUp 1.3s ease-out forwards;font-size:24px;text-shadow:0 2px 0 #fff,0 0 6px #fff}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-260%) scale(1)}}
.coinfly{font-size:26px;transition:left .7s cubic-bezier(.5,-0.3,.6,1),top .7s cubic-bezier(.3,0,.8,.4),transform .7s;}
.part{font-size:24px;transition:transform 1s ease-out,opacity 1s}
.conf{position:fixed;top:-40px;z-index:70;font-size:26px;pointer-events:none;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(600deg)}}
.firework{position:absolute;width:6px;height:6px;border-radius:50%;z-index:9;animation:fw 1.2s ease-out forwards}
@keyframes fw{0%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--dx),var(--dy));opacity:0}}
.shake{animation:shake .4s}@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.bob{animation:bob 1.8s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-6px)}}
.wiggle{animation:wiggle 1.2s ease-in-out infinite}@keyframes wiggle{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.popin{animation:popin .45s cubic-bezier(.3,1.6,.6,1)}@keyframes popin{0%{transform:scale(.2)}100%{transform:scale(1)}}
.glow{filter:drop-shadow(0 0 10px #ffe066) drop-shadow(0 0 4px #fff)}
.sparkle::after{content:'✨';position:absolute;top:-10px;right:-12px;font-size:18px;animation:tw 1s ease-in-out infinite}
@keyframes tw{50%{transform:scale(1.5) rotate(20deg);opacity:.5}}
/* 패널 */
.panel{margin-top:12px;background:#fff;border-radius:24px;padding:14px;box-shadow:0 5px 0 #ece6f3}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.btn{border:none;border-radius:18px;padding:12px 22px;font-size:21px;background:#efeaf6;box-shadow:0 5px 0 #d6cfe2;text-decoration:none;color:var(--ink);display:inline-block;margin:4px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #d6cfe2}
.btn.go{background:var(--main);color:#fff;box-shadow:0 5px 0 color-mix(in srgb,var(--main) 70%,#000)}
.btn.big{font-size:26px;padding:14px 34px}
.btn.ghost{background:#fff;border:2px solid #ebe4f3;box-shadow:none;font-size:17px}
.btn:disabled{opacity:.45}
.tool{border:3px solid #ebe4f3;background:#fff;border-radius:18px;padding:6px 10px;min-width:84px;text-align:center;line-height:1.15;box-shadow:0 4px 0 #ece6f3}
.tool b{font-family:Jua;font-weight:400;font-size:28px;display:block}
.tool small{display:block;font-size:13px;color:#7a6f8c}
.tool.on{border-color:var(--main);background:color-mix(in srgb,var(--main) 12%,#fff);transform:translateY(-3px)}
.tool:disabled{opacity:.4}
.hint{font-size:16px;color:#7a6f8c;text-align:center;margin:6px 0}
.tip{background:#fff7d6;border:2px dashed #f3cf55;border-radius:14px;padding:8px 12px;margin:8px 0;font-size:16px}
/* 겹창 */
.ov{position:fixed;inset:0;z-index:50;background:#2b23407a;display:flex;align-items:center;justify-content:center;padding:12px}
.ov.hide{display:none}
.box{background:var(--soft);border-radius:26px;padding:20px 16px;width:min(620px,100%);max-height:94vh;overflow:auto;text-align:center;box-shadow:0 20px 50px #0004;animation:popin .35s cubic-bezier(.3,1.5,.6,1)}
.box h2{margin:4px 0 8px;font-size:28px}
.big{font-size:70px;line-height:1.1}
.rep{display:grid;grid-template-columns:1fr auto;gap:6px 14px;text-align:left;background:#fff;border-radius:16px;padding:12px 16px;margin:10px 0;font-size:19px}
.rep b{font-family:Jua;font-weight:400;text-align:right}
.rep .tot{border-top:2px dashed #e4dcef;padding-top:6px}
.q{font-size:22px;line-height:1.6;margin:8px 0}
.opts{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:10px}
.opt{border:none;border-radius:16px;background:#fff;box-shadow:0 5px 0 #e3dcec;padding:12px 18px;font-size:22px;font-family:Jua;min-width:90px}
.opt.ok{background:#c9f2cf;box-shadow:0 5px 0 #7bd389}.opt.no{background:#ffd9d9;box-shadow:0 5px 0 #f0a0a0}
.inbox{font:26px Jua,sans-serif;width:min(60vw,230px);text-align:center;padding:10px;border-radius:14px;border:3px solid color-mix(in srgb,var(--main) 45%,#fff)}
.msg{min-height:26px;margin-top:8px;font-size:18px}
.stars{font-size:46px;letter-spacing:4px}
.card{background:#fff;border-radius:26px;padding:22px 18px;box-shadow:0 8px 0 color-mix(in srgb,var(--main) 30%,#fff);text-align:center}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.how div{background:#f7f3fb;border-radius:16px;padding:10px;font-size:16px}
.how b{display:block;font-size:34px;font-family:Jua;font-weight:400}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:8px}
.shopitem{display:flex;flex-direction:column;align-items:center;gap:2px;border:3px solid #ebe4f3;background:#fff;border-radius:18px;padding:10px 8px;box-shadow:0 4px 0 #ece6f3;text-align:center}
.shopitem b{font-size:34px;font-weight:400}.shopitem .nm{font-family:Jua;font-size:18px}.shopitem .nm small{font-size:13px;color:#7a6f8c}.shopitem .ds{font-size:13px;color:#6b6280;line-height:1.35}
.shopitem .pr{margin-top:4px;background:#fff6d6;border-radius:999px;padding:2px 10px;font-family:Jua}.shopitem.full{opacity:.6}.shopitem:disabled{opacity:.45}
.mission{background:linear-gradient(90deg,#efe6ff,#fff);border:2px solid #c9b6f5;border-radius:14px;padding:7px 12px;margin:6px 0;font-size:16px;text-align:center}
.mission span{display:inline-block;margin-left:6px;font-size:14px;color:#7048e8}.mission.done{background:#dff7e3;border-color:#7bd389}
.trash{position:absolute;font-size:24px;border:none;background:none;padding:0;transform:translate(-50%,-50%);z-index:6;animation:tbob 1.6s ease-in-out infinite;cursor:pointer}

@media (max-width:560px){.hud .t{display:none}.btn.big{font-size:22px}}
.farmhouse{position:absolute;left:3%;top:22%;font-size:62px;filter:drop-shadow(0 6px 0 #0002)}.tree1{position:absolute;left:17%;top:28%;font-size:50px}
.field{position:absolute;left:3%;right:31%;bottom:4%;display:grid;gap:7px}
.plot{position:relative;aspect-ratio:1.9/1;border:none;border-radius:12px;background:repeating-linear-gradient(0deg,#8b5a2b 0 7px,#7a4e24 7px 14px);box-shadow:inset 0 -5px 0 #0002;display:flex;align-items:center;justify-content:center;padding:0;transition:transform .15s}
.plot:hover{transform:translateY(-2px)}.plot.wet{background:repeating-linear-gradient(0deg,#5e3a17 0 7px,#4f3013 7px 14px)}
.plot .pl{font-size:clamp(24px,4.6vw,40px);position:relative;display:inline-block}
.plot.ripe{box-shadow:0 0 0 3px #ffe066,0 0 16px #ffe066,inset 0 -5px 0 #0002}
.gauge{position:absolute;left:12%;right:12%;bottom:5px;height:6px;background:#0004;border-radius:6px;overflow:hidden}.gauge u{display:block;height:100%;background:#9be15d;text-decoration:none}
.bug{position:absolute;top:2px;right:6px;font-size:24px}.dropi{position:absolute;top:2px;left:6px;font-size:15px}
.board{position:absolute;right:2%;top:24%;width:27%;background:#fff8e1;border:4px solid #8d6e3f;border-radius:12px;padding:6px 8px;font-size:clamp(11px,1.7vw,15px);line-height:1.45;box-shadow:0 6px 0 #0002}
.board em{color:#e03131;font-style:normal;font-family:Jua}.board b{font-family:Jua;font-weight:400}
.basket{position:absolute;right:9%;bottom:5%;font-size:52px}.basket small{position:absolute;right:-8px;top:-2px;background:#ff6b6b;color:#fff;font:15px Jua;border-radius:999px;padding:0 7px}
.fly{position:absolute;left:0;font-size:22px;animation:fly 11s linear infinite;z-index:4}
@keyframes fly{0%{transform:translate(-30px,0)}25%{transform:translate(25vw,-30px)}50%{transform:translate(48vw,12px)}75%{transform:translate(70vw,-22px)}100%{transform:translate(100vw,0)}}
.night .fly{display:none}
.scare{position:absolute;left:23%;top:22%;font-size:40px}.coop{position:absolute;left:2%;top:46%;font-size:30px;background:#fff8;border-radius:12px;padding:0 4px}
.sprk{position:absolute;bottom:2px;right:4px;font-size:14px;opacity:.85}.field.green{outline:4px solid #b8f0c088;outline-offset:4px;border-radius:14px;background:#ffffff22}
.mission.order{background:linear-gradient(90deg,#fff3d6,#fff);border-color:#f3cf55}
.truck{position:absolute;bottom:1%;left:-35%;font-size:42px;animation:truck 1.3s ease-in forwards;z-index:6;white-space:nowrap}@keyframes truck{to{left:105%}}
</style>

function RNG(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}

function setTime(t){const sky=$('#sky'),sun=$('#sun'),sc=$('#scene');let a=SKY[0],b=SKY[SKY.length-1];for(let i=0;i<SKY.length-1;i++)if(t>=SKY[i][0]&&t<=SKY[i+1][0]){a=SKY[i];b=SKY[i+1];break}
  const k=(t-a[0])/((b[0]-a[0])||1);const mix=(c1,c2)=>{const p=x=>[1,3,5].map(i=>parseInt(x.substr(i,2),16));const A=p(c1),B=p(c2);return'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*k)).join(',')+')'};

  const night=t<.12||t>.9;sc.classList.toggle('night',night);sun.textContent=night?'🌙':'☀️';

    else{const row=h('div','opts');(q.opts||numOpts(q.ans)).forEach(o=>{const b=h('button','opt',typeof o==='number'?o.toLocaleString()+(q.unit||''):o);b.dataset.v=o;b.onclick=()=>{if(b.classList.contains('no')||b.classList.contains('ok'))return;judge(o,b)};row.appendChild(b)});box.append(row,msg)}

function rentToday(){return D.rent?Math.round(D.rent*(1+(S.day-1)*D.rentUp)/D.M)*D.M:0}
function openShop(items,onBuy,title){
  const box=h('div','',`<h2>${title||'🛒 업그레이드 상점'}</h2><div class="hint">가진 돈 <b>${won(S.money)}</b></div>`);const grid=h('div','shopgrid');
  items.forEach(it=>{const full=it.max&&it.lv>=it.max;const b=h('button','shopitem'+(full?' full':''),`<b>${it.e}</b><span class="nm">${it.n}${it.max>1?` <small>Lv ${it.lv}/${it.max}</small>`:it.lv?' <small>✔ 보유</small>':''}</span><span class="ds">${it.d}</span><span class="pr">${full?'최고 단계':won(it.cost)}</span>`);
    b.dataset.s=it.id;if(full||!canPay(it.cost))b.disabled=true;b.onclick=()=>{closeModal();if(!canPay(it.cost)){SND.bad();return}earn(-it.cost,null);S.g.spent=(S.g.spent||0)+it.cost;onBuy(it.id);SND.fan();FX.confetti&&0;banner(`${it.e} ${it.n}!`);save()};grid.appendChild(b)});

function missionBox(){const m=S.g.mis;if(!m)return null;return h('div','mission'+(m.done?' done':''),`🎯 <b>오늘의 미션</b> ${m.t} <span>보상 ${won(m.r)} · ⭐+5</span>`)}
function setMission(pool){if(!pool||!pool.length){S.g.mis=null;return}const k=Math.floor(rnd()*pool.length);const m=pool[k];S.g.mis={k,t:m.t,r:m.r||D.bonus*3,done:false}}
function forecastText(){return S.g.fwx?`🔮 내일 예보: <b>${S.g.fwx}</b>`:''}

let G;   // 게임 모듈
function ensureDay(){rnd=RNG(S.seed+S.day*7919);if(!S.g.inited){G.init();S.g.inited=true}if(S.g.mDay!==S.day){S.g.mDay=S.day;G.newDay();if(G.missions)setMission(G.missions());save()}}
function intro(){
  ensureDay();setTime(.35);clouds(3);G.scene();
  const c=h('div','card');
  c.innerHTML=`<div class="big bob">${INFO.emoji}</div><h1 style="margin:6px 0;color:var(--main);font-size:34px">${INFO.title}</h1><div class="lvpill" style="display:inline-block">${GRADE}학년 · ${LVN[LV]}</div><p style="font-size:19px;line-height:1.7">${D.story}</p><div class="how">${G.how().map(([e,t])=>`<div><b>${e}</b>${t}</div>`).join('')}</div><p class="hint">🎯 목표: ${G.goalText()} · ${D.days}일 안에!</p>`;
  const go=h('button','btn go big',S.day>1&&!S.over?'이어서 하기 ▶':'시작하기 ▶');go.id='startBtn';go.onclick=()=>{if(S.over){S=fresh();save();shownMoney=S.money}morning(true)};
  c.appendChild(go);if(S.day>1&&!S.over){const r=h('button','btn ghost','처음부터');r.onclick=()=>{S=fresh();save();shownMoney=S.money;morning(true)};c.appendChild(r)}
  $('#panel').innerHTML='';$('#panel').appendChild(c);hud();
}
async function morning(first){
  ensureDay();
  setTime(.25);weather(S.g.wx||'sun');G.scene();hud();
  banner(`${S.day}일째 아침 ${G.wxIcon?G.wxIcon():''}`);
  G.panel($('#panel'));
}
async function runDay(){
  $('#panel').querySelectorAll('button').forEach(b=>b.disabled=true);
  const rep=await G.day();               // 애니메이션 + 결과 계산
  setTime(.95);await wait(500);
  const rent=Math.min(rentToday(),Math.max(0,S.money));if(rentToday()){earn(-rent,null);rep.lines.push(['🏠 오늘 임대료'+(rent<rentToday()?' (돈이 모자라 일부만)':''),'−'+won(rent),'#e04848']);rep.net-=rent}
  let misOk=false;if(S.g.mis&&!S.g.mis.done&&G.missions){const pool=G.missions();const m=pool[S.g.mis.k];if(m&&m.test(rep)){misOk=true;S.g.mis.done=true;rep.lines.push(['🎯 미션 성공! '+S.g.mis.t,'+'+won(S.g.mis.r),'#7048e8'])}else rep.lines.push(['🎯 미션 실패',S.g.mis.t,'#adb5bd'])}
  const lines=rep.lines.map(([k,v,c])=>`<span>${k}</span><b style="color:${c||'inherit'}">${v}</b>`).join('');
  const net=rep.net;
  await modal(`<div class="big">${rep.emoji||'🌙'}</div><h2>${S.day}일째 결산</h2><div class="rep">${lines}<span class="tot">오늘 남은 돈</span><b class="tot" style="color:${net>=0?'#1f9d55':'#e04848'}">${net>=0?'+':''}${won(net)}</b></div>${rep.note?`<div class="hint">${rep.note}</div>`:''}`,[['장부 쓰러 가기 ✏️','go']]);
  if(misOk){earn(S.g.mis.r,$('#hMoney'));S.rep=Math.min(100,S.rep+5);FX.confetti();SND.fan();hud()}
  const lq=G.ledger(rep);
  if(lq){const ok=await ask(Object.assign({title:'📒 오늘의 장부',reward:'⭐+3 · '+won(D.bonus)},lq));if(ok){S.rep=Math.min(100,S.rep+3);earn(D.bonus,$('#hMoney'))}}
  const kq=(D.quiz&&D.quiz.length&&S.day%2===0)?D.quiz[(S.day/2-1)%D.quiz.length]:null;
  if(kq){const ok=await ask({title:'🧠 깜짝 퀴즈',text:kq.q,pic:kq.pic,ans:kq.a,opts:shuffle(kq.o),h:kq.h,reward:'⭐+5'});if(ok){S.rep=Math.min(100,S.rep+5);hud();FX.burstOn($('#hRep'),['⭐','✨'],8)}}
  S.hist.push({day:S.day,money:S.money,net});
  S.day++;
  if(S.day>D.days||G.done&&G.done()){return finish()}
  save();morning();
}
async function finish(){
  S.over=true;S.win=G.won();if(S.win&&!S.end)S.end=Date.now();save();hud();
  setTime(.98);G.scene();
  if(S.win){FX.confetti();FX.fireworks(6);SND.fan();markDone()}
  const st=S.win?(G.progress()>=1.3?3:G.progress()>=1.1?2:1):0;
  const file=location.pathname.split('/').pop()||'index.html';
  const c=h('div','card');
  c.innerHTML=`<div class="big bob">${S.win?'🏆':'🌧️'}</div><h1 style="color:var(--main)">${S.win?D.endWin:'아쉬워요!'}</h1><p style="font-size:19px">${S.win?D.endText:'목표에 조금 모자랐어요. 전략을 바꿔서 다시 도전해 봐요!'}</p>
  <div class="stars">${'⭐'.repeat(st)}${'<span style="opacity:.2">⭐</span>'.repeat(3-st)}</div>
  <div class="rep" style="max-width:420px;margin:10px auto">${G.summary().map(([k,v])=>`<span>${k}</span><b>${v}</b>`).join('')}</div>
  ${S.win&&LV!=='hard'?`<a class="btn go" href="${file}?lv=${LV==='easy'?'normal':'hard'}">다음 단계 ${LV==='easy'?'🟡 보통':'🔴 어려움'} 도전 →</a>`:''}
  <a class="btn" href="index.html">🏠 게임 교실로</a><button class="btn ghost" id="again">처음부터 다시</button>`;
  $('#panel').innerHTML='';$('#panel').appendChild(c);
  $('#again').onclick=()=>{S=fresh();save();shownMoney=S.money;morning(true)};
  c.scrollIntoView({behavior:FAST?'auto':'smooth'});
}
function markDone(){try{const id=GAME+'@'+LV;if(localStorage.getItem('class-done-skip-'+id)===String(S.end))return;const d=JSON.parse(localStorage.getItem('class-done')||'{}')||{};if(!d[id]){d[id]={how:'auto',at:new Date().toISOString()};localStorage.setItem('class-done',JSON.stringify(d))}}catch(e){}}

<script>

    if(!p.c&&g.tool!=='water'){const c=CROP[g.tool];if(!c){SND.bad();return}if(!canPay(c.cost)){SND.bad();FX.floatOn(el,'돈이 모자라요','#e04848');return}
      earn(-c.cost,null);g.spent+=c.cost;p.c=c.id;p.age=0;p.dry=0;p.w=g.wx==='rain'||g.wx==='storm'||i<g.up.spr*3;SND.pop();FX.burstOn(el,['🟫','✨'],5);this.scene();save();return}
    if(p.c&&!p.dead&&g.tool==='water'){if(p.w){FX.floatOn(el,'이미 촉촉해요','#3a7bd5');return}if(g.waterLeft<=0){SND.bad();FX.floatOn(el,'물이 없어요','#e04848');return}
      p.w=true;g.waterLeft--;SND.splash();FX.burstOn(el,['💧','💦'],8);this.scene();this.panel($('#panel'));save();return}
    if(p.c&&!p.dead){FX.floatOn(el,`${CROP[p.c].n} 자라는 중 (${p.age}/${CROP[p.c].days})`,'#6b5b95')}else SND.click();
  },
  missions(){const g=S.g;return[
    {t:'벌레 없이 하루 보내기',test:r=>r.bugsLeft===0},
    {t:'작물 3개 이상 팔기',test:r=>r.soldN>=3},
    {t:'시든 작물 없이 하루 보내기',test:r=>r.died===0&&r.growing>0},
    {t:`오늘 ${won(D.crops[1].sell*2)} 넘게 벌기`,test:r=>r.rev>=D.crops[1].sell*2},
  ]},
  async day(){
    const g=S.g;this.autoWater();weather(g.wx);this.scene();
    for(let t=.3;t<=.8;t+=.1){setTime(t);await wait(260)}
    let died=0,grew=0,broke=0;const bugsLeft=g.plots.filter(p=>p.bug).length;
    g.plots.forEach(p=>{if(!p.c||p.dead)return;const c=CROP[p.c];
      if(g.wx==='storm'&&!g.up.green&&rnd()<.4){p.dead=true;broke++;return}
      if(p.age>=c.days)return;
      if(p.bug){p.dry=0;return}
      if(p.w){p.age++;p.dry=0;grew++}
      else if(g.wx==='heat'&&!g.up.green){p.dead=true;died++}
      else{p.dry++;if(p.dry>=2){p.dead=true;died++}}});
    g.dead+=died+broke;
    this.scene();document.querySelectorAll('.plot .pl').forEach(e=>e.classList.add('popin'));
    if(grew)SND.pop();if(broke){banner('🌪️ 태풍 피해!');SND.boom()}await wait(700);
    setTime(.88);await wait(300);
    // 달걀
    let eggRev=0;if(g.up.coop){const n=3*g.up.coop;g.eggs+=n;eggRev=n*D.eggP;const ce=document.querySelector('.coop');if(ce)FX.burstOn(ce,['🥚','🐣'],6)}
    const feed=g.up.coop*D.feed;
    const items=Object.entries(g.basket).filter(([k,v])=>v>0);
    let rev=0;const lines=[];
    if(items.length){const tr=h('div','truck','🚚'+items.map(([k])=>CROP[k].e).join(''));$('#world').appendChild(tr);await wait(1300);
      items.forEach(([k,v])=>{const pr=this.price(k);rev+=pr*v;lines.push([`${CROP[k].e} ${CROP[k].n} ${v}개 × ${won(pr)}`,won(pr*v),'#1f9d55'])});tr.remove()}
    else lines.push(['🧺 오늘 판 작물','없음']);
    // 주문
    let ob=0;const o=g.order;if(o&&!o.done&&o.due>=S.day&&g.basket[o.id]){o.got=Math.min(o.q,o.got+g.basket[o.id]);if(o.got>=o.q){o.done=true;ob=o.bonus;g.ordersDone++;lines.push([`📋 식당 주문 완료! ${CROP[o.id].e}×${o.q}`,'+'+won(ob),'#7048e8'])}}
    if(eggRev)lines.push([`🥚 달걀 ${3*g.up.coop}개 × ${won(D.eggP)}`,won(eggRev),'#1f9d55']);
    earn(rev+eggRev+ob,$('#basket'));
    if(feed){earn(-feed,null);lines.push(['🐔 닭 사료','−'+won(feed),'#e04848'])}
    if(g.spent)lines.push(['🌰 씨앗·설비에 쓴 돈','−'+won(g.spent),'#e04848']);
    if(died)lines.push(['🥀 시든 작물',died+'개','#e04848']);if(broke)lines.push(['🌪️ 태풍에 망가진 작물',broke+'개','#e04848']);
    g.rev=rev;const sold=items.map(([k,v])=>({id:k,n:CROP[k].n,q:v,p:this.price(k),cost:CROP[k].cost,sell:CROP[k].sell}));g.basket={};
    const growing=g.plots.filter(p=>p.c&&!p.dead).length;
    save();
    return{lines,net:rev+eggRev+ob-feed-g.spent,emoji:rev>0?'💰':'🌙',sold,spent:g.spent,rev,died:died+broke,bugsLeft,soldN:items.reduce((a,[k,v])=>a+v,0),growing,
      note:broke?'비닐하우스가 있으면 태풍을 막을 수 있어요!':died?'물을 주지 않으면 작물이 시들어요!':''};
  },
  ledger(r){
    const s=r.sold,P=S.g.plots;
    const growing=P.filter(p=>p.c&&!p.dead).length;
    if(GRADE===1){if(s.length>=2)return{text:`오늘 ${s[0].n} <b>${s[0].q}개</b>와 ${s[1].n} <b>${s[1].q}개</b>를 팔았어요.<br>모두 몇 개를 팔았을까요?`,ans:s[0].q+s[1].q,unit:'개'};
      if(growing<P.length)return{text:`밭은 모두 <b>${P.length}칸</b>이에요. 그중 <b>${growing}칸</b>에 작물이 있어요.<br>비어 있는 밭은 몇 칸일까요?`,ans:P.length-growing,unit:'칸',pic:'🟫'};
      return{text:`밭 <b>${P.length}칸</b>에 모두 작물이 자라요. 밭을 <b>3칸</b> 더 늘리면 모두 몇 칸일까요?`,ans:P.length+3,unit:'칸',pic:'🟫'}}
    if(GRADE===2){const t=s.find(x=>x.p<=9&&x.q<=9);if(t)return{text:`${josa(t.n,'을','를')} <b>${t.q}개</b> 팔았어요. 1개에 <b>${t.p}코인</b>이면 모두 몇 코인일까요?`,ans:t.q*t.p,unit:'코인',h:`${t.p}단 곱셈구구`};
      if(r.spent||r.rev)return{text:`씨앗에 <b>${r.spent}코인</b>을 쓰고, 시장에서 <b>${r.rev}코인</b>을 벌었어요.<br>번 돈과 쓴 돈의 차이는 몇 코인일까요?`,ans:Math.abs(r.rev-r.spent),unit:'코인',h:'큰 수에서 작은 수를 빼요'};
      return{text:`밭 <b>${P.length}칸</b>에 물을 <b>2번</b>씩 주면 모두 몇 번일까요?`,ans:P.length*2,unit:'번',h:'2단 곱셈구구'}}
    if(GRADE===3){const t=s[0];if(t)return{text:`${t.n} <b>${t.q}개</b>를 1개에 <b>${won(t.p)}</b>씩 팔았어요. 모두 얼마일까요?`,ans:t.q*t.p,unit:U,h:`${t.p} × ${t.q}`};
      return{text:`닭장 한 곳에서 하루에 달걀이 <b>3개</b>씩 나와요. 닭장 <b>4곳</b>에서 <b>7일</b> 동안 나오는 달걀은 모두 몇 개일까요?`,ans:84,unit:'개',pic:'🐔🥚',h:'3 × 4 × 7'}}
    if(GRADE===4){if(s.length&&r.rev>=r.spent)return{text:`오늘 시장에서 <b>${josa(won(r.rev),'을','를')}</b> 벌고, 씨앗과 설비에 <b>${josa(won(r.spent),'을','를')}</b> 썼어요. 오늘 남은 돈(번 돈 − 쓴 돈)은?`,ans:r.rev-r.spent,unit:U,h:'번 돈에서 쓴 돈을 빼요'};
      return{text:`밭 한 칸을 늘리는 데 <b>${josa(won(D.plotCost),'이','가')}</b> 들어요. <b>12칸</b>을 늘리려면 모두 얼마가 들까요?`,ans:D.plotCost*12,unit:U}}
    if(GRADE===5){const t=s.find(x=>x.id===S.g.sp);if(t)return{text:`${josa(t.n,'은','는')} 오늘 특가로 원래 값의 <b>1.5배</b>예요. 원래 값이 <b>${josa(won(t.sell),'이면','면')}</b> 오늘 값은?`,ans:Math.round(t.sell*1.5),unit:U,h:`${t.sell} × 1.5`};
      const hs=S.hist.slice(-2).concat([{net:r.net}]);if(hs.length>=2&&hs.every(x=>x.net>0)){const sum=hs.reduce((a,b)=>a+b.net,0);if(sum%hs.length===0)return{text:`최근 <b>${hs.length}일</b> 동안 남은 돈이 ${hs.map(x=>won(x.net)).join(', ')}이에요. 하루 평균 얼마일까요?`,ans:sum/hs.length,unit:U,h:'모두 더해서 날수로 나눠요'}}
      return{text:`씨앗 1개가 <b>${josa(won(D.crops[0].cost),'이에요','예요')}</b>. 씨앗 <b>2.5배</b>의 값은?`,ans:D.crops[0].cost*2.5,unit:U}}
    const t=s[0]||{n:D.crops[1].n,cost:D.crops[1].cost,sell:D.crops[1].sell};
    return{text:`${t.n} 씨앗값은 <b>${won(t.cost)}</b>, 원래 판매 값은 <b>${josa(won(t.sell),'이에요','예요')}</b>.<br>이익(판매 값 − 씨앗값)은 씨앗값의 몇 %일까요?`,ans:Math.round((t.sell-t.cost)/t.cost*100),unit:'%',h:'이익 ÷ 씨앗값 × 100'};
  },
  bot(){
    const g=S.g,left=D.days-S.day;const el=i=>document.querySelector(`.plot[data-i="${i}"]`);
    g.plots.forEach((p,i)=>{if(p.bug)this.tap(i,el(i))});
    g.plots.forEach((p,i)=>{if(p.c&&!p.dead&&p.age>=CROP[p.c].days)this.tap(i,el(i))});
    const tryBuy=(id,cost,ok)=>{if(ok&&canPay(cost)&&S.money-cost>D.crops[0].cost*4){earn(-cost,null);g.spent+=cost;this.buy(id);return true}return false};
    if(left>=4){tryBuy('spr',D.sprCost,F.has('sprinkler')&&g.up.spr<Math.ceil(g.plots.length/3));tryBuy('scare',D.scareCost,F.has('scare')&&!g.up.scare);
      tryBuy('green',D.greenCost,F.has('greenhouse')&&!g.up.green&&left>=6);tryBuy('coop',D.coopCost,F.has('coop')&&g.up.coop<1&&left>=8)}
    if(g.plots.length<D.maxPlots&&left>=5&&S.money>D.plotCost*2.5){document.querySelector('.tool[data-t="plot"]')?.click()}
    g.plots.forEach((p,i)=>{if(!p.c){const ok=D.crops.filter(c=>c.days<=left&&canPay(c.cost)).sort((a,b)=>(b.sell-b.cost)/b.days-(a.sell-a.cost)/a.days);
      const o=g.order;const pref=o&&!o.done&&ok.find(c=>c.id===o.id&&S.day+c.days<=o.due)&&g.plots.filter(q=>q.c===o.id).length<o.q-o.got?o.id:null;
      if(ok.length){g.tool=pref||ok[0].id;this.tap(i,el(i))}}});
    this.autoWater();g.tool='water';g.plots.forEach((p,i)=>{if(p.c&&!p.dead&&!p.w&&p.age<CROP[p.c].days&&g.waterLeft>0)this.tap(i,el(i))});
    this.panel($('#panel'));
  },
};

</script>
<script>
G=GAMEDEF;
if(S.over){G.scene();hud();finish()}else intro();
</script>
