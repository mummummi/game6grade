<!DOCTYPE html>
<html lang="ko">
<head>
<script>(function(){var P='g6-',S=Storage.prototype,G=S.getItem,T=S.setItem,R=S.removeItem;S.getItem=function(k){return G.call(this,P+k)};S.setItem=function(k,v){return T.call(this,P+k,v)};S.removeItem=function(k){return R.call(this,P+k)}})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>기억력 짝꿍 카드 · 6학년</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--main:#c792ea;--ink:#f4f1ff;--bg1:#171a33;--bg2:#0e1022;--card:#22264a;--line:#363c6e;--good:#5eea9a;--bad:#ff5a6e}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font-family:'Gowun Dodum',system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 50% -20%,color-mix(in srgb,var(--main) 35%,var(--bg1)),var(--bg2) 70%);min-height:100vh;font-size:18px;-webkit-tap-highlight-color:transparent;overflow-x:hidden;user-select:none;-webkit-user-select:none}
h1,h2,h3,.jua,button,.hud{font-family:'Jua','Gowun Dodum',sans-serif;font-weight:400}
button{font:inherit;color:inherit;cursor:pointer;border:0}
.hud{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;background:#0e1022cc;backdrop-filter:blur(6px);border-bottom:2px solid var(--line)}
.hud a{text-decoration:none;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 11px}
.hud .t{font-size:19px;white-space:nowrap}
.chip{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px 11px;font-size:17px;white-space:nowrap;font-family:Jua}
.lvpill{background:var(--main);color:#14122a;border-radius:999px;padding:3px 10px;font-size:14px}
.sp{flex:1}
.ib{background:var(--card);border:2px solid var(--line);border-radius:50%;width:36px;height:36px;padding:0;font-size:17px}
.ib.off{opacity:.45}
#app{max-width:1100px;margin:0 auto;padding:10px}
.btn{background:var(--main);color:#14122a;border-radius:16px;padding:12px 22px;font-size:21px;box-shadow:0 5px 0 color-mix(in srgb,var(--main) 55%,#000);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--main) 55%,#000)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 5px 0 #0007;border:2px solid var(--line)}
.panel{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px}
.center{text-align:center}.muted{opacity:.7}
.intro{max-width:720px;margin:20px auto;text-align:center}
.intro .big{font-size:90px;line-height:1.1;filter:drop-shadow(0 6px 16px #0008)}
.intro h1{font-size:40px;margin:6px 0;color:var(--main)}
.intro p{line-height:1.7}
.rules{text-align:left;background:#0003;border-radius:16px;padding:12px 18px;margin:14px 0;line-height:1.8}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.qbox{background:#0b0d1dcc;border:3px solid var(--line);border-radius:18px;padding:12px 16px;text-align:center;font-family:Jua;font-size:26px;line-height:1.35;margin:8px auto;max-width:900px}
.qbox small{display:block;font-size:15px;opacity:.75;font-family:'Gowun Dodum'}
.hearts{letter-spacing:2px}
.modal{position:fixed;inset:0;z-index:90;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .panel{max-width:480px;width:100%;text-align:center}
.stars{font-size:46px;letter-spacing:6px}
#err{display:none;position:fixed;inset:0;z-index:99;background:#000c;align-items:center;justify-content:center;text-align:center}
.fx{position:fixed;z-index:80;pointer-events:none;font-family:Jua;transform:translate(-50%,-50%);white-space:nowrap}
.float{animation:floatUp 1s ease-out forwards;font-size:28px;text-shadow:0 2px 0 #000,0 0 8px #000}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-180%) scale(1)}}
.shake{animation:shake .35s}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.popin{animation:popin .35s cubic-bezier(.2,1.6,.4,1)}@keyframes popin{from{transform:scale(.6);opacity:0}}
.conf{position:fixed;top:-20px;z-index:95;width:10px;height:14px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

.board{display:grid;gap:10px;grid-template-columns:repeat(var(--c),1fr);max-width:820px;margin:10px auto}
.card{position:relative;aspect-ratio:4/3;perspective:600px;cursor:pointer}
.card .in{position:absolute;inset:0;transition:transform .4s;transform-style:preserve-3d}
.card.up .in,.card.got .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;border-radius:16px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;padding:6px;box-shadow:0 5px 0 #0007}
.card .f{background:linear-gradient(135deg,var(--main),color-mix(in srgb,var(--main) 50%,#3b2a7a));font-size:clamp(26px,5vw,42px);border:3px solid #ffffff44}
.card .b{transform:rotateY(180deg);background:#fff7e6;color:#1a1530;font-family:Jua;font-size:var(--fs);line-height:1.15;word-break:keep-all;border:3px solid #ffd166}
.card .b.s1{background:#e6f4ff;border-color:#7fc8ff}
.card.got .b{background:#d9ffe9;border-color:var(--good)}
.card.got{animation:popin .35s}
.card.miss .b{border-color:var(--bad)}
.card.miss{animation:shake .35s}
.legend{text-align:center;font-size:15px;opacity:.8}
.legend span{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:middle;margin:0 4px}

</style>
</head>
<body>
<div class="hud"><a href="index.html">🏠</a><span class="t">🃏 기억력 짝꿍 카드</span><span class="lvpill" id="lvPill"></span><span class="sp"></span><span id="hudX"></span><button class="ib" id="tts" title="문제 읽어 주기">🗣️</button><button class="ib" id="mute" title="소리">🔊</button></div>
<div id="app"></div>
<div id="err"><div class="panel"><h2>앗, 문제가 생겼어요 😢</h2><p>게임이 업데이트되었거나 저장 정보가 꼬였을 수 있어요.</p><button class="btn" id="errReset">처음부터 다시 하기</button></div></div>
<script>
const GRADE=6,GAME='quiz-memory',KEY='quiz-memory-v1',TITLE='기억력 짝꿍 카드',EMOJI='🃏';
const DATA=[["3/4 ÷ 3","1/4"],["2.4 ÷ 0.6","4"],["0.35","35%"],["2:3=4:□","6"],["원주","지름×원주율"],["원의 넓이","반지름×반지름×원주율"],["각뿔의 밑면","1개"],["자전","낮과 밤"],["공전","계절별 별자리 변화"],["산소","타는 것을 도움"],["이산화 탄소","석회수를 뿌옇게"],["심장","혈액 순환"],["국회","입법"],["법원","사법"]];
</script>
<script>
'use strict';
const $=s=>document.querySelector(s);
const LVN={easy:'🟢 쉬움',normal:'🟡 보통',hard:'🔴 어려움'};
const QS=new URLSearchParams(location.search);
let LV=QS.get('lv');if(!LVN[LV]){try{LV=localStorage.getItem('class-level')}catch(e){}}if(!LVN[LV])LV='normal';
const FAST=QS.get('fast')==='1';
const SKEY=LV==='normal'?KEY:KEY+'-'+LV;
const SAVE_V=1;
const L=(e,n,h)=>LV==='easy'?e:LV==='hard'?h:n;
/* 저학년일수록 느긋하게 */
const GS={1:1.35,2:1.2,3:1.1,4:1,5:.95,6:.9}[GRADE]||1;
const T=ms=>FAST?Math.min(ms,60):ms;
$('#lvPill').textContent=LVN[LV];
window.addEventListener('error',e=>{console.error(e.message);$('#err').style.display='flex'});
$('#errReset').onclick=()=>{try{localStorage.removeItem(SKEY)}catch(e){}location.href=location.pathname+'?lv='+LV};
function fresh(){return{v:SAVE_V,end:0,wins:0,best:0,plays:0}}
function loadSave(){try{if(QS.get('reset')==='1')localStorage.removeItem(SKEY);const s=JSON.parse(localStorage.getItem(SKEY));if(s&&s.v===SAVE_V)return Object.assign(fresh(),s)}catch(e){}return fresh()}
const S=loadSave();
function save(){try{localStorage.setItem(SKEY,JSON.stringify(S))}catch(e){}}
function markDone(){try{const id=GAME+'@'+LV;if(localStorage.getItem('class-done-skip-'+id)===String(S.end))return;const d=JSON.parse(localStorage.getItem('class-done')||'{}')||{};if(!d[id]){d[id]={how:'auto',at:new Date().toISOString()};localStorage.setItem('class-done',JSON.stringify(d))}}catch(e){}}
function h(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c])}
/* 소리 */
let MUTE=false;try{MUTE=localStorage.getItem('arc-mute')==='1'}catch(e){}
$('#mute').textContent=MUTE?'🔇':'🔊';$('#mute').onclick=()=>{MUTE=!MUTE;$('#mute').textContent=MUTE?'🔇':'🔊';try{localStorage.setItem('arc-mute',MUTE?'1':'0')}catch(e){}};
let AC=null;function tone(f,d,type,vol,delay){if(MUTE||FAST)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);g.gain.setValueAtTime(vol||.15,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d)}catch(e){}}
const SND={good:()=>{tone(660,.12,'triangle');tone(990,.18,'triangle',.15,.08)},bad:()=>tone(160,.3,'sawtooth',.12),pop:()=>tone(880,.08,'square',.08),win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.15,i*.12)),lose:()=>[392,330,262].forEach((f,i)=>tone(f,.3,'sine',.15,i*.18)),tick:()=>tone(1200,.04,'square',.05)};
/* 문제 읽어 주기 (1·2학년은 기본으로 켜짐) */
let TTS=GRADE<=2;try{const v=localStorage.getItem('quiz-tts');if(v!=null)TTS=v==='1'}catch(e){}
const HAS_TTS='speechSynthesis' in window;
function ttsBtn(){$('#tts').classList.toggle('off',!TTS);$('#tts').title=TTS?'문제 읽어 주기 켜짐':'문제 읽어 주기 꺼짐'}
if(!HAS_TTS)$('#tts').style.display='none';
$('#tts').onclick=()=>{TTS=!TTS;try{localStorage.setItem('quiz-tts',TTS?'1':'0')}catch(e){}ttsBtn();if(!TTS)try{speechSynthesis.cancel()}catch(e){}};ttsBtn();
function speak(t,force){if(!HAS_TTS||FAST||(!TTS&&!force))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(t).replace(/[^\p{L}\p{N}\s.,?!%°×÷+\-=:/()·]/gu,' ').replace(/×/g,' 곱하기 ').replace(/÷/g,' 나누기 '));u.lang='ko-KR';u.rate=GRADE<=2?.9:1;speechSynthesis.speak(u)}catch(e){}}
/* 효과 */
function floatTxt(x,y,txt,color){const e=h('div','fx float',txt);e.style.left=x+'px';e.style.top=y+'px';if(color)e.style.color=color;document.body.appendChild(e);setTimeout(()=>e.remove(),1000)}
function confetti(){if(FAST)return;const cs=['#ffd166','#ff8a5c','#5eea9a','#7fc8ff','#c792ea','#ff5a6e'];for(let i=0;i<70;i++){const c=h('div','conf');c.style.left=Math.random()*100+'vw';c.style.background=cs[i%cs.length];c.style.animationDuration=(1.6+Math.random()*1.6)+'s';c.style.animationDelay=Math.random()*.4+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),3600)}}
function heartsTxt(n,max){return '❤️'.repeat(Math.max(0,n))+'🤍'.repeat(Math.max(0,max-n))}
function hud(html){$('#hudX').innerHTML=html}
/* 시작 화면 */
function intro(desc,rules,onStart,extra){hud('');const a=$('#app');a.innerHTML='';const box=h('div','intro panel popin',`<div class="big">${EMOJI}</div><h1>${TITLE}</h1><p>${desc}</p><div class="rules">${rules.map(r=>'• '+r).join('<br>')}</div>${S.wins?`<p class="muted">🏆 지금까지 ${S.wins}번 성공 · 최고 ${S.best}점</p>`:''}<div class="row" id="startRow"></div>`);a.appendChild(box);
  const row=box.querySelector('#startRow');(extra||[[ '▶ 시작하기',onStart]]).forEach(([t,f],i)=>{const b=h('button','btn'+(i?' ghost':''),t);b.onclick=()=>{try{AC=AC||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}f()};row.appendChild(b)});if(FAST)setTimeout(()=>row.querySelector('button').click(),10)}
/* 결과 화면 */
function finish(win,score,stars,msg){if(win){S.end=Date.now();S.wins++;markDone();confetti();SND.win()}else SND.lose();S.plays++;if(score>S.best)S.best=score;save();try{speechSynthesis.cancel()}catch(e){}
  const md=h('div','modal',`<div class="panel popin"><div style="font-size:70px">${win?'🏆':'💦'}</div><h2 style="font-size:32px;margin:6px 0;color:${win?'var(--good)':'var(--bad)'}">${win?'성공!':'아쉬워요!'}</h2>${win?`<div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>`:''}<p style="font-size:20px">${msg||''}<br>점수 <b>${score}</b>점 · 최고 ${S.best}점</p>${win?'<p class="muted">완료 기록이 저장되었어요! 🎉</p>':''}<div class="row"><button class="btn" id="again">🔁 다시 하기</button><a class="btn ghost" href="index.html" style="text-decoration:none">🏠 게임 교실</a></div></div>`);
  document.body.appendChild(md);md.querySelector('#again').onclick=()=>{md.remove();start()}}
</script>
<script>

const PAIRS=L(6,8,10),PREVIEW=L(4000,2000,0),TLIM=LV==='easy'?0:Math.round(L(0,200,140)*GS);
let G=null;
function stop(){if(!G)return;G.over=true;clearInterval(G.tm)}
function start(){stop();intro('뒤집힌 카드 두 장을 골라 <b>서로 짝이 되는 카드</b>를 찾아요. 문제 카드와 답 카드, 낱말과 뜻이 짝이에요!',[`짝 ${PAIRS}쌍 · 노란 카드와 파란 카드가 한 짝이에요`,PREVIEW?`시작하면 ${PREVIEW/1000}초 동안 모든 카드를 보여 줘요`:'미리 보기 없이 바로 시작해요',TLIM?`제한 시간 ${TLIM}초 안에 모두 찾아요`:'시간 제한이 없어요. 천천히 찾아요','적게 뒤집을수록 별을 많이 받아요'],play)}
function play(){const ps=shuffle(DATA).slice(0,PAIRS);const cards=shuffle(ps.flatMap((p,i)=>[{t:p[0],k:i,s:0},{t:p[1],k:i,s:1}]));
  G={cards,open:[],moves:0,found:0,lock:true,left:TLIM,over:false};const a=$('#app');a.innerHTML='';
  a.appendChild(h('div','legend',`<span style="background:#fff7e6"></span>문제·낱말 카드 <span style="background:#e6f4ff"></span>답·뜻 카드 — 노랑 1장 + 파랑 1장이 한 짝`));
  const bd=h('div','board');bd.style.setProperty('--c',cards.length>16?5:4);a.appendChild(bd);
  cards.forEach((c,i)=>{const len=[...c.t].length;const el=h('div','card',`<div class="in"><div class="f">❓</div><div class="b s${c.s}" style="--fs:${len>12?15:len>7?18:len>3?24:34}px">${esc(c.t)}</div></div>`);el.onclick=()=>flip(i);c.el=el;bd.appendChild(el)});
  upHud();
  if(PREVIEW){cards.forEach(c=>c.el.classList.add('up'));setTimeout(()=>{if(G.over)return;cards.forEach(c=>c.el.classList.remove('up'));go()},T(PREVIEW))}else go()}
function go(){G.lock=false;if(TLIM)G.tm=setInterval(()=>{if(G.over)return;G.left--;if(G.left<=10&&G.left>0)SND.tick();upHud();if(G.left<=0){stop();finish(false,G.found*30,0,'시간이 다 됐어요. 다시 도전해 봐요!')}},T(1000))}
function upHud(){hud(`<span class="chip">🃏 ${G.found}/${PAIRS}</span> <span class="chip">👆 ${G.moves}번</span>${TLIM?` <span class="chip">⏱ ${G.left}</span>`:''}`)}
function flip(i){const c=G.cards[i];if(G.lock||G.over||c.got||G.open.includes(c))return;c.el.classList.add('up');SND.pop();speak(c.t);G.open.push(c);
  if(G.open.length<2)return;G.moves++;const [x,y]=G.open;G.open=[];
  if(x.k===y.k&&x.s!==y.s){x.got=y.got=true;G.found++;setTimeout(()=>{x.el.classList.add('got');y.el.classList.add('got');SND.good()},250);upHud();
    if(G.found===PAIRS){stop();const st=G.moves<=PAIRS*1.5?3:G.moves<=PAIRS*2.2?2:1;const score=Math.max(0,PAIRS*30-(G.moves-PAIRS)*5)+(TLIM?G.left:0);setTimeout(()=>finish(true,score,st,`${G.moves}번 만에 짝 ${PAIRS}쌍을 모두 찾았어요!`),T(700))}}
  else{G.lock=true;upHud();setTimeout(()=>{x.el.classList.add('miss');y.el.classList.add('miss');SND.bad()},300);setTimeout(()=>{[x,y].forEach(c=>c.el.classList.remove('up','miss'));G.lock=false},T(1200))}}
start();

</script>
</body>
</html>
