<!DOCTYPE html>
<html lang="ko">
<head>
<script>(function(){var P='g6-',S=Storage.prototype,G=S.getItem,T=S.setItem,R=S.removeItem;S.getItem=function(k){return G.call(this,P+k)};S.setItem=function(k,v){return T.call(this,P+k,v)};S.removeItem=function(k){return R.call(this,P+k)}})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>우리 반 · 6학년</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--main:#f2c14e;--ink:#f4f1ff;--card:#22264a;--line:#363c6e}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'Gowun Dodum',system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 50% -10%,color-mix(in srgb,var(--main) 32%,#171a33),#0e1022 70%) fixed;min-height:100vh;font-size:18px}
h1,h2,h3,button,.jua{font-family:'Jua','Gowun Dodum',sans-serif;font-weight:400}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0}
.top{position:sticky;top:0;z-index:30;display:flex;gap:8px;align-items:center;padding:8px 14px;background:#0e1022d9;backdrop-filter:blur(6px);border-bottom:2px solid var(--line)}
.top a{color:var(--ink);text-decoration:none;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 12px}
.top .t{font-family:Jua;font-size:20px}.sp{flex:1}
.wrap{max-width:1100px;margin:0 auto;padding:14px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px}
.panel h2{margin:0 0 10px;font-size:24px}
.btn{background:var(--main);color:#14122a;border-radius:14px;padding:10px 18px;font-size:19px;box-shadow:0 4px 0 color-mix(in srgb,var(--main) 50%,#000)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0006}
.btn.ghost{background:#2e3364;color:var(--ink);box-shadow:0 4px 0 #0008;border:2px solid var(--line)}
.btn.sm{font-size:15px;padding:6px 12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{background:#0b0d1d;border:2px solid var(--line);border-radius:12px;padding:9px 12px;font-size:18px;width:100%}
textarea{min-height:120px;resize:vertical}
label{display:block;margin:10px 0 4px;opacity:.85}
.grid{display:grid;gap:10px}.g2{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}.g4{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.muted{opacity:.7}.center{text-align:center}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{display:inline-block;background:#ffffff14;border:1px solid #ffffff2a;border-radius:999px;padding:3px 11px;font-size:15px;margin:2px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button{background:#2e3364;border:2px solid var(--line);border-radius:14px;padding:9px 15px;font-size:18px}.tabs button.on{background:var(--main);color:#14122a;border-color:var(--main)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#000d;border:2px solid var(--main);border-radius:16px;padding:12px 22px;z-index:200;font-family:Jua;font-size:20px;animation:tin .3s}
@keyframes tin{from{opacity:0;transform:translate(-50%,20px)}}
.modal{position:fixed;inset:0;background:#000a;z-index:150;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .panel{max-width:640px;width:100%;max-height:92vh;overflow:auto}
.big-code{font-family:Jua;font-size:clamp(28px,6vw,46px);letter-spacing:3px;background:#0b0d1d;border:3px dashed var(--main);border-radius:16px;padding:12px;text-align:center;word-break:break-all}
.conf{position:fixed;top:-40px;z-index:300;font-size:26px;pointer-events:none;animation:fall 2.6s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(600deg)}}

.notice{background:#4a3a10;border-color:#ffd166;font-size:20px}
.boss{font-size:110px;filter:drop-shadow(0 8px 14px #000a);animation:bob 2.4s ease-in-out infinite}.boss.dead{filter:grayscale(1);opacity:.5;animation:none;transform:rotate(90deg)}@keyframes bob{50%{transform:translateY(-10px)}}
.hp{position:relative;height:30px;background:#0007;border-radius:999px;overflow:hidden;border:2px solid #ff5a6e;margin:8px 0}.hp i{display:block;height:100%;background:linear-gradient(90deg,#ff1744,#ff8a80);transition:width .8s}.hp span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:Jua;font-size:17px;text-shadow:0 1px 2px #000}
.mission{font-family:Jua;font-size:28px;background:#0b0d1d;border:3px dashed var(--main);border-radius:18px;padding:18px;margin:10px 0}
.wheel{position:relative;width:220px;height:220px;margin:10px auto}.wi{width:100%;height:100%;border-radius:50%;background:conic-gradient(#ef5350 0 12.5%,#ffa726 0 25%,#ffee58 0 37.5%,#66bb6a 0 50%,#42a5f5 0 62.5%,#7e57c2 0 75%,#ec407a 0 87.5%,#26c6da 0);border:6px solid #fff;position:relative}
.wi span{position:absolute;left:50%;top:50%;font-size:24px;line-height:1;transform-origin:0 0}
.wp{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:30px;color:#fff;text-shadow:0 2px 0 #000}
.shop{background:#2e3364;border:2px solid var(--line);border-radius:18px;padding:12px;color:var(--ink);transition:transform .1s}.shop:not(:disabled):hover{transform:translateY(-3px);border-color:var(--main)}.shop:disabled{opacity:.45}.shop .cost{color:#ffd54f;font-family:Jua;margin-top:4px}
.ticket{background:repeating-linear-gradient(45deg,#3b2d10,#3b2d10 10px,#46361a 10px,#46361a 20px);border:2px dashed #ffd54f;border-radius:14px;padding:12px}.ticket.used{opacity:.5}.ticket .tc{font-family:Jua;font-size:26px;letter-spacing:2px;color:#ffd54f}

</style>
<script src="hub-config.js"></script>
<script>window.HUB_GRADE=6;window.HUB_GAMES=[{"id": "g6-airport", "cat": "esc", "e": "✈️", "t": "세계 일주 공항", "f": "g6-airport.html"}, {"id": "g6-body", "cat": "esc", "e": "🫀", "t": "인체 탐험 캡슐", "f": "g6-body.html"}, {"id": "g6-bank", "cat": "esc", "e": "🏦", "t": "은행 금고 대작전", "f": "g6-bank.html"}, {"id": "g6-moon", "cat": "esc", "e": "🌒", "t": "달빛 천문대", "f": "g6-moon.html"}, {"id": "g6-invent", "cat": "esc", "e": "💡", "t": "발명가의 전기 공방", "f": "g6-invent.html"}, {"id": "defense", "cat": "arc", "e": "🏰", "t": "계산 디펜스", "f": "defense.html"}, {"id": "race", "cat": "arc", "e": "🏎️", "t": "계산 레이싱 그랑프리", "f": "race.html"}, {"id": "idle", "cat": "arc", "e": "👑", "t": "꼬마 왕국 키우기", "f": "idle.html"}, {"id": "quiz-balloon", "cat": "quiz", "e": "🎈", "t": "정답 풍선 팡팡", "f": "balloon.html"}, {"id": "quiz-sort", "cat": "quiz", "e": "🏭", "t": "척척 분류 공장", "f": "sort.html"}, {"id": "quiz-tug", "cat": "quiz", "e": "🪢", "t": "우리 반 줄다리기 퀴즈", "f": "tug.html"}, {"id": "quiz-memory", "cat": "quiz", "e": "🃏", "t": "기억력 짝꿍 카드", "f": "memory.html"}, {"id": "quiz-ox", "cat": "quiz", "e": "🐸", "t": "OX 징검다리", "f": "ox.html"}, {"id": "story", "cat": "new", "e": "📖", "t": "갈림길 이야기", "f": "story.html"}, {"id": "board", "cat": "new", "e": "🎲", "t": "땅따먹기 대모험", "f": "landgame.html"}, {"id": "code", "cat": "new", "e": "🤖", "t": "코딩 로봇 탐험", "f": "code.html"}, {"id": "tteok", "cat": "sim", "e": "🍢", "t": "떡볶이 가게 사장님", "f": "tteok.html"}, {"id": "farm", "cat": "sim", "e": "🌱", "t": "우리 반 꼬마 농장", "f": "farm.html"}, {"id": "park", "cat": "sim", "e": "🎢", "t": "놀이공원 사장님", "f": "park.html"}, {"id": "shelter", "cat": "sim", "e": "🐾", "t": "동물 보호소", "f": "shelter.html"}, {"id": "island", "cat": "sim", "e": "🏝️", "t": "무인도에서 살아남기", "f": "island.html"}, {"id": "space", "cat": "esc", "e": "🚀", "t": "우주정거장 탈출", "f": "space.html"}, {"id": "museum", "cat": "esc", "e": "🏛️", "t": "한밤의 박물관 탈출", "f": "museum.html"}, {"id": "pirate", "cat": "esc", "e": "🏴‍☠️", "t": "해적선의 보물", "f": "pirate.html"}, {"id": "wizard", "cat": "esc", "e": "🧙", "t": "마법사의 탑", "f": "wizard.html"}, {"id": "time", "cat": "esc", "e": "🕰️", "t": "시간 여행 연구소", "f": "time.html"}, {"id": "timecapsule-1", "cat": "esc", "e": "📦", "t": "1일차 · 단서를 쫓아라", "f": "timecapsule-1.html"}, {"id": "timecapsule-2", "cat": "esc", "e": "🕵️", "t": "2일차 · 용의자는 셋", "f": "timecapsule-2.html"}, {"id": "timecapsule-3", "cat": "esc", "e": "🗝️", "t": "3일차 · X의 정체", "f": "timecapsule-3.html"}];</script>
<script src="hub.js"></script>
</head>
<body>
<div class="top"><a href="index.html">🏠 게임 교실</a><span class="t">🏫 우리 반</span><span class="sp"></span><a href="me.html">🧑‍🚀 내 캐릭터</a></div>
<div class="wrap" id="app"></div>
<script>
const $=s=>document.querySelector(s);const H=HUB;const E=H.esc;
function toast(t){const e=document.createElement('div');e.className='toast';e.innerHTML=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
function confetti(n){const em=['🎉','✨','⭐','🎊','💫'];for(let i=0;i<(n||40);i++){const e=document.createElement('div');e.className='conf';e.textContent=em[i%5];e.style.left=Math.random()*100+'vw';e.style.animationDelay=Math.random()*1.2+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),4200)}}
function modal(html){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="panel">${html}</div>`;m.onclick=e=>{if(e.target===m)m.remove()};document.body.appendChild(m);return m}
H.injectCSS();
</script>
<script>
/* 우리 반 (학생) */
H.joinFromURL()&&toast('🔗 우리 반에 연결됐어요!');
let CLS=null;
const METRIC={ndone:['완료한 게임 수','개'],esc:['탈출한 방탈출 수','개'],xp:['모은 경험치','XP'],missions:['완료한 미션 수','개'],level:['레벨 합계','']};
async function load(){const r=await H.pull();CLS=r;render()}
function render(){const p=H.profile();
  if(!p){$('#app').innerHTML=`<div class="panel center"><h2>먼저 내 캐릭터를 만들어 주세요!</h2><a class="btn" style="text-decoration:none;display:inline-block" href="me.html">✨ 캐릭터 만들기</a></div>`;return}
  const s=H.stats(),C=H.classCfg(),cfg=H.getCfg(),q=C.quest;const M=H.missions(),td=H.today(),tm=M[td];
  const mine=q.metric==='xp'?s.xp:q.metric==='esc'?s.byCat.esc:q.metric==='missions'?s.missions:q.metric==='level'?s.level:s.ndone;
  let prog=null;if(CLS&&CLS.students){prog=CLS.students.reduce((a,st)=>a+(+((st.d||{})[q.metric])||0),0)}else if(C.qprog!=null)prog=C.qprog;
  const P=H.points(),pb=H.pointBal(P);
  $('#app').innerHTML=`${C.notice?`<div class="panel notice">📢 <b>선생님 알림</b><br>${E(C.notice)}</div>`:''}
  <div class="panel quest"><h2>⚔️ 학급 퀘스트</h2><div class="row"><div class="boss ${prog!=null&&prog>=q.goal?'dead':''}">${q.e||'🐉'}</div><div style="flex:1;min-width:220px"><h3 style="margin:0;font-size:26px">${E(q.n)}</h3><p style="margin:6px 0">${E(q.msg||'')}</p>
    ${prog!=null?`<div class="hp"><i style="width:${Math.max(0,100-prog/q.goal*100)}%"></i><span>❤️ 남은 체력 ${Math.max(0,q.goal-prog)} / ${q.goal}</span></div>${prog>=q.goal?'<p class="jua" style="font-size:24px;color:#ffd54f">🎉 우리 반이 물리쳤어요!</p>':''}`:`<p class="muted">반 전체 진행 상황은 선생님 화면에서 볼 수 있어요.</p>`}
    <p>🗡️ 내가 준 힘: <b>${mine}${METRIC[q.metric]?METRIC[q.metric][1]:''}</b> <span class="muted">(${METRIC[q.metric]?METRIC[q.metric][0]:''})</span></p></div></div></div>
  <div class="grid g2">
  <div class="panel center"><h2>🎡 오늘의 미션</h2>${tm?`<div class="mission">${E(tm.m)}</div>${tm.done?'<p class="jua" style="font-size:22px;color:#5eea9a">✅ 완료! +20 XP</p>':'<button class="btn" id="mdone">✅ 미션 완료했어요!</button><p class="muted" style="font-size:14px">정말 했을 때만 눌러요. 선생님이 확인하실 수 있어요!</p>'}`:`<div class="wheel" id="wheel"><div class="wi" id="wi">${C.missions.slice(0,8).map((m,i)=>`<span style="transform:rotate(${i*45+22.5}deg) translate(-50%,-78px)">${(m.match(/\p{Extended_Pictographic}/gu)||['⭐']).pop()}</span>`).join('')}</div><div class="wp">▼</div></div><button class="btn" id="spin">🎡 미션 뽑기</button>`}
    <p class="muted" style="font-size:14px">지금까지 완료한 미션 ${s.missions}개</p></div>
  <div class="panel"><h2>💖 칭찬 포인트 <span style="float:right;font-size:30px;color:#ffd54f">${pb.bal}점</span></h2><p class="muted" style="font-size:15px">받은 포인트 ${pb.earned}점 · 쓴 포인트 ${pb.spent}점${cfg.url?' · 🔗 선생님이 준 포인트가 자동으로 들어와요':''}</p>
    <label>🎟️ 칭찬 쿠폰 번호 입력</label><div class="row"><input id="cp" placeholder="예: 7-10-3-K2" style="flex:1"><button class="btn" id="cpb">받기</button></div></div></div>
  <div class="panel"><h2>🛒 학급 상점</h2><div class="grid g4">${C.shop.map(it=>`<button class="shop" data-id="${it.id}" ${pb.bal<it.cost?'disabled':''}><div style="font-size:42px">${it.e}</div><b>${E(it.n)}</b><div class="cost">💖 ${it.cost}점</div></button>`).join('')}</div>
    ${P.spent.length?`<h3>🎫 내 교환권</h3><div class="grid g2">${P.spent.slice().reverse().map(t=>`<div class="ticket ${((CLS&&CLS.delivered)||[]).includes(t.id)?'used':''}"><b>${t.e||'🎫'} ${E(t.n)}</b><div class="tc">${t.id}</div><div class="muted" style="font-size:13px">${new Date(t.at).toLocaleDateString()} · ${((CLS&&CLS.delivered)||[]).includes(t.id)?'✅ 받았어요':'선생님께 이 교환권을 보여 주세요'}</div></div>`).join('')}</div>`:''}</div>`;
  if(!tm)$('#spin').onclick=()=>{const i=Math.floor(Math.random()*C.missions.length);const rot=360*5+(360-((i%8)*45));$('#wi').style.transition='transform 2.6s cubic-bezier(.2,.8,.2,1)';$('#wi').style.transform=`rotate(${rot}deg)`;$('#spin').disabled=true;
    setTimeout(()=>{M[td]={m:C.missions[i],done:false};H.LS.set('hub-missions',M);render();confetti(20)},2700)};
  else if(!tm.done)$('#mdone').onclick=()=>{tm.done=true;tm.at=Date.now();H.LS.set('hub-missions',M);confetti(30);toast('🎯 미션 완료! +20 XP');H.push();render()};
  $('#cpb').onclick=()=>{const r=H.redeem($('#cp').value);if(r.ok){confetti(40);toast(`💖 칭찬 포인트 +${r.amt}점!`);H.push();render()}else toast('⚠️ '+r.msg)};
  document.querySelectorAll('.shop').forEach(b=>b.onclick=()=>{const it=C.shop.find(x=>x.id===b.dataset.id);const m=modal(`<h2>${it.e} ${E(it.n)}</h2><p>💖 ${it.cost}점을 써서 교환권을 받을까요?</p><div class="row" style="justify-content:center"><button class="btn" id="yes">교환하기</button><button class="btn ghost" id="no">취소</button></div>`);
    m.querySelector('#no').onclick=()=>m.remove();m.querySelector('#yes').onclick=()=>{const P2=H.points();if(H.pointBal(P2).bal<it.cost){toast('포인트가 부족해요');m.remove();return}const id='T'+p.num+'-'+Date.now().toString(36).toUpperCase().slice(-5);P2.spent.push({id,item:it.id,n:it.n,e:it.e,cost:it.cost,at:Date.now()});H.LS.set('hub-points',P2);m.remove();confetti(30);toast('🎫 교환권을 받았어요! 선생님께 보여 주세요');H.push();render()}});
}
render();load();

</script>
</body>
</html>
