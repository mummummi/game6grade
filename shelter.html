<style>
:root{--main:#d6336c;--ink:#33294a;--soft:#fff9f0}
*{box-sizing:border-box}html,body{margin:0}

/* HUD */
.hud{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;background:#ffffffe6;backdrop-filter:blur(6px);border-bottom:3px solid color-mix(in srgb,var(--main) 40%,#fff)}

.ib{background:#fff;border:2px solid #ebe4f3;border-radius:50%;width:36px;height:36px;padding:0;font-size:18px}

.scene{position:relative;height:min(52vh,420px);min-height:300px;border-radius:26px;overflow:hidden;box-shadow:0 8px 0 #0000000d,0 12px 30px #0000001a;user-select:none}
.sky{position:absolute;inset:0;transition:background 1.2s}

.world{position:absolute;inset:0;z-index:3}
.night .ground{filter:brightness(.55) saturate(.8)}
.night .world{filter:brightness(.75)}
.cloud{position:absolute;font-size:46px;opacity:.9;animation:drift 40s linear infinite;z-index:2}

.wx{position:absolute;inset:0;pointer-events:none;z-index:8;overflow:hidden}

.daybanner.show{animation:banner 1.6s ease forwards}
@keyframes banner{20%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}35%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
/* 효과 */
.fx{position:fixed;z-index:60;pointer-events:none;font-family:Jua;font-weight:400;transform:translate(-50%,-50%);white-space:nowrap}
.float{animation:floatUp 1.3s ease-out forwards;font-size:24px;text-shadow:0 2px 0 #fff,0 0 6px #fff}

.coinfly{font-size:26px;transition:left .7s cubic-bezier(.5,-0.3,.6,1),top .7s cubic-bezier(.3,0,.8,.4),transform .7s;}

.shake{animation:shake .4s}@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.bob{animation:bob 1.8s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-6px)}}
.wiggle{animation:wiggle 1.2s ease-in-out infinite}@keyframes wiggle{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}

</style>

function modal(html,btns){return new Promise(res=>{const box=$('#box');box.innerHTML='';box.appendChild(typeof html==='string'?h('div','',html):html);const row=h('div','row');row.style.marginTop='12px';(btns||[['확인','go']]).forEach(([t,c],i)=>{const b=h('button','btn '+(c||''),t);b.onclick=()=>{$('#ov').classList.add('hide');res(i)};row.appendChild(b)});box.appendChild(row);$('#ov').classList.remove('hide');box.style.animation='none';void box.offsetWidth;box.style.animation=''})}
function closeModal(){$('#ov').classList.add('hide')}
/* ── 문제 ── */
function numOpts(ans){const s=new Set([ans]);const cand=[ans+D.M,ans-D.M,ans+10*D.M,ans-10*D.M,ans*2,Math.round(ans/2),ans+1,ans-1,ans+10,ans-10,ans+100,ans-100];for(const c of shuffle(cand)){if(s.size>=3)break;if(c>0&&c!==ans&&Number.isFinite(c))s.add(c)}return shuffle([...s])}
function ask(q){/* q:{title,text,pic,ans,opts?,unit?,h?,reward} → Promise<bool> */
  window.__Q=q;return new Promise(res=>{const box=$('#box');box.innerHTML='';const useInput=LV==='hard'&&typeof q.ans==='number'&&!q.opts;let tries=LV==='easy'?2:1;
    box.appendChild(h('div','',`<h2>${q.title||'📒 장부 문제'}</h2>${q.pic?`<div class="big" style="font-size:46px">${q.pic}</div>`:''}<div class="q">${q.text}</div>${q.reward?`<div class="hint">맞히면 보너스 ${q.reward}</div>`:''}`));
    const msg=h('div','msg');
    const finish=ok=>{setTimeout(()=>{$('#ov').classList.add('hide');res(ok)},FAST?5:(ok?900:1600))};
    const judge=(v,btn)=>{const ok=String(v).replace(/[,\s]/g,'')===String(q.ans).replace(/[,\s]/g,'');
      if(ok){SND.good();btn&&btn.classList.add('ok');msg.innerHTML='⭕ 정답!';FX.burstOn(btn||msg,['⭐','✨','🎉'],8);finish(true)}
      else{SND.bad();btn&&btn.classList.add('no');tries--;if(tries>0){msg.innerHTML='한 번 더! '+(q.h?`💡 ${q.h}`:'')}else{msg.innerHTML=`정답은 <b>${typeof q.ans==='number'?q.ans.toLocaleString():q.ans}${q.unit||''}</b>${q.h?' · '+q.h:''}`;finish(false)}}};
    if(useInput){const inp=h('input','inbox');inp.inputMode='decimal';inp.placeholder='숫자';const b=h('button','btn go','확인');b.onclick=()=>{if(inp.value.trim())judge(inp.value.trim(),null)};inp.onkeydown=e=>{if(e.key==='Enter')b.click()};box.append(h('div','row'),msg);box.children[1].append(inp,h('span','jua',q.unit||''),b);setTimeout(()=>inp.focus(),60)}
    else{const row=h('div','opts');(q.opts||numOpts(q.ans)).forEach(o=>{const b=h('button','opt',typeof o==='number'?o.toLocaleString()+(q.unit||''):o);b.dataset.v=o;b.onclick=()=>{if(b.classList.contains('no')||b.classList.contains('ok'))return;judge(o,b)};row.appendChild(b)});box.append(row,msg)}
    $('#ov').classList.remove('hide')})}

/* ── 공통 기능: 상점 · 미션 · 예보 · 임대료 ── */
function rentToday(){return D.rent?Math.round(D.rent*(1+(S.day-1)*D.rentUp)/D.M)*D.M:0}
function openShop(items,onBuy,title){
  const box=h('div','',`<h2>${title||'🛒 업그레이드 상점'}</h2><div class="hint">가진 돈 <b>${won(S.money)}</b></div>`);const grid=h('div','shopgrid');
  items.forEach(it=>{const full=it.max&&it.lv>=it.max;const b=h('button','shopitem'+(full?' full':''),`<b>${it.e}</b><span class="nm">${it.n}${it.max>1?` <small>Lv ${it.lv}/${it.max}</small>`:it.lv?' <small>✔ 보유</small>':''}</span><span class="ds">${it.d}</span><span class="pr">${full?'최고 단계':won(it.cost)}</span>`);
    b.dataset.s=it.id;if(full||!canPay(it.cost))b.disabled=true;b.onclick=()=>{closeModal();if(!canPay(it.cost)){SND.bad();return}earn(-it.cost,null);S.g.spent=(S.g.spent||0)+it.cost;onBuy(it.id);SND.fan();FX.confetti&&0;banner(`${it.e} ${it.n}!`);save()};grid.appendChild(b)});
  box.appendChild(grid);return modal(box,[['닫기','ghost']]);
}
function missionBox(){const m=S.g.mis;if(!m)return null;return h('div','mission'+(m.done?' done':''),`🎯 <b>오늘의 미션</b> ${m.t} <span>보상 ${won(m.r)} · ⭐+5</span>`)}
function setMission(pool){if(!pool||!pool.length){S.g.mis=null;return}const k=Math.floor(rnd()*pool.length);const m=pool[k];S.g.mis={k,t:m.t,r:m.r||D.bonus*3,done:false}}
function forecastText(){return S.g.fwx?`🔮 내일 예보: <b>${S.g.fwx}</b>`:''}
/* ── 흐름 ── */
let G;   // 게임 모듈
function ensureDay(){rnd=RNG(S.seed+S.day*7919);if(!S.g.inited){G.init();S.g.inited=true}if(S.g.mDay!==S.day){S.g.mDay=S.day;G.newDay();if(G.missions)setMission(G.missions());save()}}
function intro(){
  ensureDay();setTime(.35);clouds(3);G.scene();
  const c=h('div','card');
  c.innerHTML=`<div class="big bob">${INFO.emoji}</div><h1 style="margin:6px 0;color:var(--main);font-size:34px">${INFO.title}</h1><div class="lvpill" style="display:inline-block">${GRADE}학년 · ${LVN[LV]}</div><p style="font-size:19px;line-height:1.7">${D.story}</p><div class="how">${G.how().map(([e,t])=>`<div><b>${e}</b>${t}</div>`).join('')}</div><p class="hint">🎯 목표: ${G.goalText()} · ${D.days}일 안에!</p>`;
  const go=h('button','btn go big',S.day>1&&!S.over?'이어서 하기 ▶':'시작하기 ▶');go.id='startBtn';go.onclick=()=>{if(S.over){S=fresh();save();shownMoney=S.money}morning(true)};
  c.appendChild(go);if(S.day>1&&!S.over){const r=h('button','btn ghost','처음부터');r.onclick=()=>{S=fresh();save();shownMoney=S.money;morning(true)};c.appendChild(r)}
  $('#panel').innerHTML='';$('#panel').appendChild(c);hud();
}
async function morning(first){
  ensureDay();
  setTime(.25);weather(S.g.wx||'sun');G.scene();hud();
  banner(`${S.day}일째 아침 ${G.wxIcon?G.wxIcon():''}`);
  G.panel($('#panel'));
}
async function runDay(){
  $('#panel').querySelectorAll('button').forEach(b=>b.disabled=true);
  const rep=await G.day();               // 애니메이션 + 결과 계산
  setTime(.95);await wait(500);
  const rent=Math.min(rentToday(),Math.max(0,S.money));if(rentToday()){earn(-rent,null);rep.lines.push(['🏠 오늘 임대료'+(rent<rentToday()?' (돈이 모자라 일부만)':''),'−'+won(rent),'#e04848']);rep.net-=rent}
  let misOk=false;if(S.g.mis&&!S.g.mis.done&&G.missions){const pool=G.missions();const m=pool[S.g.mis.k];if(m&&m.test(rep)){misOk=true;S.g.mis.done=true;rep.lines.push(['🎯 미션 성공! '+S.g.mis.t,'+'+won(S.g.mis.r),'#7048e8'])}else rep.lines.push(['🎯 미션 실패',S.g.mis.t,'#adb5bd'])}
  const lines=rep.lines.map(([k,v,c])=>`<span>${k}</span><b style="color:${c||'inherit'}">${v}</b>`).join('');
  const net=rep.net;
  await modal(`<div class="big">${rep.emoji||'🌙'}</div><h2>${S.day}일째 결산</h2><div class="rep">${lines}<span class="tot">오늘 남은 돈</span><b class="tot" style="color:${net>=0?'#1f9d55':'#e04848'}">${net>=0?'+':''}${won(net)}</b></div>${rep.note?`<div class="hint">${rep.note}</div>`:''}`,[['장부 쓰러 가기 ✏️','go']]);
  if(misOk){earn(S.g.mis.r,$('#hMoney'));S.rep=Math.min(100,S.rep+5);FX.confetti();SND.fan();hud()}
  const lq=G.ledger(rep);
  if(lq){const ok=await ask(Object.assign({title:'📒 오늘의 장부',reward:'⭐+3 · '+won(D.bonus)},lq));if(ok){S.rep=Math.min(100,S.rep+3);earn(D.bonus,$('#hMoney'))}}
  const kq=(D.quiz&&D.quiz.length&&S.day%2===0)?D.quiz[(S.day/2-1)%D.quiz.length]:null;
  if(kq){const ok=await ask({title:'🧠 깜짝 퀴즈',text:kq.q,pic:kq.pic,ans:kq.a,opts:shuffle(kq.o),h:kq.h,reward:'⭐+5'});if(ok){S.rep=Math.min(100,S.rep+5);hud();FX.burstOn($('#hRep'),['⭐','✨'],8)}}
  S.hist.push({day:S.day,money:S.money,net});
  S.day++;
  if(S.day>D.days||G.done&&G.done()){return finish()}
  save();morning();
}
async function finish(){
  S.over=true;S.win=G.won();if(S.win&&!S.end)S.end=Date.now();save();hud();
  setTime(.98);G.scene();
  if(S.win){FX.confetti();FX.fireworks(6);SND.fan();markDone()}
  const st=S.win?(G.progress()>=1.3?3:G.progress()>=1.1?2:1):0;
  const file=location.pathname.split('/').pop()||'index.html';
  const c=h('div','card');
  c.innerHTML=`<div class="big bob">${S.win?'🏆':'🌧️'}</div><h1 style="color:var(--main)">${S.win?D.endWin:'아쉬워요!'}</h1><p style="font-size:19px">${S.win?D.endText:'목표에 조금 모자랐어요. 전략을 바꿔서 다시 도전해 봐요!'}</p>
  <div class="stars">${'⭐'.repeat(st)}${'<span style="opacity:.2">⭐</span>'.repeat(3-st)}</div>
  <div class="rep" style="max-width:420px;margin:10px auto">${G.summary().map(([k,v])=>`<span>${k}</span><b>${v}</b>`).join('')}</div>
  ${S.win&&LV!=='hard'?`<a class="btn go" href="${file}?lv=${LV==='easy'?'normal':'hard'}">다음 단계 ${LV==='easy'?'🟡 보통':'🔴 어려움'} 도전 →</a>`:''}
  <a class="btn" href="index.html">🏠 게임 교실로</a><button class="btn ghost" id="again">처음부터 다시</button>`;
  $('#panel').innerHTML='';$('#panel').appendChild(c);
  $('#again').onclick=()=>{S=fresh();save();shownMoney=S.money;morning(true)};
  c.scrollIntoView({behavior:FAST?'auto':'smooth'});
}
function markDone(){try{const id=GAME+'@'+LV;if(localStorage.getItem('class-done-skip-'+id)===String(S.end))return;const d=JSON.parse(localStorage.getItem('class-done')||'{}')||{};if(!d[id]){d[id]={how:'auto',at:new Date().toISOString()};localStorage.setItem('class-done',JSON.stringify(d))}}catch(e){}}
</script>
<script>
/* 🐾 동물 보호소 */
const F=new Set(D.feat||[]);
const SPECIES=[{sp:'dog',e:'🐶',n:'강아지'},{sp:'cat',e:'🐱',n:'고양이'},{sp:'rabbit',e:'🐰',n:'토끼'},{sp:'hamster',e:'🐹',n:'햄스터'},{sp:'bird',e:'🦜',n:'앵무새'},{sp:'turtle',e:'🐢',n:'거북'}];
const NAMES=['뭉치','콩이','보리','초코','두부','별이','망고','하늘','구름','쿠키','모카','호두','감자','단비','나비','사랑','토리','찹쌀','몽이','라떼'];
const SIZE={dog:['큰','작은'],cat:['작은'],rabbit:['작은'],hamster:['작은'],bird:['작은'],turtle:['작은']};
const WISH=[
  {t:'아파트에 살아요. <b>작은 동물</b>이면 좋겠어요.',ok:a=>a.size==='작은'},
  {t:'마당이 넓어요! <b>큰 강아지</b>를 원해요.',ok:a=>a.sp==='dog'&&a.size==='큰'},
  {t:'매일 같이 뛰어놀 <b>활발한 친구</b>를 원해요.',ok:a=>a.per==='활발한'},
  {t:'할머니와 살아요. <b>조용한 동물</b>이면 좋겠어요.',ok:a=>a.per==='조용한'},
  {t:'<b>고양이</b>를 꼭 키우고 싶어요!',ok:a=>a.sp==='cat'},
  {t:'털 알레르기가 있어요. <b>털이 없는 동물</b>을 원해요.',ok:a=>a.sp==='turtle'||a.sp==='bird'},
  {t:'<b>강아지</b>와 산책하는 게 꿈이에요!',ok:a=>a.sp==='dog'},
  {t:'집이 좁아요. <b>작고 조용한 동물</b>이면 좋겠어요.',ok:a=>a.size==='작은'&&a.per==='조용한'},
  {t:'처음 키워 봐요. <b>훈련받은 동물</b>이면 좋겠어요.',ok:a=>a.trained,feat:'train'},
  {t:'<b>훈련받은 활발한 강아지</b>와 공놀이하고 싶어요!',ok:a=>a.trained&&a.sp==='dog'&&a.per==='활발한',feat:'train'},
].filter(w=>!w.feat||F.has(w.feat));
const FAMS=['👨‍👩‍👧','👩‍👦','👴','👨‍👩‍👦‍👦','👩‍👧','🧑‍🦰'];
const GAMEDEF={
  init(){const g=S.g;g.an=[];g.fam=[];g.adopted=0;g.wrong=0;g.uid=0;g.sel=null;g.up={play:0,feeder:0,vol:0,kennel:0};g.promo=0;g.ev=null},
  kennels(){return D.kennels+2*S.g.up.kennel},
  newDay(){
    const g=S.g;g.en=D.energy+3*g.up.vol;g.spent=0;g.don=0;g.adToday=0;g.sel=null;g.ev=null;g.adDon=0;
    if(F.has('events')&&S.day>1){const e=rnd();g.ev=e<.12?'storm':e<.24?'drive':null}

      if(!a.sick&&rnd()<(a.clean<40?.45:a.food<30?.3:D.sickP))a.sick=pick(D.sym).k});

    for(let i=0;i<n;i++){const s=pick(SPECIES);g.an.push({id:++g.uid,sp:s.sp,e:s.e,kind:s.n,name:pick(NAMES),size:pick(SIZE[s.sp]),per:pick(['활발한','조용한']),food:ri(20,45),clean:ri(20,45),joy:ri(25,45),sick:rnd()<.35?pick(D.sym).k:null,days:0,isNew:true,trained:false})}
    g.fam=[];const nf=S.day===1?0:ri(D.fam[0],D.fam[1])+(g.promo?1:0);g.promo=0;
    for(let i=0;i<nf;i++){const cand=WISH.map((w,k)=>k).filter(k=>g.an.some(a=>WISH[k].ok(Object.assign({},a,{trained:a.trained||F.has('train')}))));const wi=cand.length&&rnd()<.85?pick(cand):ri(0,WISH.length-1);g.fam.push({w:wi,f:pick(FAMS),done:false})}
    g.don=Math.round(S.rep*D.daily/50/D.M)*D.M*(g.ev==='drive'?2:1);

  ready(a){return a.food>=D.ready&&a.clean>=D.ready&&a.joy>=D.ready&&!a.sick},
  how(){const a=[['🍖','밥 주기 · 🛁 씻기 · 🎾 놀아 주기'],['🩺','아픈 동물은 증상을 보고 알맞게 치료해요'],['❤️','건강하고 행복해지면 입양 준비 끝!'],['👨‍👩‍👧','가족의 바람에 꼭 맞는 동물을 짝지어 줘요']];
    if(F.has('train'))a.push(['🎓','훈련받은 동물은 감사 기부금이 1.5배!']);if(this.shopItems().length)a.push(['🛒','상점에서 놀이터·자원봉사자 등을 들여요']);return a},

  won(){return S.g.adopted>=D.target&&S.money>=0},

  bar(v,c){return `<i class="sb"><u style="width:${v}%;background:${c}"></u></i>`},

    if(g.ev)w.appendChild(h('div','evflag',g.ev==='storm'?'🌧️ 태풍! 동물이 많이 왔어요':'💝 기부의 날!'));

    if(LV==='easy')el.appendChild(h('div','tip','💡 동물을 눌러 고른 다음 돌봐 주세요. 막대 세 개(🟧밥 · 🟦깨끗함 · 🩷기분)가 모두 길어지고 아프지 않으면 ❤️가 떠요. 그다음 위쪽 가족을 눌러 짝지어 주세요!'));
    if(a){const info=h('div','petinfo',`<span class="big" style="font-size:48px">${a.e}</span><div><b class="jua" style="font-size:22px">${a.name}</b> · ${a.size} ${a.kind} · ${a.per} 성격${a.trained?' · 🎓 훈련 완료':''}<br>🍖 ${a.food} · 🛁 ${a.clean} · 🎾 ${a.joy}${a.sick?` · <b style="color:#e03131">🤒 ${D.sym.find(s=>s.k===a.sick).t}</b>`:''}</div>`);el.appendChild(info);
      const row=h('div','row');const acts=[['feed','🍖','밥 주기',1],['wash','🛁','씻기',1],['play','🎾','놀아 주기',1],['vet','🩺','진료하기',2]];if(F.has('train'))acts.push(['train','🎓','훈련하기',2]);
      acts.forEach(([k,e,n,c])=>{const b=h('button','tool',`<b>${e}</b>${n}<small>⚡${c}${k==='feed'?' · '+won(D.food):k==='vet'?' · '+won(D.med):''}</small>`);b.dataset.a=k;
        if(g.en<c||(k==='vet'&&!a.sick)||(k==='train'&&a.trained))b.disabled=true;b.onclick=()=>this.act(k,a);row.appendChild(b)});el.appendChild(row)}
    else el.appendChild(h('div','hint','👆 위에서 돌봐 줄 동물을 눌러 고르세요.'));
    const r2=h('div','row');r2.style.marginTop='10px';
    if(this.shopItems().length){const sb=h('button','btn','🛒 상점');sb.id='shopBtn';sb.onclick=()=>openShop(this.shopItems(),id=>this.buy(id)).then(()=>{this.scene();this.panel($('#panel'))});r2.appendChild(sb)}
    const go=h('button','btn go big','🌙 하루 마치기 ▶');go.id='dayBtn';go.onclick=()=>runDay();r2.appendChild(go);el.appendChild(r2);
  },
  shopItems(){const g=S.g,it=[];
    if(F.has('playground'))it.push({id:'play',e:'🛝',n:'놀이터',d:'밤사이 기분이 덜 떨어져요',cost:D.playCost,lv:g.up.play,max:1});
    if(F.has('volunteer'))it.push({id:'vol',e:'🙋',n:'자원봉사자',d:`매일 할 일 +3번 · 하루 ${won(D.vwage)}`,cost:D.volCost,lv:g.up.vol,max:2});
    if(F.has('feeder'))it.push({id:'feeder',e:'🍽️',n:'자동 급식기',d:'밤사이 배고픔이 덜해요',cost:D.feederCost,lv:g.up.feeder,max:1});
    if(F.has('promo'))it.push({id:'promo',e:'📢',n:'입양 홍보',d:'내일 가족이 한 팀 더 와요',cost:D.promoCost,lv:g.promo,max:1});
    if(F.has('expand'))it.push({id:'kennel',e:'🏠',n:'보호소 넓히기',d:'동물 집 +2칸',cost:D.expandCost,lv:g.up.kennel,max:2});
    return it},
  buy(id){const g=S.g;if(id==='promo')g.promo=1;else g.up[id]++;if(id==='vol')g.en+=3},
  petEl(a){return document.querySelector(`.kennel[data-id="${a.id}"]`)},
  async act(k,a){
    const g=S.g,el=this.petEl(a);
    if(k==='feed'){if(!canPay(D.food)){SND.bad();FX.floatOn(el,'돈이 모자라요','#e04848');return}earn(-D.food,null);g.spent+=D.food;a.food=Math.min(100,a.food+45);g.en--;SND.pop();FX.burstOn(el,['🍖','🦴','😋'],7)}
    if(k==='wash'){a.clean=Math.min(100,a.clean+50);g.en--;SND.splash();FX.burstOn(el,['🫧','🫧','✨','🧼'],10)}
    if(k==='play'){a.joy=Math.min(100,a.joy+45);g.en--;SND.good();FX.burstOn(el,['🎾','💖','💕'],8)}
    if(k==='train'){a.trained=true;g.en-=2;a.joy=Math.min(100,a.joy+10);SND.fan();FX.burstOn(el,['🎓','⭐','✨'],10);FX.floatOn(el,'앉아! 손! 훈련 완료!','#7048e8')}
    if(k==='vet'){if(!canPay(D.med)){SND.bad();FX.floatOn(el,'돈이 모자라요','#e04848');return}
      const sy=D.sym.find(s=>s.k===a.sick);g.en-=2;earn(-D.med,null);g.spent+=D.med;this.scene();this.panel($('#panel'));
      const ok=await ask({title:'🩺 진료실',pic:a.e+'🤒',text:`${a.name}의 증상: <b>${sy.t}</b><br>어떻게 돌봐 줘야 할까요?`,ans:sy.a,opts:shuffle([sy.a,...sy.w])});
      if(ok){a.sick=null;a.joy=Math.min(100,a.joy+10);FX.burstOn(this.petEl(a)||$('#world'),['💊','✨','💚'],9);FX.floatOn(this.petEl(a)||$('#world'),'다 나았어요!','#2f9e44')}}
    if(this.ready(a)){const e=this.petEl(a);if(e)FX.burstOn(e,['❤️','💖'],6)}
    this.scene();this.panel($('#panel'));save();
  },
  async adopt(i,btn){
    const g=S.g,f=g.fam[i];const ready=g.an.filter(a=>this.ready(a));
    if(!ready.length){SND.bad();FX.floatOn(btn,'아직 입양 준비된 동물이 없어요 (❤️)','#e04848');return}
    const box=h('div',''),W=WISH[f.w];box.innerHTML=`<div class="big">${f.f}</div><h2>입양 상담</h2><div class="q">"${W.t}"</div><div class="hint">❤️ 입양 준비가 된 동물 중에서 골라요</div>`;
    const row=h('div','row');ready.forEach(a=>{const b=h('button','tool',`<b>${a.e}</b>${a.name}<small>${a.size} ${a.kind}</small><small>${a.per}${a.trained?' · 🎓':''}</small>`);b.dataset.id=a.id;b.onclick=()=>{closeModal();this.match(i,a)};row.appendChild(b)});
    box.appendChild(row);modal(box,[['다음에','ghost']]);
  },
  async match(i,a){
    const g=S.g,f=g.fam[i],W=WISH[f.w];const fe=document.querySelector(`.fam[data-f="${i}"]`);
    if(W.ok(a)){f.done=true;g.adopted++;g.adToday++;g.an=g.an.filter(x=>x.id!==a.id);if(g.sel===a.id)g.sel=null;
      SND.fan();const pe=this.petEl(a);if(pe)FX.burstOn(pe,['❤️','💖','💕','🏡'],14);if(fe)FX.burstOn(fe,['❤️','🎉','💖'],12);
      const don=Math.round(D.donate*(a.trained?1.5:1)/D.M)*D.M;g.adDon+=don;S.rep=Math.min(100,S.rep+6);banner(`${a.e} ${a.name} 입양 성공!`);await wait(400);earn(don,fe||$('#hMoney'));
      if(!FAST){const walk=h('div','walkout',`${f.f}${a.e}💕`);$('#world').appendChild(walk);await wait(1200);walk.remove()}
      if(g.adopted>=D.target)FX.confetti()}
    else{g.wrong++;S.rep=Math.max(0,S.rep-5);SND.bad();if(fe){FX.shake(fe);FX.floatOn(fe,'바람과 맞지 않아요 😢','#e04848')}}
    this.scene();this.panel($('#panel'));hud();save();
  },
  missions(){return[
    {t:'오늘 1마리 이상 입양 보내기',test:r=>r.ad>=1},
    {t:'아픈 동물 없이 하루 마치기',test:r=>r.sickN===0},
    {t:'모든 동물 배부르게 (밥 60 이상)',test:r=>r.fullAll},
    {t:'❤️ 입양 준비된 동물 2마리 만들기',test:r=>r.readyN+r.ad>=2},
  ]},
  async day(){
    const g=S.g;
    const sickN=g.an.filter(a=>a.sick).length,fullAll=g.an.length>0&&g.an.every(a=>a.food>=60),readyN=g.an.filter(a=>this.ready(a)).length;
    for(let t=.3;t<=.8;t+=.1){setTime(t);await wait(220)}
    document.querySelectorAll('.pet').forEach(p=>p.classList.add('wiggle'));
    const left=g.fam.filter(f=>!f.done).length;if(left){S.rep=Math.max(0,S.rep-2*left)}
    g.fam=[];this.scene();
    const hungry=g.an.filter(a=>a.food<20).length;if(hungry)S.rep=Math.max(0,S.rep-3*hungry);
    const wages=g.up.vol*D.vwage;
    earn(g.don,document.querySelector('.shelterhouse'));await wait(400);if(wages)earn(-wages,null);
    const lines=[[`💝 오늘 들어온 기부금${g.ev==='drive'?' (기부의 날 ×2)':''}`,won(g.don),'#1f9d55']];
    if(g.adToday)lines.push([`🏡 입양 성공 ${g.adToday}마리 감사 기부금`,'+'+won(g.adDon),'#1f9d55']);
    if(wages)lines.push(['🙋 자원봉사자 간식비','−'+won(wages),'#e04848']);
    if(g.spent)lines.push(['🍖 밥·약·상점에 쓴 돈','−'+won(g.spent),'#e04848']);
    lines.push(['🐾 보호 중인 동물',g.an.length+'마리']);if(sickN)lines.push(['🤒 아픈 동물',sickN+'마리','#e04848']);
    const r={lines,net:g.don+g.adDon-g.spent-wages,emoji:g.adToday?'💖':'🌙',note:left?`입양 상담을 못 한 가족 ${left}팀이 그냥 돌아갔어요.`:hungry?'배고픈 동물이 있어요. 내일은 밥을 꼭 챙겨 주세요!':'',spent:g.spent+wages,ad:g.adToday,n:g.an.length,sickN,fullAll,readyN};
    save();return r;
  },
  ledger(r){
    const n=S.g.an.length;
    if(GRADE===1){const a=n+r.ad,b=r.ad;if(b>0)return{text:`보호소에 동물이 <b>${a}마리</b> 있었어요. 오늘 <b>${b}마리</b>가 입양을 갔어요.<br>남은 동물은 몇 마리일까요?`,ans:a-b,unit:'마리',pic:'🐶🐱🐰'};
      const x=ri(2,6),y=ri(2,6);return{text:`오늘 강아지 밥을 <b>${x}번</b>, 고양이 밥을 <b>${y}번</b> 줬어요. 밥을 모두 몇 번 줬을까요?`,ans:x+y,unit:'번',pic:'🍖'}}
    if(GRADE===2){const k=ri(2,9),c=ri(2,5);return{text:`간식 한 봉지에 뼈다귀 간식이 <b>${c}개</b>씩 들어 있어요. <b>${k}봉지</b>에는 모두 몇 개일까요?`,ans:k*c,unit:'개',pic:'🦴',h:`${c}단 곱셈구구`}}
    if(GRADE===3){const t=ri(3,9);return{text:`밥 한 번에 <b>${josa(won(D.food),'이','가')}</b> 들어요. 밥을 <b>${t}번</b> 주면 모두 얼마일까요?`,ans:t*D.food,unit:U,h:`${D.food} × ${t}`}}
    if(GRADE===4){if(r.net<0)return{text:`밥 한 번에 <b>${josa(won(D.food),'이','가')}</b> 들어요. 동물 <b>${Math.max(2,n)}마리</b>에게 하루에 <b>2번</b>씩, <b>30일</b> 동안 밥을 주면 모두 얼마일까요?`,ans:D.food*Math.max(2,n)*2*30,unit:U};
      return{text:`오늘 들어온 돈은 <b>${won(r.net+r.spent)}</b>, 쓴 돈은 <b>${josa(won(r.spent),'이에요','예요')}</b>. 오늘 남은 돈(들어온 돈 − 쓴 돈)은?`,ans:r.net,unit:U}}
    if(GRADE===5){const kg=[1.2,1.8,2.4,3.6][ri(0,3)],m=[2,3,4,6][ri(0,3)];const ans=Math.round(kg/m*100)/100;return{text:`사료 <b>${kg}kg</b>을 동물 <b>${m}마리</b>에게 똑같이 나눠 주면 한 마리에 몇 kg일까요?`,ans,unit:'kg',opts:shuffle([...new Set([ans,Math.round(kg*m*10)/10,Math.round((ans+.1)*100)/100])]),h:`${kg} ÷ ${m}`}}
    const all=S.g.adopted+n;if(all>0&&S.g.adopted>0&&(S.g.adopted*100)%all===0)return{text:`지금까지 보호소에 온 동물 <b>${all}마리</b> 중 <b>${S.g.adopted}마리</b>가 입양을 갔어요.<br>입양 간 동물은 전체의 몇 %일까요?`,ans:S.g.adopted*100/all,unit:'%',h:'입양 수 ÷ 전체 × 100'};
    const u=[4,5,6,8,10,12][ri(0,5)];return{text:`사료 <b>20kg</b> 중에서 <b>${u}kg</b>을 썼어요. 쓴 사료는 전체의 몇 %일까요?`,ans:u*5,unit:'%',h:`${u} ÷ 20 × 100`};
  },
  bot(){
    const g=S.g,left=D.days-S.day;
    const tryBuy=(id,cost,ok)=>{if(ok&&canPay(cost)&&S.money-cost>D.food*12){earn(-cost,null);g.spent+=cost;this.buy(id);return true}return false};
    if(left>=3){tryBuy('vol',D.volCost,F.has('volunteer')&&g.up.vol<2);tryBuy('play',D.playCost,F.has('playground')&&!g.up.play);tryBuy('feeder',D.feederCost,F.has('feeder')&&!g.up.feeder);
      tryBuy('kennel',D.expandCost,F.has('expand')&&g.up.kennel<1&&g.an.length>=this.kennels()-1)}
    const order=g.an.slice().sort((a,b)=>this.score(b)-this.score(a));
    for(const a of order){if(g.en<=0)break;
      if(a.sick&&g.en>=2&&canPay(D.med)){g.en-=2;earn(-D.med,null);g.spent+=D.med;a.sick=null;continue}
      for(const k of['food','clean','joy']){while(a[k]<D.ready&&g.en>0&&(k!=='food'||canPay(D.food))){g.en--;if(k==='food'){earn(-D.food,null);g.spent+=D.food;a.food=Math.min(100,a.food+45)}else a[k]=Math.min(100,a[k]+(k==='clean'?50:45))}}
      if(F.has('train')&&!a.trained&&this.ready(a)&&g.en>=2&&g.fam.some(f=>!f.done&&WISH[f.w].ok(Object.assign({},a,{trained:true}))&&!WISH[f.w].ok(a))){a.trained=true;g.en-=2}}
    g.fam.forEach((f,i)=>{if(f.done)return;const a=g.an.find(x=>this.ready(x)&&WISH[f.w].ok(x));if(a){f.done=true;g.adopted++;g.adToday++;g.an=g.an.filter(x=>x.id!==a.id);S.rep=Math.min(100,S.rep+6);const don=Math.round(D.donate*(a.trained?1.5:1)/D.M)*D.M;g.adDon+=don;earn(don,null)}});
    this.scene();this.panel($('#panel'));save();
  },
  score(a){let s=0;if(a.sick)s-=20;s-=(Math.max(0,D.ready-a.food)+Math.max(0,D.ready-a.clean)+Math.max(0,D.ready-a.joy))/10;return s},
};

</script>
<script>
G=GAMEDEF;
if(S.over){G.scene();hud();finish()}else intro();
</script>
