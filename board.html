<script>
const GAS_CODE="/**\n * 우리 반 게임 교실 · 학급 연결 서버 (Google Apps Script)\n * 1) 구글 스프레드시트를 새로 만들고 [확장 프로그램 → Apps Script]를 눌러요.\n * 2) 이 코드를 모두 붙여 넣고, 아래 TEACHER_PIN을 선생님 전자칠판 비밀번호와 똑같이 바꿔요.\n * 3) [배포 → 새 배포 → 유형: 웹 앱] / 실행: 나 / 액세스 권한: 모든 사용자 → 배포\n * 4) 나온 \"웹 앱 URL\"(…/exec)을 선생님 전자칠판 [설정]의 연결 주소에 붙여 넣어요.\n */\nconst TEACHER_PIN = '1234';   // ← 꼭 바꾸세요! (전자칠판 비밀번호와 같게)\n\n/* 기록을 저장할 스프레드시트: 시트에서 [확장 프로그램 → Apps Script]로 만들었으면 그 시트,\n   따로 만든 스크립트라면 '게임교실 학급연결 기록' 시트를 자동으로 만들어 써요. */\nfunction ss_() {\n  let ss = null;\n  try { ss = SpreadsheetApp.getActiveSpreadsheet(); } catch (e) {}\n  if (ss) return ss;\n  const props = PropertiesService.getScriptProperties();\n  const id = props.getProperty('SHEET_ID');\n  if (id) { try { return SpreadsheetApp.openById(id); } catch (e) {} }\n  ss = SpreadsheetApp.create('게임교실 학급연결 기록');\n  props.setProperty('SHEET_ID', ss.getId());\n  return ss;\n}\nfunction sheet_(name, header) {\n  const ss = ss_();\n  let sh = ss.getSheetByName(name);\n  if (!sh) { sh = ss.insertSheet(name); sh.appendRow(header); }\n  return sh;\n}\nfunction out_(obj) {\n  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);\n}\nfunction rows_(sh) { const v = sh.getDataRange().getValues(); v.shift(); return v; }\n\nfunction pull_(cls) {\n  const st = rows_(sheet_('students', ['cls', 'num', 'data', 'updated']))\n    .filter(r => String(r[0]) === cls)\n    .map(r => { let d = {}; try { d = JSON.parse(r[2]); } catch (e) {} return { n: Number(r[1]), d: d, ts: r[3] }; });\n  const grants = {}, glog = [];\n  rows_(sheet_('grants', ['cls', 'num', 'amount', 'reason', 'time'])).forEach(r => {\n    if (String(r[0]) !== cls) return;\n    const n = String(Number(r[1]));\n    grants[n] = (grants[n] || 0) + Number(r[2] || 0);\n    glog.push({ n: Number(r[1]), amt: Number(r[2]), reason: r[3], at: r[4] });\n  });\n  let cfg = {};\n  rows_(sheet_('config', ['cls', 'data', 'updated'])).forEach(r => { if (String(r[0]) === cls) { try { cfg = JSON.parse(r[1]); } catch (e) {} } });\n  return { ok: true, students: st, grants: grants, glog: glog.slice(-80), cfg: cfg, delivered: cfg.delivered || [] };\n}\n\nfunction doGet(e) {\n  try {\n    const p = (e && e.parameter) || {};\n    if (p.a === 'pull') return out_(pull_(String(p.c || 'class')));\n    const ss = ss_();\n    return out_({ ok: true, msg: '우리 반 게임 교실 연결 서버가 잘 작동하고 있어요!', sheet: ss.getName(), url: ss.getUrl() });\n  } catch (err) {\n    return out_({ ok: false, msg: '서버 오류: ' + String(err) });\n  }\n}\n\nfunction doPost(e) {\n  const lock = LockService.getScriptLock();\n  lock.waitLock(10000);\n  try {\n    const b = JSON.parse(e.postData.contents);\n    const cls = String(b.c || 'class');\n    if (b.a === 'push') {\n      const sh = sheet_('students', ['cls', 'num', 'data', 'updated']);\n      const v = sh.getDataRange().getValues();\n      const json = JSON.stringify(b.d || {}).slice(0, 45000);\n      for (let i = 1; i < v.length; i++) {\n        if (String(v[i][0]) === cls && Number(v[i][1]) === Number(b.n)) {\n          sh.getRange(i + 1, 3, 1, 2).setValues([[json, new Date()]]);\n          return out_({ ok: true });\n        }\n      }\n      sh.appendRow([cls, Number(b.n), json, new Date()]);\n      return out_({ ok: true });\n    }\n    if (b.a === 'pull') return out_(pull_(cls));\n    if (String(b.pin) !== String(TEACHER_PIN)) return out_({ ok: false, msg: '비밀번호가 Apps Script의 TEACHER_PIN과 달라요.' });\n    if (b.a === 'grant') {\n      const sh = sheet_('grants', ['cls', 'num', 'amount', 'reason', 'time']);\n      (b.nums || []).forEach(n => sh.appendRow([cls, Number(n), Number(b.amt || 0), String(b.reason || ''), new Date()]));\n      return out_({ ok: true });\n    }\n    if (b.a === 'cfg') {\n      const sh = sheet_('config', ['cls', 'data', 'updated']);\n      const v = sh.getDataRange().getValues();\n      const json = JSON.stringify(b.cfg || {});\n      for (let i = 1; i < v.length; i++) {\n        if (String(v[i][0]) === cls) { sh.getRange(i + 1, 2, 1, 2).setValues([[json, new Date()]]); return out_({ ok: true }); }\n      }\n      sh.appendRow([cls, json, new Date()]);\n      return out_({ ok: true });\n    }\n    if (b.a === 'test') { const ss = ss_(); sheet_('students', ['cls', 'num', 'data', 'updated']); return out_({ ok: true, msg: '연결 성공! 비밀번호도 맞아요. (기록 시트: ' + ss.getName() + ')' }); }\n    return out_({ ok: false, msg: 'unknown action' });\n  } catch (err) {\n    return out_({ ok: false, msg: String(err) });\n  } finally {\n    lock.releaseLock();\n  }\n}\n";
/* 선생님 전자칠판 */
const BK='hub-board';
const BD=()=>Object.assign({roster:{},manual:{},grants:[],ser:1,delivered:[],quest:null,shop:null,missions:null,notice:'',size:28},H.LS.get(BK,{}));
const saveBD=b=>H.LS.set(BK,b);
const pinHash=p=>H.chk('pin:'+p)+String(p).length;
let SYNC=null,TAB='home',SORT='num',LASTQ=null;
function unlocked(){try{return sessionStorage.getItem('hub-board-ok')==='1'}catch(e){return false}}
function lock(){const b=BD();const first=!b.pin;
  $('#app').innerHTML=`<div class="panel center" style="max-width:480px;margin:40px auto"><div style="font-size:70px">👩‍🏫</div><h2>${first?'선생님 비밀번호 만들기':'선생님 전자칠판'}</h2><p class="muted">${first?'처음 한 번만 정해요. 학생들이 모르는 숫자 4자리 이상으로 정해 주세요.':'비밀번호를 입력하세요.'}</p>
  <input id="pin" type="password" inputmode="numeric" placeholder="비밀번호" style="text-align:center;font-size:28px;letter-spacing:6px">${first?'<input id="pin2" type="password" inputmode="numeric" placeholder="한 번 더" style="text-align:center;font-size:28px;letter-spacing:6px;margin-top:8px">':''}
  <button class="btn" id="go" style="margin-top:12px;width:100%">${first?'만들기':'열기'}</button><p class="muted" style="font-size:14px;margin-top:14px">학생 화면이 아니라 선생님 화면이에요. 🔒</p></div>`;
  const go=()=>{const v=$('#pin').value.trim();if(v.length<4){toast('4자리 이상 입력해 주세요');return}
    if(first){if(v!==$('#pin2').value.trim()){toast('두 번 입력한 비밀번호가 달라요');return}b.pin=pinHash(v);saveBD(b)}else if(pinHash(v)!==b.pin){toast('비밀번호가 달라요');return}
    try{sessionStorage.setItem('hub-board-ok','1');sessionStorage.setItem('hub-board-pin',v)}catch(e){}start()};
  $('#go').onclick=go;$('#pin').onkeydown=e=>{if(e.key==='Enter')go()}}
const PIN=()=>{try{return sessionStorage.getItem('hub-board-pin')||''}catch(e){return''}};
function cfgOut(){const b=BD();const C=H.classCfg();return{quest:b.quest||C.quest,shop:b.shop||C.shop,missions:b.missions||C.missions,notice:b.notice||'',qprog:questProg(),delivered:b.delivered||[]}}
async function pushCfg(){const b=BD();H.LS.set('hub-classcfg',cfgOut());if(!H.getCfg().url)return;const r=await H.post({a:'cfg',pin:PIN(),cfg:cfgOut()});if(!r.ok)toast('⚠️ 학급 서버에 저장하지 못했어요: '+(r.msg||'연결 확인'))}
function students(){const b=BD();const map={};
  Object.entries(b.roster).forEach(([n,nm])=>map[n]={n:+n,name:nm});

function set(){const b=BD(),cfg=H.getCfg();const link=H.joinLink(location.href.replace(/board\.html.*$/,'me.html'),cfg.url,cfg.cls);
  $('#tab').innerHTML=`<div class="grid g2">
  <div class="panel"><h2>👥 학생 명단</h2><p class="muted" style="font-size:15px">한 줄에 한 명씩 "번호 이름"으로 적어요. (엑셀에서 복사해도 돼요)</p><textarea id="rost" style="min-height:220px" placeholder="1 김하늘&#10;2 이바다">${E(Object.entries(b.roster).map(([n,nm])=>n+' '+nm).join('\n'))}</textarea><button class="btn" id="rsave" style="margin-top:8px">명단 저장</button></div>
  <div class="panel"><h2>📢 학생 화면 알림</h2><textarea id="noti" placeholder="예: 이번 주 목표는 방탈출 3개!">${E(b.notice||'')}</textarea><button class="btn" id="nsave" style="margin-top:8px">알림 저장</button>
    <h2 style="margin-top:16px">🖥️ 카드 크기</h2><input type="range" min="20" max="40" id="sz" value="${b.size}"></div>
  <div class="panel"><h2>🔗 학급 자동 연결 (선택)</h2><p class="muted" style="font-size:15px">연결하면 학생 기록이 이 화면에 자동으로 모이고, 칭찬 포인트·퀘스트·미션이 학생 화면에 바로 반영돼요. 연결하지 않아도 <b>결과 코드</b>와 <b>쿠폰</b>으로 쓸 수 있어요.</p>
    <label>학급 코드 (반마다 다르게, 예: 6-3)</label><input id="cls" value="${E(cfg.cls)}" list="clsl"><datalist id="clsl">${H.classList().map(c=>`<option value="${E(c)}">`).join('')}</datalist><label>연결 주소 (Apps Script 웹 앱 URL)</label><input id="url" value="${E(cfg.url)}" placeholder="https://script.google.com/macros/s/.../exec">
    <div class="row" style="margin-top:8px"><button class="btn" id="csave">저장</button><button class="btn ghost" id="ctest">연결 테스트</button></div><p id="cres"></p>
    <label>📲 학생 연결 링크 (학생 태블릿에서 한 번만 열면 연결돼요)</label><input id="jl" readonly value="${E(link)}"><button class="btn ghost sm" id="jcopy" style="margin-top:6px">링크 복사</button></div>
  <div class="panel"><h2>🧰 Apps Script 설치 방법</h2><ol style="line-height:1.7;font-size:16px"><li>구글 드라이브에서 <b>새 스프레드시트</b>를 만들어요.</li><li>메뉴 <b>확장 프로그램 → Apps Script</b>를 열어요.</li><li>아래 [코드 복사]를 눌러 원래 코드를 지우고 붙여 넣어요.</li><li>코드 맨 위 <b>TEACHER_PIN</b>을 이 화면 비밀번호와 똑같이 바꾸고 저장해요.</li><li><b>배포 → 새 배포 → 웹 앱</b> / 실행: <b>나</b> / 액세스: <b>모든 사용자</b> → 배포 (권한 허용)</li><li>나온 <b>웹 앱 URL</b>을 왼쪽 연결 주소에 붙여 넣고 [연결 테스트]!</li></ol><button class="btn" id="gcopy">📋 코드 복사</button></div>
  <div class="panel"><h2>🔒 비밀번호 · 데이터</h2><div class="row"><input id="np" type="password" placeholder="새 비밀번호" style="flex:1"><button class="btn ghost" id="pch">바꾸기</button></div>
    <div class="row" style="margin-top:12px"><button class="btn ghost sm" id="exp">💾 백업 내려받기</button><button class="btn ghost sm" id="clr">🧹 결과 코드 기록 지우기</button><button class="btn ghost sm" id="out">🚪 잠그기</button></div></div></div>`;
  $('#rsave').onclick=()=>{const b2=BD();b2.roster={};$('#rost').value.split('\n').forEach(l=>{const m=l.trim().match(/^(\d{1,2})[\s.,\t번]+(.+)$/);if(m)b2.roster[+m[1]]=m[2].trim()});saveBD(b2);toast(`👥 ${Object.keys(b2.roster).length}명 저장`);set()};
  $('#nsave').onclick=()=>{const b2=BD();b2.notice=$('#noti').value.trim();saveBD(b2);pushCfg();toast('알림 저장!')};
  $('#sz').oninput=e=>{const b2=BD();b2.size=+e.target.value;saveBD(b2)};
  $('#csave').onclick=()=>{H.setCfg({cls:$('#cls').value.trim(),url:$('#url').value.trim()});toast('저장했어요');set()};
  const updLink=()=>{const c=H.getCfg();$('#jl').value=H.joinLink(location.href.replace(/board\.html.*$/,'me.html'),c.url,c.cls)};
  $('#ctest').onclick=async()=>{H.setCfg({cls:$('#cls').value.trim(),url:$('#url').value.trim()});updLink();$('#cres').textContent='확인 중…';const r=await H.post({a:'test',pin:PIN()});let m=r.ok?'✅ '+(r.msg||'연결 성공!'):'⚠️ '+(r.msg||r.err||'연결 실패. 주소와 배포 설정(모든 사용자)을 확인해 주세요.');if(r.ok){const p=await H.pull();m+=p&&p.ok?'<br>✅ 학생 기록 불러오기도 잘 돼요.':'<br>⚠️ 기록 불러오기 실패: '+E((p&&p.msg)||'응답 없음');if(p&&p.ok){SYNC=p;pushCfg()}}$('#cres').innerHTML=m};
  $('#jcopy').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText($('#jl').value);toast('링크를 복사했어요')};
  $('#gcopy').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(GAS_CODE);toast('📋 Apps Script 코드를 복사했어요')};
  $('#pch').onclick=()=>{const v=$('#np').value.trim();if(v.length<4){toast('4자리 이상');return}const b2=BD();b2.pin=pinHash(v);saveBD(b2);try{sessionStorage.setItem('hub-board-pin',v)}catch(e){}toast('비밀번호를 바꿨어요. Apps Script의 TEACHER_PIN도 같게 바꿔 주세요!')};
  $('#exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({board:BD(),sync:SYNC},null,1)],{type:'application/json'}));a.download='우리반-게임교실-백업.json';a.click()};
  $('#clr').onclick=()=>{const b2=BD();b2.manual={};saveBD(b2);toast('지웠어요')};
  $('#out').onclick=()=>{try{sessionStorage.removeItem('hub-board-ok')}catch(e){}render()}}
render();if(unlocked())start();

</script>
</body>
</html>
