<script>
const GAS_CODE="/**\n * 우리 반 게임 교실 · 학급 연결 서버 v2 (Google Apps Script)\n * 여러 선생님이 이 서버 하나를 같이 써요. 반마다 '학급 코드'와 '선생님 비밀번호'가 따로 있어요.\n *  - 선생님 전자칠판에서 [새 학급 만들기] → 학급 코드와 비밀번호를 정하면 classes 시트에 등록돼요.\n *  - 학생 기록·칭찬 포인트·설정은 학급 코드별로 따로 저장돼요.\n *  - TEACHER_PIN(관리자 비밀번호)은 모든 반에 쓸 수 있어요. 예전 방식으로 쓰던 반도 이 비밀번호로 들어가요.\n * 배포: [배포 → 배포 관리 → ✏️ 수정 → 버전: 새 버전 → 배포] (주소가 그대로 유지돼요)\n */\nconst TEACHER_PIN = '1234';   // ← 관리자 비밀번호 (꼭 바꾸세요!)\n\nfunction ss_() {\n  let ss = null;\n  try { ss = SpreadsheetApp.getActiveSpreadsheet(); } catch (e) {}\n  if (ss) return ss;\n  const props = PropertiesService.getScriptProperties();\n  const id = props.getProperty('SHEET_ID');\n  if (id) { try { return SpreadsheetApp.openById(id); } catch (e) {} }\n  ss = SpreadsheetApp.create('게임교실 학급연결 기록');\n  props.setProperty('SHEET_ID', ss.getId());\n  return ss;\n}\nfunction sheet_(name, header) {\n  const ss = ss_();\n  let sh = ss.getSheetByName(name);\n  if (!sh) { sh = ss.insertSheet(name); sh.appendRow(header); }\n  return sh;\n}\nfunction out_(obj) {\n  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);\n}\nfunction rows_(sh) { const v = sh.getDataRange().getValues(); v.shift(); return v; }\n\n/* ── 학급 ── */\nconst CLS_HEAD = ['code', 'pinHash', 'grade', 'created', 'lastUsed'];\n/* 시트가 '4-1' 같은 학급 코드를 날짜(4월 1일)로 바꿔 버리는 문제를 막아요 */\nfunction norm_(c) {\n  if (c instanceof Date) return (c.getMonth() + 1) + '-' + c.getDate();\n  return String(c == null ? '' : c).replace(/\\s+/g, '').toUpperCase().slice(0, 20);\n}\nfunction txt_(v) { return \"'\" + String(v); }\nfunction hash_(code, pin) {\n  const raw = Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, 'ourclass|' + code + '|' + String(pin), Utilities.Charset.UTF_8);\n  return raw.map(b => ('0' + ((b + 256) % 256).toString(16)).slice(-2)).join('');\n}\nfunction findClass_(code) {\n  const sh = sheet_('classes', CLS_HEAD);\n  const v = sh.getDataRange().getValues();\n  for (let i = 1; i < v.length; i++) if (norm_(v[i][0]) === code) return { sh: sh, row: i + 1, pinHash: String(v[i][1]), grade: v[i][2] };\n  return null;\n}\n/* 예전 방식(classes 등록 전)으로 기록이 쌓인 반인지 */\nfunction legacy_(code) {\n  return ['students', 'config', 'grants'].some(n => {\n    const sh = ss_().getSheetByName(n); if (!sh) return false;\n    return rows_(sh).some(r => norm_(r[0]) === code);\n  });\n}\nfunction exists_(code) { return !!findClass_(code) || legacy_(code); }\nfunction auth_(code, pin) {\n  if (String(pin) === String(TEACHER_PIN)) return true;\n  const c = findClass_(code);\n  return !!(c && c.pinHash && c.pinHash === hash_(code, pin));\n}\nfunction touch_(code) { const c = findClass_(code); if (c) c.sh.getRange(c.row, 5).setValue(new Date()); }\n\nfunction pull_(cls) {\n  const st = rows_(sheet_('students', ['cls', 'num', 'data', 'updated']))\n    .filter(r => norm_(r[0]) === cls)\n    .map(r => { let d = {}; try { d = JSON.parse(r[2]); } catch (e) {} return { n: Number(r[1]), d: d, ts: r[3] }; });\n  const grants = {}, glog = [];\n  rows_(sheet_('grants', ['cls', 'num', 'amount', 'reason', 'time'])).forEach(r => {\n    if (norm_(r[0]) !== cls) return;\n    const n = String(Number(r[1]));\n    grants[n] = (grants[n] || 0) + Number(r[2] || 0);\n    glog.push({ n: Number(r[1]), amt: Number(r[2]), reason: r[3], at: r[4] });\n  });\n  let cfg = {};\n  rows_(sheet_('config', ['cls', 'data', 'updated'])).forEach(r => { if (norm_(r[0]) === cls) { try { cfg = JSON.parse(r[1]); } catch (e) {} } });\n  return { ok: true, v: 2, students: st, grants: grants, glog: glog.slice(-80), cfg: cfg, delivered: cfg.delivered || [] };\n}\n\nfunction doGet(e) {\n  try {\n    const p = (e && e.parameter) || {};\n    if (p.a === 'pull') return out_(pull_(norm_(p.c || 'class')));\n    if (p.a === 'check') { const c = norm_(p.c); return out_({ ok: true, v: 2, exists: !!c && exists_(c) }); }\n    const ss = ss_();\n    return out_({ ok: true, v: 2, msg: '우리 반 게임 교실 연결 서버(v2)가 잘 작동하고 있어요!', sheet: ss.getName() });\n  } catch (err) {\n    return out_({ ok: false, msg: '서버 오류: ' + String(err) });\n  }\n}\n\nfunction doPost(e) {\n  const lock = LockService.getScriptLock();\n  lock.waitLock(10000);\n  try {\n    const b = JSON.parse(e.postData.contents);\n    const cls = norm_(b.c || 'class');\n    if (b.a === 'check') return out_({ ok: true, v: 2, exists: !!cls && exists_(cls) });\n    if (b.a === 'register') {\n      if (cls.length < 2) return out_({ ok: false, msg: '학급 코드는 2글자 이상으로 정해 주세요.' });\n      if (String(b.pin || '').length < 4) return out_({ ok: false, msg: '비밀번호는 4자리 이상으로 정해 주세요.' });\n      if (findClass_(cls) || (legacy_(cls) && String(b.pin) !== String(TEACHER_PIN)))\n        return out_({ ok: false, exists: true, msg: '이미 다른 선생님이 쓰는 학급 코드예요. 학교 이름을 붙이는 등 다른 코드로 정해 주세요. (예: 지산3-1)' });\n      sheet_('classes', CLS_HEAD).appendRow([txt_(cls), hash_(cls, b.pin), String(b.g || ''), new Date(), new Date()]);\n      return out_({ ok: true, v: 2, code: cls, msg: '새 학급을 만들었어요!' });\n    }\n    if (b.a === 'login') {\n      if (!exists_(cls)) return out_({ ok: false, nocls: true, msg: '없는 학급 코드예요. 철자를 확인하거나 [새 학급 만들기]를 눌러 주세요.' });\n      if (!auth_(cls, b.pin)) return out_({ ok: false, msg: '학급 비밀번호가 달라요.' });\n      touch_(cls);\n      return out_({ ok: true, v: 2, code: cls });\n    }\n    if (b.a === 'push') {\n      if (!exists_(cls)) return out_({ ok: false, nocls: true, msg: '없는 학급 코드예요.' });\n      const sh = sheet_('students', ['cls', 'num', 'data', 'updated']);\n      const v = sh.getDataRange().getValues();\n      const json = JSON.stringify(b.d || {}).slice(0, 45000);\n      for (let i = 1; i < v.length; i++) {\n        if (norm_(v[i][0]) === cls && Number(v[i][1]) === Number(b.n)) {\n          sh.getRange(i + 1, 3, 1, 2).setValues([[json, new Date()]]);\n          return out_({ ok: true });\n        }\n      }\n      sh.appendRow([txt_(cls), Number(b.n), json, new Date()]);\n      return out_({ ok: true });\n    }\n    if (b.a === 'pull') retu     <div class="row" style="margin-top:10px"><input id="rs" placeholder="칭찬 이유 (예: 발표를 잘했어요)" style="flex:2">${[1,3,5,10].map(a=>`<button class="btn" data-a="${a}">+${a}</button>`).join('')}</div>
    <p class="muted" style="font-size:14px">${H.getCfg().url?'🔗 자동 연결: 학생 화면에 바로 포인트가 들어가요.':'📝 쿠폰 방식: 쿠폰 번호가 만들어져요. 학생이 「우리 반」에서 입력하면 포인트가 들어가요.'}</p></div>
  <div class="panel"><h2>🎫 교환 요청 ${reqs.length?`(${reqs.filter(r=>!(b.delivered||[]).includes(r.id)).length}개 남음)`:''}</h2>${reqs.length?`<div class="grid g2">${reqs.map(r=>{const dv=(b.delivered||[]).includes(r.id);return `<div class="ticket ${dv?'used':''}"><b>${r.e||'🎫'} ${E(r.n)}</b> · ${r.who.n}. ${E(r.who.name)}<div class="tc">${r.id}</div><button class="btn sm ${dv?'ghost':''}" data-d="${r.id}">${dv?'↩️ 되돌리기':'✅ 지급 완료'}</button></div>`}).join('')}</div>`:`<p class="muted">${H.getCfg().url?'아직 교환 요청이 없어요.':'쿠폰 방식에서는 학생이 보여 주는 교환권(T로 시작하는 번호)을 확인해 주세요.'}</p>`}</div>
  <div class="panel"><h2>🛒 학급 상점 물건</h2><div id="shopl">${shop.map((it,i)=>`<div class="row shoprow" data-i="${i}"><input class="se" value="${E(it.e)}" style="width:70px;text-align:center"><input class="sn" value="${E(it.n)}" style="flex:2"><input class="sc" type="number" value="${it.cost}" style="width:100px"><span>점</span><button class="btn ghost sm del">🗑️</button></div>`).join('')}</div>
    <div class="row" style="margin-top:8px"><button class="btn ghost sm" id="add">➕ 물건 추가</button><button class="btn sm" id="ss">저장하기</button></div></div>`;
  $('#all').onclick=()=>document.querySelectorAll('.pk input').forEach(x=>x.checked=true);$('#none').onclick=()=>document.querySelectorAll('.pk input').forEach(x=>x.checked=false);
  document.querySelectorAll('[data-a]').forEach(x=>x.onclick=()=>{const nums=[...document.querySelectorAll('.pk input:checked')].map(i=>+i.value);if(!nums.length){toast('학생을 먼저 골라 주세요');return}give(nums,+x.dataset.a,$('#rs').value.trim()||'칭찬')});
  document.querySelectorAll('[data-d]').forEach(x=>x.onclick=()=>{const b2=BD();const id=x.dataset.d;b2.delivered=b2.delivered||[];b2.delivered=b2.delivered.includes(id)?b2.delivered.filter(y=>y!==id):b2.delivered.concat(id);saveBD(b2);pushCfg();praise()});
  const rows=()=>[...document.querySelectorAll('.shoprow')].map((r,i)=>({id:'s'+(i+1)+'_'+r.querySelector('.sn').value.trim().slice(0,4),e:r.querySelector('.se').value.trim()||'🎁',n:r.querySelector('.sn').value.trim(),cost:Math.max(1,+r.querySelector('.sc').value||1)})).filter(x=>x.n);
  document.querySelectorAll('.del').forEach(x=>x.onclick=()=>{x.closest('.shoprow').remove()});
  $('#add').onclick=()=>{const b2=BD();b2.shop=rows().concat({id:'n'+Date.now(),e:'🎁',n:'새 보상',cost:20});saveBD(b2);praise()};
  $('#ss').onclick=()=>{const b2=BD();b2.shop=rows();saveBD(b2);pushCfg();toast('상점을 저장했어요!');praise()}}
function set(){const b=BD(),cfg=H.getCfg();const link=cfg.cls?JOINURL():'';
  $('#tab').innerHTML=`<div class="grid g2">
  <div class="panel"><h2>👥 학생 명단</h2><p class="muted" style="font-size:15px">한 줄에 한 명씩 "번호 이름"으로 적어요. (엑셀에서 복사해도 돼요)</p><textarea id="rost" style="min-height:220px" placeholder="1 김하늘&#10;2 이바다">${E(Object.entries(b.roster).map(([n,nm])=>n+' '+nm).join('\n'))}</textarea><button class="btn" id="rsave" style="margin-top:8px">명단 저장</button></div>
  <div class="panel"><h2>📢 학생 화면 알림</h2><textarea id="noti" placeholder="예: 이번 주 목표는 방탈출 3개!">${E(b.notice||'')}</textarea><button class="btn" id="nsave" style="margin-top:8px">알림 저장</button>
    <h2 style="margin-top:16px">🖥️ 카드 크기</h2><input type="range" min="20" max="40" id="sz" value="${b.size}"></div>
  <div class="panel"><h2>🏫 우리 학급</h2>${cfg.cls?`<p style="font-size:18px">학급 코드 <b style="font-family:Jua;font-size:30px;color:#ffd54f">${E(cfg.cls)}</b></p><div class="row"><button class="btn" id="jq2">📲 학생 입장 QR 크게 보기</button><button class="btn ghost sm" id="jcopy">🔗 입장 링크 복사</button></div><input id="jl" readonly value="${E(link)}" style="margin-top:8px;font-size:14px">`:'<p class="muted">아직 학급에 들어가지 않았어요.</p>'}
    <div class="row" style="margin-top:12px"><button class="btn ghost sm" id="swc">🔁 다른 학급으로 바꾸기 / 새 학급 만들기</button></div>
    <details style="margin-top:12px"><summary class="muted">고급: 연결 서버</summary><label>연결 주소 (Apps Script 웹 앱 URL)</label><input id="url" value="${E(cfg.url)}" placeholder="https://script.google.com/macros/s/.../exec"><div class="row" style="margin-top:8px"><button class="btn ghost sm" id="csave">주소 저장</button><button class="btn ghost sm" id="ctest">연결 테스트</button></div><p id="cres"></p></details></div>
  <div class="panel"><h2>🧰 (선택) 우리 학교 전용 서버 만들기</h2><p class="muted" style="font-size:14px">보통은 필요 없어요. 기록을 우리 학교 구글 시트에 따로 모으고 싶을 때만 쓰세요.</p><ol style="line-height:1.7;font-size:16px"><li>구글 드라이브에서 <b>새 스프레드시트</b>를 만들어요.</li><li>메뉴 <b>확장 프로그램 → Apps Script</b>를 열어요.</li><li>아래 [코드 복사]를 눌러 원래 코드를 지우고 붙여 넣어요.</li><li>코드 맨 위 <b>TEACHER_PIN</b>(관리자 비밀번호)을 나만 아는 숫자로 바꾸고 저장해요.</li><li><b>배포 → 새 배포 → 웹 앱</b> / 실행: <b>나</b> / 액세스: <b>모든 사용자</b> → 배포 (권한 허용)</li><li>나온 <b>웹 앱 URL</b>을 왼쪽 연결 주소에 붙여 넣고 [연결 테스트]!</li></ol><button class="btn" id="gcopy">📋 코드 복사</button></div>
  <div class="panel"><h2>🔒 비밀번호 · 데이터</h2><div class="row"><input id="np" type="password" placeholder="새 비밀번호" style="flex:1"><button class="btn ghost" id="pch">바꾸기</button></div>
    <div class="row" style="margin-top:12px"><button class="btn ghost sm" id="exp">💾 백업 내려받기</button><button class="btn ghost sm" id="clr">🧹 결과 코드 기록 지우기</button><button class="btn ghost sm" id="out">🚪 잠그기</button></div></div></div>`;
  $('#rsave').onclick=()=>{const b2=BD();b2.roster={};$('#rost').value.split('\n').forEach(l=>{const m=l.trim().match(/^(\d{1,2})[\s.,\t번]+(.+)$/);if(m)b2.roster[+m[1]]=m[2].trim()});saveBD(b2);toast(`👥 ${Object.keys(b2.roster).length}명 저장`);set()};
  $('#nsave').onclick=()=>{const b2=BD();b2.notice=$('#noti').value.trim();saveBD(b2);pushCfg();toast('알림 저장!')};
  $('#sz').oninput=e=>{const b2=BD();b2.size=+e.target.value;saveBD(b2)};
  $('#csave').onclick=()=>{H.setCfg({url:$('#url').value.trim()});toast('저장했어요');set()};if($('#jq2'))$('#jq2').onclick=joinScreen;$('#swc').onclick=()=>{try{sessionStorage.removeItem('hub-board-ok');sessionStorage.removeItem('hub-board-pin')}catch(e){}SYNC=null;render()};
  const updLink=()=>{};
  $('#ctest').onclick=async()=>{H.setCfg({url:$('#url').value.trim()});updLink();$('#cres').textContent='확인 중…';const r=await H.post({a:'test',pin:PIN()});let m=r.ok?'✅ '+(r.msg||'연결 성공!'):'⚠️ '+(r.msg||r.err||'연결 실패. 주소와 배포 설정(모든 사용자)을 확인해 주세요.');if(r.ok){const p=await H.pull();m+=p&&p.ok?'<br>✅ 학생 기록 불러오기도 잘 돼요.':'<br>⚠️ 기록 불러오기 실패: '+E((p&&p.msg)||'응답 없음');if(p&&p.ok){SYNC=p;pushCfg()}}$('#cres').innerHTML=m};
  if($('#jcopy'))$('#jcopy').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText($('#jl').value);toast('링크를 복사했어요')};
  $('#gcopy').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(GAS_CODE);toast('📋 Apps Script 코드를 복사했어요')};
  $('#pch').onclick=async()=>{const v=$('#np').value.trim();if(v.length<4){toast('4자리 이상');return}if(H.getCfg().url&&H.getCfg().cls){const r=await H.post({a:'setpin',pin:PIN(),npin:v});if(!r.ok){toast('⚠️ '+E(r.msg||'바꾸지 못했어요'));return}}const b2=BD();b2.pin=pinHash(v);saveBD(b2);try{sessionStorage.setItem('hub-board-pin',v)}catch(e){}toast('🔒 학급 비밀번호를 바꿨어요')};
  $('#exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({board:BD(),sync:SYNC},null,1)],{type:'application/json'}));a.download='우리반-게임교실-백업.json';a.click()};
  $('#clr').onclick=()=>{const b2=BD();b2.manual={};saveBD(b2);toast('지웠어요')};
  $('#out').onclick=()=>{try{sessionStorage.removeItem('hub-board-ok')}catch(e){}render()}}
try{const oc=(JSON.parse(localStorage.getItem('hub-cfg')||'{}').cls)||'';if(oc&&!H.LS.get('hub-board-oldcls',''))H.LS.set('hub-board-oldcls',H.normCode(oc))}catch(e){}
render();if(unlocked())start();

</script>
</body>
</html>
