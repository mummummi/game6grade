<title>세계 일주 공항 · 6학년 방탈출</title>

<style>
:root{--bg:#12141c;--panel:#1e2130;--panel2:#282c40;--ink:#f3efe4;--muted:#a9a6b8;--gold:#42a5f5;--red:#e85d5d;--green:#5fd39a;--line:#3a3f57}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% 0%,color-mix(in srgb,var(--gold) 14%,#232842) 0%,var(--bg) 60%);color:var(--ink);font-family:'Gowun Dodum',system-ui,sans-serif;min-height:100vh;font-size:18px;line-height:1.6;-webkit-user-select:none;user-select:none}
.wrap{max-width:1000px;margin:0 auto;padding:14px 12px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.brand{font-family:'Black Han Sans',sans-serif;font-size:20px;color:var(--gold)}
.brand a{color:var(--muted);text-decoration:none;font-family:'Gowun Dodum';font-size:15px;margin-right:8px;border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.stats{display:flex;gap:8px;font-size:15px;flex-wrap:wrap}
.pill{background:var(--panel);border:1px solid var(--line);padding:4px 12px;border-radius:999px}
.pill.lv{background:color-mix(in srgb,var(--gold) 25%,var(--panel));border-color:var(--gold)}
h1{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:38px;margin:0 0 6px;color:var(--gold);text-shadow:0 0 24px color-mix(in srgb,var(--gold) 45%,transparent)}
h2{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:23px;margin:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px}
.story{background:var(--panel2);border-left:4px solid var(--gold);padding:14px 16px;border-radius:10px;margin:14px 0;text-align:left;line-height:1.75}
.center{text-align:center}.muted{color:var(--muted);font-size:15px}
button{font-family:inherit;font-size:18px;border:0;border-radius:12px;padding:10px 18px;cursor:pointer;font-weight:bold}
.btn{background:var(--gold);color:#1d1600}.btn:disabled{opacity:.4}
.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.roombar{display:flex;justify-content:space-between;align-items:center;margin:6px 0 8px;gap:8px;flex-wrap:wrap}
.scene{position:relative;width:100%;border-radius:16px;overflow:hidden;border:2px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.45);background:#000}
.scene svg{display:block;width:100%;height:auto}
.hot .ah{fill:#fff;fill-opacity:0;stroke:#fff;stroke-opacity:0;stroke-width:5;transition:fill-opacity .15s,stroke-opacity .15s}.hot:hover .ah{fill-opacity:.14;stroke-opacity:.95}.hot.selhint .ah{stroke:#ffd54f;stroke-opacity:1;fill-opacity:.12}.hot.done .ah{fill-opacity:0}.hot{cursor:pointer;transition:filter .15s}
.hot:hover{filter:drop-shadow(0 0 12px color-mix(in srgb,var(--gold) 90%,transparent)) brightness(1.08)}
.hot.done{filter:saturate(.75)}
.hot.selhint{animation:hl 1.2s ease-in-out infinite}
@keyframes hl{50%{filter:drop-shadow(0 0 14px #fff) brightness(1.2)}}
.inv{display:flex;gap:8px;align-items:center;margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px;min-height:62px;flex-wrap:wrap}
.inv .lbl{color:var(--muted);font-size:14px;margin-right:4px}
.item{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:4px 10px;display:flex;align-items:center;gap:6px;cursor:pointer;font-size:15px}
.item b{font-size:26px;font-weight:400}.item.sel{border-color:var(--gold);box-shadow:0 0 12px color-mix(in srgb,var(--gold) 60%,transparent);transform:translateY(-2px)}
.ov{position:fixed;inset:0;background:rgba(5,6,12,.78);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.ov.hide{display:none}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:min(720px,100%);max-height:92vh;overflow:auto;padding:20px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.mcard h3{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:24px;margin:0 36px 10px 0;color:var(--gold)}
.mx{position:absolute;right:12px;top:10px;background:transparent;color:var(--muted);font-size:24px;padding:4px 10px}
.box{background:var(--panel2);border-radius:12px;padding:14px;margin:10px 0;line-height:1.75}
.paper{background:#f4ecd8;color:#3a2c1a;border-radius:6px;padding:16px 18px;margin:10px 0;box-shadow:inset 0 0 30px rgba(120,90,40,.25);font-size:18px;line-height:1.8}
.paper b{color:#7a2e12}
.shake{animation:shake .45s}@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.msg{text-align:center;min-height:28px;margin-top:8px;font-weight:bold}.msg.good{color:var(--green)}.msg.bad{color:var(--red)}
.lockform{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.lockform input{font-family:inherit;font-size:24px;text-align:center;width:min(260px,70vw);padding:8px;border-radius:12px;border:2px solid var(--line);background:#0e1018;color:var(--ink);letter-spacing:3px}
.dials{display:flex;gap:10px;justify-content:center;margin:12px 0}
.dial{display:flex;flex-direction:column;align-items:center;gap:4px}
.dial button{background:var(--panel2);color:var(--ink);padding:2px 14px;font-size:16px}
.dial .d{width:58px;height:70px;border-radius:12px;background:linear-gradient(#0b0d14,#23283b,#0b0d14);border:2px solid color-mix(in srgb,var(--gold) 60%,var(--line));display:flex;align-items:center;justify-content:center;font-family:'Black Han Sans';font-size:38px;color:var(--gold);box-shadow:inset 0 6px 10px #000a}
.seqshow{display:flex;gap:6px;justify-content:center;min-height:52px;margin:10px 0;flex-wrap:wrap}
.seqshow span{min-width:46px;height:46px;border-radius:10px;background:var(--panel2);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:24px}
.pad{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pad button{min-width:64px;min-height:56px;background:var(--panel2);color:var(--ink);font-size:24px;border:2px solid var(--line)}
.pad button.c{width:60px;height:60px;border-radius:50%;border:3px solid #fff3}
.keys{display:flex;justify-content:center;gap:3px;margin:10px 0}
.keys button{width:52px;height:150px;background:linear-gradient(#fff,#e8e8e8);color:#333;border-radius:0 0 10px 10px;font-size:15px;padding:0 0 10px;display:flex;align-items:flex-end;justify-content:center;box-shadow:0 4px 0 #999}
.keys button:active{transform:translateY(3px);background:#ffe9a8}
.opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:10px}
.opt{background:var(--panel2);color:var(--ink);border:2px solid var(--line);min-width:110px;padding:12px 16px;font-size:18px}
.opt.big{font-size:34px;min-width:80px}

.ordercards button{background:var(--panel2);color:var(--ink);border:2px solid var(--line);padding:10px 14px;font-size:17px;min-width:90px;position:relative}
.ordercards button.on{border-color:var(--gold);opacity:.55}
.ordercards button i{position:absolute;top:-10px;left:-8px;background:var(--gold);color:#000;font-style:normal;border-radius:50%;width:24px;height:24px;font-size:14px;line-height:24px}
.hint{background:var(--panel2);border-radius:10px;padding:10px 14px;margin:8px 0;text-align:left}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#000d;color:#fff;border:1px solid var(--gold);padding:10px 18px;border-radius:999px;z-index:80;font-size:16px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}

.big{font-size:56px;line-height:1.2}

  if(k.kind==='keys')return `<div class="seqshow" id="sq"></div><div class="keys">${(k.opts||['도','레','미','파','솔','라','시']).map(v=>`<button data-v="${String(v).replace(/"/g,'&quot;')}">${v}</button>`).join('')}</div><div class="center"><button class="ghost" data-x="1">⌫ 지우기</button> <button class="btn" id="lkOk">확인</button></div>`;
  if(k.kind==='choice')return `<div class="opts">${k.opts.map(o=>`<button class="opt${k.big?' big':''}" data-v="${String(o).replace(/"/g,'&quot;')}">${o}</button>`).join('')}</div>`;
  if(k.kind==='order')return `<div class="ordercards">${k.opts.map(o=>`<button data-v="${String(o).replace(/"/g,'&quot;')}">${o}</button>`).join('')}</div><div class="center"><button class="ghost" data-x="1">다시 고르기</button></div>`;
  if(k.kind==='multi')return `<div class="opts">${k.opts.map(o=>`<button class="opt mopt${k.big?' big':''}" data-m="${String(o).replace(/"/g,'&quot;')}">${o}</button>`).join('')}</div><div class="center muted" style="margin-top:6px">맞는 것을 <b>모두</b> 눌러 고른 뒤 확인을 눌러요</div><div class="center"><button class="btn" id="lkOk">확인</button></div>`;
  if(k.kind==='match'||k.kind==='sort'){const ch=k.kind==='match'?k.right:k.bins;return `<div class="mlist">${k.left.map((l,i)=>`<div class="mrow"><span class="ml">${l}</span><span class="ma">${k.kind==='match'?'↔':'→'}</span><button class="mr" data-i="${i}">❔</button></div>`).join('')}</div><div class="center muted">${k.kind==='match'?'오른쪽 칸을 눌러 짝을 바꿔요':'칸을 눌러 어디에 들어갈지 바꿔요'} (${ch.join(' · ')})</div><div class="center"><button class="btn" id="lkOk">확인</button></div>`}
}
function bindLock(k,ok){
  const box=$('mbody'),msg=$('lm');let seq=[];
  const judge=v=>{const good=v===true?true:v===false?false:k.kind==='choice'?v===k.ans:Array.isArray(k.ans)?norm(v)===norm(k.ans.join('')):[k.ans,...(k.alts||[])].some(a=>norm(v)===norm(a));
    if(good){msg.className='msg good';msg.textContent='✅ 철컥! 열렸다!';tone(660);setTimeout(()=>tone(990),120);box.querySelectorAll('button,input').forEach(x=>x.disabled=true);setTimeout(ok,FAST?0:900)}
    else{S.wrong++;save();msg.className='msg bad';msg.textContent=k.bad||'❌ 열리지 않는다…';tone(150,.3);const c=$('mcard');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');if(k.kind!=='text'){seq=[];show()}}};
  const show=()=>{const sq=box.querySelector('#sq');if(sq)sq.innerHTML=seq.map(v=>k.kind==='color'?`<span style="background:${k.opts.find(o=>o[0]===v)[1]}"></span>`:k.kind==='dir'?`<span>${{U:'⬆️',D:'⬇️',L:'⬅️',R:'➡️'}[v]}</span>`:`<span>${v}</span>`).join('');
    if(k.kind==='order')box.querySelectorAll('.ordercards button').forEach(b=>{const i=seq.indexOf(b.dataset.v);b.classList.toggle('on',i>=0);b.querySelector('i')?.remove();if(i>=0)b.insertAdjacentHTML('beforeend',`<i>${i+1}</i>`)})};
  if(k.kind==='dial'){const d=Array(k.ans.length).fill(0);box.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{const i=+b.dataset.u;d[i]=(d[i]+1)%10;$('dg'+i).textContent=d[i];tone(500,.05)});box.querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>{const i=+b.dataset.dn;d[i]=(d[i]+9)%10;$('dg'+i).textContent=d[i];tone(500,.05)});$('lkOk').onclick=()=>judge(d.join(''));box._set=v=>{String(v).split('').forEach((c,i)=>{d[i]=+c;$('dg'+i).textContent=c})}}
  if(k.kind==='text'){$('lf').onsubmit=e=>{e.preventDefault();const v=$('li').value;if(v.trim())judge(v)}}
  if(['dir','color','keys'].includes(k.kind)){box.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{if(seq.length>=(k.ans.length+3))return;seq.push(b.dataset.v);if(k.kind==='keys')tone(NOTE[b.dataset.v]||440,.4);else tone(600,.05);show()});box.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{seq.pop();show()});$('lkOk').onclick=()=>judge(seq.join(''))}
  if(k.kind==='choice')box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>judge(b.dataset.v));
  if(k.kind==='multi'){const on=new Set();const upd=()=>box.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',on.has(b.dataset.m)));box.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const v=b.dataset.m;on.has(v)?on.delete(v):on.add(v);tone(600,.04);upd()});box._set=a=>{a.forEach(v=>on.add(String(v)));upd()};$('lkOk').onclick=()=>{const A=k.ans.map(String);const g=on.size===A.length&&A.every(v=>on.has(v));if(!g){on.clear();upd()}judge(g)}}
  if(k.kind==='match'||k.kind==='sort'){const ch=k.kind==='match'?k.right:k.bins;const st=k.left.map(()=>-1);const upd=()=>box.querySelectorAll('.mr').forEach(b=>{const i=+b.dataset.i;b.textContent=st[i]<0?'❔':ch[st[i]];b.classList.toggle('on',st[i]>=0)});box.querySelectorAll('.mr').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;st[i]=(st[i]+1)%ch.length;tone(520+st[i]*60,.04);upd()});box._set=a=>{a.forEach((v,i)=>st[i]=ch.indexOf(v));upd()};$('lkOk').onclick=()=>{if(st.some(x=>x<0)){msg.className='msg bad';msg.textContent='❔ 아직 정하지 않은 칸이 있어요.';return}judge(st.every((x,i)=>ch[x]===k.ans[i]))}}
  if(k.kind==='order'){box.querySelectorAll('.ordercards [data-v]').forEach(b=>b.onclick=()=>{if(seq.includes(b.dataset.v))return;seq.push(b.dataset.v);tone(600,.05);show();if(seq.length===(Array.isArray(k.ans)?k.ans.length:k.opts.length))judge(seq.join('\u0001')===(Array.isArray(k.ans)?k.ans:[]).join('\u0001')||(!Array.isArray(k.ans)&&norm(seq.join(''))===norm(k.ans)))});box.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{seq=[];show()})}
}
/* ═══════ 물건 조사 ═══════ */
const FAST=QS.get('fast')==='1';
function val(v){return typeof v==='function'?v():v}
function avail(o){if(o.when&&!o.when.every(flag))return false;if(o.hideWhen&&[].concat(o.hideWhen).every(flag))return false;return true}
function solved(o){return o.set?flag(o.set):!!S.used['p_'+o.id]}
function finishObj(o){if(o.consume&&o.need)consume(o.need);if(o.give)give(o.give);if(o.set)S.flags[o.set]=1;S.used['p_'+o.id]=1;save();

function activate(o){
  if(o.door&&o.when&&!o.when.every(flag)&&!solved(o)){openModal(val(o.title),`<div class="box">${val(o.pre)||'🔒 아직 열 수 없다. 방 안의 단서를 더 찾아보자.'}</div>`);return}
  if(o.door&&solved(o))return nextRoom();
  if(o.need&&!solved(o)&&!S.used['u_'+o.id]){if(SEL!==o.need){openModal(val(o.title),`<div class="box">${val(o.locked)||'🔒 무언가가 필요해 보인다.'}</div>${has(o.need)?`<p class="muted center">💼 소지품에서 <b>${TH.items[o.need].e} ${TH.items[o.need].n}</b>을(를) 먼저 눌러 고른 다음 다시 조사해 보세요.</p>`.replace('을(를)',josa(TH.items[o.need].n)):''}`);return}
    S.used['u_'+o.id]=1;SEL=null;save();if(!o.lock&&!o.door){toast(val(o.useMsg)||'사용했다!')}}
  if(solved(o)&&o.after){openModal(val(o.title),val(o.after));return}
  if(o.lock&&!solved(o)){const k=val(o.lock);openModal(val(o.title),`${val(o.html)||''}${k.q?`<div class="center" style="margin-top:8px"><b>${k.q}</b></div>`:''}${lockHTML(k)}<div class="msg" id="lm"></div>`,()=>bindLock(k,()=>finishObj(o)));return}
  if(o.door&&!o.lock){const ok=(o.needs||[]).every(flag);if(!ok){openModal(val(o.title),`<div class="box">${val(o.locked)||'🔒 문이 굳게 잠겨 있다.'}</div>`);return}return finishObj(o)}
  // 단순 조사 (쪽지 · 물건 줍기)
  openModal(val(o.title),val(o.html)||'');if(!solved(o)){S.used['p_'+o.id]=1;if(o.give)give(o.give);if(o.set)S.flags[o.set]=1;save()}
}
/* ═══════ 화면 ═══════ */
let TH;
const rooms=()=>TH.rooms;
function render(){
  $('hintCount').textContent=S.hints.reduce((a,b)=>a+b,0);
  const app=$('app');
  if(S.room===-1)return renderIntro(app);
  if(S.room>=rooms().length)return renderEnd(app);
  const r=rooms()[S.room];

  app.innerHTML=`<div class="roombar"><h2>${r.icon||'🚪'} 방 ${S.room+1} / ${rooms().length} · ${r.name}</h2><div style="display:flex;gap:6px;flex-wrap:wrap">${S.room>0?`<button class="ghost" id="prevBtn">◀ 이전 방</button>`:''}${S.room<S.max?`<button class="ghost" id="nextBtn">다음 방 ▶</button>`:''}<button class="ghost" id="hintBtn">💡 힌트</button></div></div>
  <div class="scene">${svgWrap(r.bg()+objs.map(o=>hot(o.id,val(o.art))).join(''))}</div><div class="inv" id="inv"></div>
  <p class="muted center">${r.tip||'방 안을 꼼꼼히 살펴보고 수상한 곳을 눌러 조사하세요. 얻은 물건은 소지품에서 눌러 고른 뒤, 쓸 곳을 누르면 돼요.'}</p>`;
  app.querySelectorAll('.hot').forEach(el=>{try{const b=el.getBBox();const h=document.createElementNS('http://www.w3.org/2000/svg','rect');h.setAttribute('x',b.x-8);h.setAttribute('y',b.y-8);h.setAttribute('width',b.width+16);h.setAttribute('height',b.height+16);h.setAttribute('fill','transparent');el.insertBefore(h,el.firstChild)}catch(e){}
    const o=r.objects.find(x=>x.id===el.dataset.id);if(o&&solved(o)&&!o.door)el.classList.add('done');if(SEL&&o&&o.need===SEL&&!solved(o))el.classList.add('selhint');
    el.addEventListener('click',()=>{if(o)activate(o)})});
  if($('prevBtn'))$('prevBtn').onclick=()=>goRoom(S.room-1);
  if($('nextBtn'))$('nextBtn').onclick=()=>goRoom(S.room+1);
  $('hintBtn').onclick=showHints;
  renderInv();
}
function renderInv(){const el=$('inv');if(!el)return;el.innerHTML='<span class="lbl">💼 소지품</span>'+(S.inv.length?S.inv.map(id=>`<span class="item${SEL===id?' sel':''}" data-i="${id}"><b>${TH.items[id].e}</b>${TH.items[id].n}</span>`).join(''):'<span class="muted">아직 없어요</span>');
  el.querySelectorAll('.item').forEach(b=>b.onclick=()=>{SEL=SEL===b.dataset.i?null:b.dataset.i;if(SEL){const it=TH.items[SEL];toast(`${it.e} ${it.n} 선택! 쓸 곳을 눌러 보세요.${it.d?' '+it.d:''}`)}render()})}
function goRoom(i){S.room=i;SEL=null;save();render();window.scrollTo(0,0)}
function nextRoom(){$('ov').classList.add('hide');S.max=Math.max(S.max||0,S.room+1);tone(523);setTimeout(()=>tone(784),150);
  if(S.room+1>=rooms().length){S.end=Date.now();S.room=rooms().length;save();markDone();render();return}

function showHints(){
  const r=rooms()[S.room];const hs=val(r.hints);const n=S.hints[S.room];

function speakBtn(text){return ''}
function renderIntro(app){

function markDone(){try{const id=GAME+'@'+LV;if(localStorage.getItem('class-done-skip-'+id)===String(S.end))return;const d=JSON.parse(localStorage.getItem('class-done')||'{}')||{};if(!d[id]){d[id]={how:'auto',at:new Date().toISOString()};localStorage.setItem('class-done',JSON.stringify(d))}}catch(e){}}
function fmt(ms){const s=Math.max(0,Math.floor(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}

$('resetBtn').onclick=()=>openModal('처음부터 다시 할까요?','<p class="muted">이 방탈출에서 지금까지 푼 기록이 지워져요.</p><div class="center"><button class="btn" id="rsYes">처음부터</button></div>',()=>{$('rsYes').onclick=()=>{S=fresh();save();$('ov').classList.add('hide');render()}});
$('lvPill').textContent=GRADE+'학년 · '+LVN[LV];
/* 자동 풀이 (검사용) */
window.__auto=async function(){const out=[];const sl=ms=>new Promise(r=>setTimeout(r,ms));
  for(let guard=0;guard<400&&S.room<rooms().length;guard++){const r=rooms()[S.room];let moved=false;
    for(const o of r.objects){if(!avail(o)||solved(o)&&!o.door)continue;if(o.need&&!has(o.need)&&!S.used['u_'+o.id])continue;if(o.door&&!o.lock&&!(o.needs||[]).every(flag))continue;
      const room=S.room;if(o.need&&!S.used['u_'+o.id])SEL=o.need;activate(o);await sl(5);

        else{const arr=Array.isArray(v)?v:String(v).split('');for(const x of arr)[...document.querySelectorAll('#mbody [data-v]')].find(b=>b.dataset.v===x).click();$('lkOk')&&$('lkOk').click()}

  return{ok:S.room>=rooms().length,done:out}};
