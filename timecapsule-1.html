<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사라진 타임캡슐 · 1일차 방탈출 · 6학년</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
  :root{--bg:#12141c;--panel:#1e2130;--panel2:#282c40;--ink:#f3efe4;--muted:#a9a6b8;--gold:#f2c14e;--red:#e85d5d;--green:#5fd39a;--line:#3a3f57}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(circle at 50% 0%,#232842 0%,var(--bg) 60%);color:var(--ink);font-family:'Gowun Dodum',system-ui,sans-serif;min-height:100vh;font-size:18px;line-height:1.6;-webkit-user-select:none;user-select:none}
  .wrap{max-width:980px;margin:0 auto;padding:16px 14px 40px}
  header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .brand{font-family:'Black Han Sans',sans-serif;font-size:20px;color:var(--gold)}
  .stats{display:flex;gap:8px;font-size:15px;flex-wrap:wrap}
  .pill{background:var(--panel);border:1px solid var(--line);padding:4px 12px;border-radius:999px}
  h1{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:36px;margin:0 0 6px;color:var(--gold)}
  h2{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:24px;margin:0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px}
  .story{background:var(--panel2);border-left:4px solid var(--gold);padding:14px 16px;border-radius:10px;margin:14px 0;text-align:left}
  .center{text-align:center}
  .muted{color:var(--muted);font-size:15px}
  button{font-family:inherit;font-size:18px;border:0;border-radius:12px;padding:10px 18px;cursor:pointer;font-weight:bold}
  .btn{background:var(--gold);color:#2a2100}
  .ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .roombar{display:flex;justify-content:space-between;align-items:center;margin:6px 0 8px;gap:8px;flex-wrap:wrap}
  .scene{position:relative;width:100%;border-radius:16px;overflow:hidden;border:2px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .hot{cursor:pointer}
  .obj{position:absolute;transform:translate(-50%,-50%);cursor:pointer;line-height:1;transition:transform .15s,filter .15s;filter:drop-shadow(0 4px 4px rgba(0,0,0,.45))}
  .obj:hover{transform:translate(-50%,-50%) scale(1.12);filter:drop-shadow(0 0 10px rgba(242,193,78,.8))}
  .obj .seen{position:absolute;right:-4px;top:-4px;font-size:12px;background:var(--green);color:#000;border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center;font-weight:bold}
  .inv{display:flex;gap:8px;align-items:center;margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px;min-height:62px;flex-wrap:wrap}
  .inv .lbl{color:var(--muted);font-size:14px;margin-right:4px}
  .item{display:flex;align-items:center;gap:6px;background:var(--panel2);border:2px solid transparent;border-radius:10px;padding:6px 10px;cursor:pointer;font-size:15px}
  .item span{font-size:24px}
  .item.sel{border-color:var(--gold);background:#3b3420}
  .selinfo{margin-left:auto;font-size:14px;color:var(--gold)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:14px;z-index:20}
  .modal.show{display:flex}
  .modal .card{width:100%;max-width:620px;max-height:92vh;overflow:auto;animation:pop .2s}
  @keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
  .mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .x{background:transparent;color:var(--muted);font-size:26px;padding:0 6px}
  .box{background:#161925;border:1px dashed var(--line);border-radius:12px;padding:16px;margin:10px 0;text-align:center}
  .paper{background:#fbf6e6;color:#2b2414;border-radius:6px;padding:16px 18px;text-align:left;box-shadow:0 4px 12px rgba(0,0,0,.4);font-size:17px}
  .paper table{border-collapse:collapse;margin:8px auto}
  .paper td{padding:3px 10px;border-bottom:1px solid #d9cfb3}
  .paper td.c{font-family:monospace;font-size:22px;font-weight:bold;letter-spacing:4px}
  .lockform{display:flex;gap:8px;margin-top:12px}
  .lockform input{flex:1;min-width:0;font-size:24px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:#0e1018;color:var(--ink);font-family:monospace;letter-spacing:6px;text-align:center;-webkit-user-select:text;user-select:text}
  .lockform input:focus{outline:none;border-color:var(--gold)}
  .msg{min-height:26px;margin-top:8px;font-weight:bold;text-align:center}
  .msg.bad{color:var(--red)}.msg.good{color:var(--green)}
  .shake{animation:shake .4s}
  @keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  .chalk{background:#1f4d36;border:10px solid #7a5230;border-radius:6px;color:#eef;padding:18px;font-size:24px;text-align:center}
  .poster{position:relative;height:240px;background:#fff;border-radius:6px;overflow:hidden;transition:background .4s}
  .poster .msgtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#2a46ff;font-size:24px;font-weight:bold;line-height:1.5}
  .poster .noise{position:absolute;font-weight:bold;color:#ff2a2a;pointer-events:none;transition:color .4s}
  .poster.filtered{background:#ff9d9d}
  .poster.filtered .noise{color:#ff9d9d;opacity:0}
  .poster.filtered .msgtxt{color:#2a0010}
  .ptable{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;font-size:13px}
  .ptable div{background:#2f3a5c;border-radius:4px;padding:4px 0;text-align:center}
  .ptable b{display:block;font-size:18px;color:#fff}
  .ptable small{color:#9fb0e0}
  .scale{font-size:30px;margin:6px 0;letter-spacing:4px}
  .scope{width:220px;height:220px;border-radius:50%;margin:0 auto;background:radial-gradient(circle,#e8f3ff 0%,#a9c3dc 70%,#223 72%);display:flex;align-items:center;justify-content:center;color:#123;font-size:26px;font-weight:bold;letter-spacing:3px;border:8px solid #333}
  .piano{position:relative;display:flex;justify-content:center;margin:12px auto 4px;height:170px;width:max-content;max-width:100%}
  .wk{width:46px;height:170px;background:#fff;border:2px solid #222;border-radius:0 0 8px 8px;cursor:pointer}
  .wk:active,.wk.hit{background:#ffe9a8}
  .bk{position:absolute;top:0;width:30px;height:105px;background:#111;border-radius:0 0 6px 6px;cursor:pointer;z-index:2}
  .bk:active{background:#444}
  .dots{display:flex;gap:8px;justify-content:center;margin-top:8px}
  .dots i{width:14px;height:14px;border-radius:50%;background:var(--panel2);border:1px solid var(--line)}
  .dots i.on{background:var(--gold)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--gold);color:#2a2100;padding:12px 22px;border-radius:999px;font-weight:bold;z-index:30;display:none;box-shadow:0 6px 18px rgba(0,0,0,.4)}
  .toast.show{display:block;animation:pop .25s}
  .hint{background:#2b2a1f;border:1px solid #5c5330;color:#f5e6b0;padding:10px 14px;border-radius:10px;margin-top:8px;text-align:left}
  .teaser{border:2px dashed var(--gold);border-radius:14px;padding:16px;margin-top:18px}
  .big-emoji{font-size:70px;line-height:1}
  @media (max-width:560px){.wk{width:30px}.bk{width:20px}.chalk{font-size:19px}}

  .tipbox{background:#16302a;border:1px solid #2f6f5c;color:#bff0dc;border-radius:10px;padding:8px 12px;margin:8px 0;font-size:15px;text-align:left}
  body.kids{font-size:20px}
  body.kids .paper{font-size:19px}
  body.kids .muted{font-size:16px}
  .speak{background:transparent;color:var(--gold,#f2c14e);font-size:20px;padding:0 8px}
</style>
</head>

const LV=(()=>{const q=new URLSearchParams(location.search).get('lv');const v=q||(()=>{try{return localStorage.getItem('class-level')}catch(e){return null}})()||'normal';return ['easy','normal','hard'].includes(v)?v:'normal'})();

const ITEMS={
  cello:{e:'🟥',n:'빨간 셀로판지'},

let S=load()||fresh();
function fresh(){return{room:-1,inv:[],sel:null,f:{},seen:{},hints:[0,0,0],start:null,end:null}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const norm=s=>s.replace(/\s/g,'').toUpperCase();
const $=id=>document.getElementById(id);

function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),2200)}
function give(id){if(!S.inv.includes(id)){S.inv.push(id);save();toast(`${ITEMS[id].e} ${ITEMS[id].n} 획득!`);renderInv()}}
function uses(id){return S.sel===id}
function consume(id){S.inv=S.inv.filter(x=>x!==id);if(S.sel===id)S.sel=null;save();renderInv()}

function openModal(title,html,setup){$('mtitle').textContent=title;$('mbody').innerHTML=html;$('modal').classList.add('show');if(setup)setup()}
function closeModal(){$('modal').classList.remove('show');render()}
$('mclose').onclick=closeModal;
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

function lock(opts){
  // opts: {label, placeholder, answer, ok(), maxlen}
  return `<div class="muted" style="text-align:center">${opts.label||''}</div>
  <form class="lockform" id="lf"><input id="li" maxlength="${opts.maxlen||8}" placeholder="${opts.placeholder||''}" autocomplete="off"><button class="btn">열기</button></form>
  <div class="msg" id="lm"></div>`;
}
function bindLock(answer,ok){
  const f=$('lf');if(!f)return;
  f.onsubmit=e=>{e.preventDefault();const v=norm($('li').value);if(!v)return;
    if(v===norm(answer)){$('lm').className='msg good';$('lm').textContent='✅ 철컥! 열렸다!';f.querySelectorAll('input,button').forEach(x=>x.disabled=true);setTimeout(ok,900)}
    else{$('lm').className='msg bad';$('lm').textContent='❌ 열리지 않는다…';const c=$('mcard');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')}
  };
}

let actx=null;
function tone(f){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.type='triangle';g.gain.setValueAtTime(.3,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.6);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+.6)}catch(e){}}

function clockSVG(){
  let nums='';for(let i=1;i<=12;i++){const a=(i*30-90)*Math.PI/180;nums+=`<text x="${100+72*Math.cos(a)}" y="${100+72*Math.sin(a)+7}" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">${i}</text>`}
  let ticks='';for(let i=0;i<60;i++){const a=(i*6-90)*Math.PI/180,r1=i%5?86:82;ticks+=`<line x1="${100+r1*Math.cos(a)}" y1="${100+r1*Math.sin(a)}" x2="${100+90*Math.cos(a)}" y2="${100+90*Math.sin(a)}" stroke="#555" stroke-width="${i%5?1:3}"/>`}
  const hand=(deg,len,w,c)=>{const a=(deg-90)*Math.PI/180;return `<line x1="100" y1="100" x2="${100+len*Math.cos(a)}" y2="${100+len*Math.sin(a)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`};
  return `<svg viewBox="0 0 200 200" width="230" height="230"><circle cx="100" cy="100" r="95" fill="#fffdf5" stroke="#7a5230" stroke-width="8"/>${ticks}${nums}${hand(DD.seq.hh%12*30+DD.seq.mm/2,48,8,'#111')}${hand(DD.seq.mm*6,78,5,'#c0392b')}<circle cx="100" cy="100" r="6" fill="#111"/></svg>`;
}
function posterHTML(filtered){
  let seed=7;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
  const chars='시계바늘칠판답문비밀번호짧은먼저그다음교실0123456789#@%&';

  [560,700,840].forEach(x=>s+=`${R(x-45,850,90,14,'#e17055','rx="4"')}${R(x-40,790,80,60,'#fab1a0','rx="8"')}${R(x-38,864,8,70,'#555')}${R(x+30,864,8,70,'#555')}`);
  // 사물함
  s+=R(1330,260,250,380,'#95a5a6','rx="4"');
  for(let r=0;r<2;r++)for(let c=0;c<3;c++){const x=1340+c*80,y=270+r*182;const door=R(x,y,72,172,'#b2bec3','stroke="#7f8c8d" stroke-width="3"')+R(x+10,y+20,40,6,'#7f8c8d')+R(x+10,y+32,40,6,'#7f8c8d')+`<circle cx="${x+58}" cy="${y+95}" r="6" fill="#636e72"/>`;s+=(r===1&&c===1)?hot('locker',door+`<circle cx="${x+58}" cy="${y+115}" r="5" fill="#2d3436"/>`):hot('locker2',door)}
  return svgWrap(s);
}

/* ---------- 피아노 ---------- */
function setupPiano(){
  const W=[['C4',261.6],['D4',293.7],['E4',329.6],['F4',349.2],['G4',392],['A4',440],['B4',493.9],['C5',523.3],['D5',587.3],['E5',659.3]];
  const target=DD.mus.notes;let step=0;
  const p=$('piano');const kw=window.innerWidth<560?30:46;
  W.forEach(([n,f])=>{const k=document.createElement('div');k.className='wk';k.onclick=()=>press(n,f,k);p.appendChild(k)});
  [0,1,3,4,5,7,8].forEach(i=>{const b=document.createElement('div');b.className='bk';b.style.left=(kw*(i+1)-(kw<40?10:15))+'px';b.onclick=()=>press('black',300+i*20,b);p.appendChild(b)});
  function press(n,f,k){
    tone(f);if(k.classList.contains('wk')){k.classList.add('hit');setTimeout(()=>k.classList.remove('hit'),180)}
    const dots=$('pdots').children;
    if(n===target[step]){dots[step].className='on';step++;
      if(step===target.length){$('pm').className='msg good';$('pm').textContent='🎵 아름다운 선율! 피아노 뚜껑 안에서 뭔가 떨어졌다!';S.f.piano=true;save();setTimeout(()=>{closeModal();give('lkey')},1400)}}
    else{step=0;[...dots].forEach(d=>d.className='');$('pm').className='msg bad';$('pm').textContent='삐걱… 틀린 음이다. 처음부터!'}
  }
}

/* ---------- 진행 ---------- */
function mx(){return Math.max(S.maxRoom||0,S.room)}
function nextRoom(t){closeModal();S.room++;S.maxRoom=Math.max(mx(),S.room);S.sel=null;save();render();if(t)toast(t)}
function goRoom(i){S.maxRoom=mx();S.room=i;S.sel=null;save();render()}
function finish(){S.end=Date.now();S.room=rooms.length;save();render()}

function renderInv(){
  const el=$('inv');if(!el)return;
  el.innerHTML=`<span class="lbl">🎒 소지품</span>`+(S.inv.length?S.inv.map(id=>`<div class="item ${S.sel===id?'sel':''}" data-id="${id}"><span>${ITEMS[id].e}</span>${ITEMS[id].n}</div>`).join(''):'<span class="muted">아직 없음</span>')+(S.sel?`<span class="selinfo">사용 중: ${ITEMS[S.sel].n} → 쓸 곳을 눌러 보세요</span>`:'');
  el.querySelectorAll('.item').forEach(it=>it.onclick=()=>{const id=it.dataset.id;S.sel=S.sel===id?null:id;save();renderInv()});
}

function render(){
  $('hintCount').textContent=S.hints.reduce((a,b)=>a+b,0);
  const app=$('app');
  if(S.room===-1)return renderIntro(app);
  if(S.room>=rooms.length)return renderEnd(app);
  const r=rooms[S.room];
  app.innerHTML=`<div class="roombar"><h2>방 ${S.room+1} / ${rooms.length} · ${r.name}</h2><div style="display:flex;gap:6px;flex-wrap:wrap">${S.room>0?`<button class="ghost" id="prevBtn">◀ 이전 방</button>`:''}${S.room<mx()?`<button class="ghost" id="nextBtn">다음 방 ▶</button>`:''}<button class="ghost" id="hintBtn">💡 힌트</button></div></div>
  <div class="scene">${r.scene()}</div><div class="inv" id="inv"></div>
  <p class="muted" style="text-align:center">방 안을 꼼꼼히 살펴보고 수상한 곳을 눌러 조사하세요. 얻은 물건은 소지품에서 눌러 선택한 뒤 쓸 곳을 누르면 돼요.</p>`;
  app.querySelectorAll('.hot').forEach(el=>{try{const b=el.getBBox();const h=document.createElementNS('http://www.w3.org/2000/svg','rect');h.setAttribute('x',b.x-6);h.setAttribute('y',b.y-6);h.setAttribute('width',b.width+12);h.setAttribute('height',b.height+12);h.setAttribute('fill','transparent');el.insertBefore(h,el.firstChild)}catch(e){}});
  app.querySelectorAll('.hot').forEach(el=>el.addEventListener('click',()=>{const o=r.objects.find(x=>x.id===el.dataset.id);if(!o)return;if(o.id==='door'&&S.room<mx()){goRoom(S.room+1);toast('이미 열어 둔 문이다. 다음 방으로!');return}o.click()}));
  if($('prevBtn'))$('prevBtn').onclick=()=>goRoom(S.room-1);
  if($('nextBtn'))$('nextBtn').onclick=()=>goRoom(S.room+1);
  $('hintBtn').onclick=showHints;
  renderInv();
}
function showHints(){
  const r=rooms[S.room];const n=S.hints[S.room];
  const html=r.hints.slice(0,n).map((h,i)=>`<div class="hint">💡 ${i+1}. ${h}</div>`).join('')+(n<r.hints.length?`<div class="center" style="margin-top:14px"><button class="btn" id="moreHint">힌트 ${n+1} 열기</button><div class="muted">힌트를 쓰면 기록에 남아요</div></div>`:'<p class="muted center">이 방의 힌트를 모두 열었어요.</p>');
  openModal(`💡 ${r.name} 힌트`,html,()=>{const b=$('moreHint');if(b)b.onclick=()=>{S.hints[S.room]++;save();$('hintCount').textContent=S.hints.reduce((a,b)=>a+b,0);showHints()}});
}

  app.innerHTML=`<div class="card center"><div class="big-emoji">⏳</div><h1>사라진 타임캡슐</h1><div class="muted" style="font-weight:bold">${GRADE}학년 · ${LVN}${LV==='easy'?' · 🧭 문제마다 도움말이 나와요':LV==='hard'?' · 정답 힌트 없음':''}</div>
  <div class="muted">3일 연속 방탈출 · 1일차 「단서를 쫓아라」</div>
  <div class="story">졸업식을 앞둔 지산초등학교 6학년. 6년 동안의 추억을 담은 <b>타임캡슐</b>이 감쪽같이 사라졌다.<br><br>
  범인 <b>X</b>는 교실, 과학실, 음악실 곳곳에 수수께끼를 숨겨 두었다. 방 안의 물건을 하나하나 조사하고, 단서를 조합해 잠긴 문을 열어라!</div>
  <p class="muted">방 3개 · 물건을 눌러 조사 · 얻은 물건은 선택해서 사용 · 막히면 💡 힌트</p>
  <button class="btn" id="startBtn" style="font-size:22px;padding:14px 40px">수사 시작!</button></div>`;
  $('startBtn').onclick=()=>{S.room=0;S.start=Date.now();save();render()};
}
function fmt(ms){const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function renderEnd(app){
  const t=S.end&&S.start?fmt(S.end-S.start):'--:--';const h=S.hints.reduce((a,b)=>a+b,0);
  app.innerHTML=`<div class="card center"><div class="big-emoji">📦</div><h1>1일차 수사 완료!</h1>
  <p>기록 <b style="color:var(--gold)">${t}</b> · 힌트 <b style="color:var(--gold)">${h}번</b></p>
  <div class="story">상자 안에는 타임캡슐 대신 봉투 하나가 들어 있었다.<br><br>
  <i>"제법이군, 탐정들. 하지만 타임캡슐은 내가 안전하게 보관하고 있다.<br>진짜 범인이 누구인지 알고 싶다면… 내일 다시 오너라.<br>힌트를 하나 주지. 나는 너희를 아주 잘 아는 사람이다."</i>
  <div style="text-align:right;margin-top:8px">— X</div></div>
  <div class="teaser"><b style="color:var(--gold)">📅 2일차 예고 「용의자는 셋」</b><br>범인 X는 누구일까? 내일은 용의자들의 진술과 알리바이를 파헤친다!</div>${LV!=='hard'?`<p><a class="btn" style="text-decoration:none;display:inline-block" href="${location.pathname.split('/').pop()}?lv=${LV==='easy'?'normal':'hard'}">다음 단계 (${LV==='easy'?'🟡 보통':'🔴 어려움'}) 도전하기 →</a></p>`:''}</div>`;
}

setInterval(()=>{$('timer').textContent=S.start?fmt((S.end||Date.now())-S.start):'00:00'},500);
$('resetBtn').onclick=()=>openModal('처음부터 다시 할까요?','<p class="muted">지금까지 푼 기록이 모두 지워져요.</p><div class="center"><button class="btn" id="yesReset">다시 시작</button></div>',()=>{$('yesReset').onclick=()=>{S=fresh();save();closeModal()}});
render();

if(document.getElementById('speak'))document.getElementById('speak').onclick=()=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance((document.getElementById('mtitle').textContent+'. '+document.getElementById('mbody').innerText).replace(/[★□]/g,' '));u.lang='ko-KR';u.rate=.95;speechSynthesis.speak(u)}catch(e){}};
try{const _om=openModal;openModal=function(){try{speechSynthesis.cancel()}catch(e){}return _om.apply(this,arguments)}}catch(e){}
if(document.getElementById('lvPill'))document.getElementById('lvPill').textContent=GRADE+'학년 · '+LVN;
</script>
