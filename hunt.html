	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");

	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);

	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {

function chunks(set,n){const p=[...PHRASE[set-1]];const out=[];let k=0;for(let i=0;i<n;i++){const len=Math.floor(p.length/n)+(i<p.length%n?1:0);out.push(p.slice(k,k+len).join(''));k+=len}return out}

const warmOf=(set,st)=>WARM[(st*3+set)%WARM.length];
const codeOf=(set,st,n)=>SETL[set-1]+st+''+n;
function parseCode(c){c=String(c).trim().toUpperCase();const m=c.match(/^([ABC])([1-8])([4-8])$/);if(!m)return null;const set=SETL.indexOf(m[1])+1,st=+m[2],n=+m[3];if(st>n)return null;return{set,st,n}}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>{d.style.opacity=0;setTimeout(()=>d.remove(),400)},1500)}
let AC;function beep(f,d,t='sine',v=.1){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
function qrSvg(text,px){const q=new QRLIB.QRCode(-1,QRLIB.ECL.M);q.addData(text);q.make();const n=q.getModuleCount();let d='';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c+4} ${r+4}h1v1h-1z`;return `<svg viewBox="0 0 ${n+8} ${n+8}" width="${px}" height="${px}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`}
/* 진행 저장: 판(set)·미션 수(n)별 */
const KEY=(set,n)=>`hunt-${set}-${n}`;
const load=(set,n)=>{try{return JSON.parse(localStorage.getItem(KEY(set,n)))||{got:{},t0:0}}catch(e){return{got:{},t0:0}}};
const save=(set,n,s)=>{try{localStorage.setItem(KEY(set,n),JSON.stringify(s));localStorage.setItem('hunt-last',JSON.stringify({set,n}))}catch(e){}};
function show(id){['home','pass','mission','teach'].forEach(x=>$(x).classList.toggle('hide',x!==id));scrollTo(0,0)}
/* ---------- 탐험 수첩 ---------- */
function renderPass(){let last={set:1,n:6};try{last=JSON.parse(localStorage.getItem('hunt-last'))||last}catch(e){}
 const {set,n}=last;const s=load(set,n);const ch=chunks(set,n);const cnt=Object.keys(s.got).length;
 $('pass').innerHTML=`<div class="card center"><h2 style="margin:4px 0">🎒 탐험 수첩</h2>
  <p style="color:#6b7280">${s.t0?`${SETL[set-1]}판 · 미션 ${n}개 중 <b>${cnt}개</b> 완료`:'아직 시작하지 않았어요. 첫 번째 미션 QR을 찾아보세요!'}</p>
  <div class="chunks">${ch.map((c,i)=>s.got[i+1]?`<div class="chunk"><small>${i+1}번 조각</small>${c}</div>`:`<div class="chunk no"><small>${i+1}번 조각</small>？</div>`).join('')}</div>
  ${s.t0&&cnt===n?`<button class="btn y" id="toFinal">🔐 최종 암호 풀기</button>`:''}
 </div>
 <div class="card center"><h3 style="margin:2px 0">📷 미션 QR을 찾았나요?</h3>
  <p style="color:#6b7280;font-size:16px">기기의 카메라 앱으로 QR을 찍으면 미션이 열려요.<br>QR을 찍을 수 없으면 포스터 아래의 <b>미션 코드</b>를 입력하세요.</p>
  <div class="codein"><input id="code" maxlength="3" placeholder="A36"><button class="btn" id="codeGo">열기</button></div></div>
 <div class="center"><button class="btn g" id="passHome">🏠 처음으로</button></div>`;
 $('codeGo').onclick=()=>{const c=parseCode($('code').value);if(!c){toast('코드를 다시 확인해요 (예: A36)');return}openMission(c.set,c.st,c.n)};
 $('code').onkeydown=e=>{if(e.key==='Enter')$('codeGo').click()};
 $('passHome').onclick=()=>show('home');
 if($('toFinal'))$('toFinal').onclick=()=>renderFinal(set,n);
 show('pass')}
/* ---------- 미션 ---------- */
function openMission(set,st,n){const s=load(set,n);if(!s.t0){s.t0=Date.now();save(set,n,s)}else save(set,n,s);
 const ch=chunks(set,n)[st-1];
 if(s.got[st]){$('mission').innerHTML=`<div class="card reward"><h2>✅ 미션 ${st} 완료!</h2><p>이미 이 조각을 모았어요.</p><div class="gem">${ch}</div><p><small>${st}번 조각</small></p><button class="btn" id="mPass">🎒 탐험 수첩 보기</button></div>`;$('mPass').onclick=renderPass;show('mission');return}
 const q=qOf(set,st),w=warmOf(set,st);
 $('mission').innerHTML=`<div class="card center"><div style="font-size:15px;color:#6b7280">${SETL[set-1]}판 · 미션 ${st} / ${n}</div><h2 style="margin:4px 0;color:#166534">🧭 미션 ${st}</h2></div>
 <div class="card" id="warmBox"><div class="warm"><div>💪 1단계 · 몸풀기</div><div class="act">${w}</div><div class="cnt" id="cnt">${WSEC}</div><button class="btn" id="wGo">▶ 시작!</button></div></div>
 <div class="card hide" id="qBox"><div style="color:#0e7490;font-family:Jua">🧠 2단계 · 문제</div><div id="qArea"></div></div>`;
 show('mission');
 $('wGo').onclick=()=>{$('wGo').disabled=true;let t=WSEC;const iv=setInterval(()=>{t--;$('cnt').textContent=t;if(t<=3&&t>0)beep(660,.08);if(t<=0){clearInterval(iv);beep(990,.25);$('cnt').textContent='끝!';$('qBox').classList.remove('hide');renderQ(q,()=>win(set,st,n));$('qBox').scrollIntoView({behavior:'smooth'})}},1000)}}
function renderQ(q,ok){const A=$('qArea');const fail=()=>{beep(180,.3,'sawtooth');A.classList.remove('shake');void A.offsetWidth;A.classList.add('shake');toast('다시 생각해 봐요! 🤔')};
 if(q.k==='m'){const o=shuffle(q.o);const sel=new Set();A.innerHTML=`<div class="q">${q.q}</div><div class="opts">${o.map((x,i)=>`<button data-i="${i}">${esc(x[0])}</button>`).join('')}</div><div class="center" style="margin-top:12px"><button class="btn" id="qOk">✔ 확인</button></div>`;
  A.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;sel.has(i)?sel.delete(i):sel.add(i);b.classList.toggle('on')});
  $('qOk').onclick=()=>{if(o.every((x,i)=>!!x[1]===sel.has(i)))ok();else fail()}}
 if(q.k==='o'){const o=shuffle([...q.a,...(q.d||[])]);let seq=[];const draw=()=>{A.innerHTML=`<div class="q">${q.q}</div><div class="opts">${o.map(x=>{const k=seq.indexOf(x);return `<button data-v="${esc(x)}" class="${k>=0?'on':''}">${esc(x)}${k>=0?`<i>${k+1}</i>`:''}</button>`}).join('')}</div><div class="center" style="margin-top:12px"><button class="btn g" id="qRe">↺ 다시</button> <button class="btn" id="qOk">✔ 확인</button></div>`;
  A.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{const v=b.dataset.v;if(seq.includes(v))return;seq.push(v);draw()});$('qRe').onclick=()=>{seq=[];draw()};$('qOk').onclick=()=>{if(seq.length===q.a.length&&seq.every((v,i)=>v===q.a[i]))ok();else{fail();seq=[];setTimeout(draw,350)}}};draw()}
 if(q.k==='p'){const L=shuffle(q.l),R=shuffle([...new Set(q.l.map(x=>x[1]))]);A.innerHTML=`<div class="q">${q.q}</div>${L.map((x,i)=>`<div class="mrow"><div class="l">${esc(x[0])}</div><select data-i="${i}"><option value="">고르기 ▾</option>${R.map(r=>`<option>${esc(r)}</option>`).join('')}</select></div>`).join('')}<div class="center" style="margin-top:12px"><button class="btn" id="qOk">✔ 확인</button></div>`;
  $('qOk').onclick=()=>{const v=[...A.querySelectorAll('select')].map(s=>s.value);if(v.every((x,i)=>x===L[i][1]))ok();else fail()}}
 if(q.k==='s'){const I=shuffle(q.i);A.innerHTML=`<div class="q">${q.q}</div>${I.map((x,i)=>`<div class="mrow"><div class="l">${esc(x[0])}</div><select data-i="${i}"><option value="">어디에? ▾</option>${q.b.map((b,j)=>`<option value="${j}">${esc(b)}</option>`).join('')}</select></div>`).join('')}<div class="center" style="margin-top:12px"><button class="btn" id="qOk">✔ 확인</button></div>`;
  $('qOk').onclick=()=>{const v=[...A.querySelectorAll('select')].map(s=>s.value);if(v.every((x,i)=>x!==''&&+x===I[i][1]))ok();else fail()}}}
function win(set,st,n){const s=load(set,n);s.got[st]=1;save(set,n,s);beep(784,.15);setTimeout(()=>beep(1046,.3),150);
 const ch=chunks(set,n)[st-1],cnt=Object.keys(s.got).length;
 $('mission').innerHTML=`<div class="card reward"><h2>🎉 미션 ${st} 성공!</h2><p>보물 조각을 얻었어요!</p><div class="gem">${ch}</div><p><b>${st}번 조각</b> · 모은 조각 ${cnt} / ${n}</p>
 <p style="color:#6b7280">${cnt===n?'조각을 모두 모았어요! 최종 암호를 풀어 봐요.':'다음 미션 장소를 찾아 떠나요! 🏃'}</p>
 ${cnt===n?'<button class="btn y" id="mFinal">🔐 최종 암호 풀기</button> ':''}<button class="btn g" id="mPass">🎒 탐험 수첩</button></div>`;show('mission');
 $('mPass').onclick=renderPass;if($('mFinal'))$('mFinal').onclick=()=>renderFinal(set,n)}
/* ---------- 최종 암호 ---------- */
function renderFinal(set,n){const ch=chunks(set,n);const s=load(set,n);
 if(s.done){return renderCert(set,n)}
 const opts=shuffle(ch.map((c,i)=>({c,i})));let seq=[];
 const draw=()=>{$('mission').innerHTML=`<div class="card center"><h2 style="margin:4px 0">🔐 최종 암호</h2><p>모은 보물 조각을 <b>조각 번호 순서대로</b> 이어 붙이면 비밀 문장이 나와요.<br>번호를 떠올리며 조각을 차례로 눌러요!</p>
  <div class="chunks" style="min-height:60px">${seq.map(i=>`<div class="chunk">${ch[i]}</div>`).join('')||'<span style="color:#9ca3af">여기에 문장이 만들어져요</span>'}</div>
  <div class="opts">${opts.map(o=>`<button data-i="${o.i}" class="${seq.includes(o.i)?'on':''}">${ch[o.i]}</button>`).join('')}</div>
  <div style="margin-top:12px"><button class="btn g" id="fRe">↺ 다시</button> <button class="btn y" id="fOk">🔓 열기</button></div></div>`;
  document.querySelectorAll('#mission .opts button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(seq.includes(i))return;seq.push(i);draw()});
  $('fRe').onclick=()=>{seq=[];draw()};
  $('fOk').onclick=()=>{if(seq.length===n&&seq.every((v,i)=>v===i)){const s2=load(set,n);s2.done=Date.now();save(set,n,s2);[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.25),i*150));renderCert(set,n)}else{beep(180,.3,'sawtooth');toast('순서가 달라요! 조각 번호를 확인해요');seq=[];setTimeout(draw,300)}}};
 draw();show('mission')}
function renderCert(set,n){const s=load(set,n);const sec=Math.round((s.done-s.t0)/1000);const mm=Math.floor(sec/60),ss=sec%60;
 $('mission').innerHTML=`<div class="cert"><div style="font-size:70px">🏆</div><h2>탐험 성공!</h2><p style="font-size:22px">비밀 문장: <b>${PHRASE[set-1]}</b></p>
 <p>${SETL[set-1]}판 · 미션 ${n}개를 모두 해결했어요.<br>걸린 시간 <b>${mm}분 ${ss}초</b></p><p style="color:#92400e">이 화면을 선생님께 보여 주세요! 🎖️</p>
 <button class="btn g" id="cHome">🏠 처음으로</button></div>`;show('mission');$('cHome').onclick=()=>show('home')}
/* ---------- 선생님 ---------- */
function renderTeach(){let cfg={set:1,n:6,places:DEFPLACE.slice()};try{cfg=Object.assign(cfg,JSON.parse(localStorage.getItem('hunt-cfg')))}catch(e){}
 $('teach').innerHTML=`<div class="card setup"><h2 style="margin:4px 0">🧑‍🏫 미션 준비하기</h2>
 <label>🎲 판 선택 <select id="tSet">${[1,2,3].map(i=>`<option value="${i}" ${cfg.set==i?'selected':''}>${SETL[i-1]}판 (문제와 비밀 문장이 달라요)</option>`).join('')}</select></label>
 <label>🧭 미션 수 <select id="tN">${[4,5,6,7,8].map(i=>`<option ${cfg.n==i?'selected':''}>${i}</option>`).join('')}</select> 개</label>
 <div class="places" id="tPl"></div>
 <p style="color:#6b7280;font-size:15px">장소 이름은 포스터에만 적혀요. 학생들은 어떤 순서로 돌아도 괜찮아요. 미션마다 <b>몸풀기 ${WSEC}초 → 교과 문제</b> 순서로 진행돼요.</p>
 <div class="center"><button class="btn" id="tPrint">🖨️ QR 포스터 + 정답표 인쇄</button> <button class="btn g" id="tHome">🏠</button></div></div>
 <div class="card"><h3 style="margin:2px 0">📋 미리 보기 · 정답표</h3><div id="tKey"></div></div>
 <div class="card"><h3 style="margin:2px 0">💡 운영 팁</h3><ul style="line-height:1.7;margin:4px 0;padding-left:22px">
  <li>포스터는 학생 눈높이에 붙이고, 장소마다 한 장씩 붙여요.</li>
  <li>QR은 기기 기본 카메라 앱으로 찍으면 바로 열려요. 카메라가 안 되면 <b>탐험 수첩 → 미션 코드</b> 입력!</li>
  <li>모둠별로 출발 미션을 다르게 정하면 한곳에 몰리지 않아요.</li>
  <li>진행 기록은 학생 기기마다 따로 저장돼요. 한 기기를 모둠이 함께 써도 좋아요.</li></ul></div>`;
 const pl=()=>{const n=+$('tN').value;$('tPl').innerHTML=Array.from({length:n},(_,i)=>`<input data-i="${i}" value="${esc(cfg.places[i]||'')}" placeholder="미션 ${i+1} 장소 (예: 도서관 입구)">`).join('');
  const set=+$('tSet').value;const ch=chunks(set,n);
  $('tKey').innerHTML=`<p>비밀 문장: <b>${PHRASE[set-1]}</b></p><table class="ak"><tr><th>미션</th><th>코드</th><th>조각</th><th>문제 · 정답</th></tr>${Array.from({length:n},(_,i)=>{const q=qOf(set,i+1);return `<tr><td>${i+1}</td><td><b>${codeOf(set,i+1,n)}</b></td><td>${ch[i]}</td><td>${esc(q.q)}<br><small>${answerText(q)}</small></td></tr>`}).join('')}</table>`};
 $('tSet').onchange=pl;$('tN').onchange=pl;pl();
 $('tHome').onclick=()=>show('home');
 $('tPrint').onclick=()=>{const set=+$('tSet').value,n=+$('tN').value;cfg={set,n,places:[...$('tPl').querySelectorAll('input')].map(x=>x.value)};try{localStorage.setItem('hunt-cfg',JSON.stringify(cfg))}catch(e){}
  const base=location.origin+location.pathname;const ch=chunks(set,n);
  $('print').innerHTML=`<div class="keypage"><h2>🗺️ 학교 퍼즐 헌트 · ${GRADE}학년 · ${SETL[set-1]}판 정답표 (교사용)</h2>${$("tKey").innerHTML}</div>`+
   Array.from({length:n},(_,i)=>`<div class="poster"><div class="h">🗺️ 학교 퍼즐 헌트 · ${GRADE}학년</div><div class="no">미션 ${i+1}</div><div class="pl">📍 ${esc(cfg.places[i]||'')}</div>${qrSvg(`${base}?set=${set}&st=${i+1}&n=${n}`,330)}<div class="code">코드 ${codeOf(set,i+1,n)}</div><div class="f">기기 카메라로 QR을 찍거나, 「학교 퍼즐 헌트 → 탐험 수첩」에서 코드를 입력하세요.</div></div>`).join('');
  setTimeout(()=>window.print(),300)};
 show('teach')}
function answerText(q){if(q.k==='m')return '정답: '+q.o.filter(x=>x[1]).map(x=>x[0]).join(', ');if(q.k==='o')return '순서: '+q.a.join(' → ');if(q.k==='p')return q.l.map(x=>x[0]+' → '+x[1]).join(' / ');return q.b.map((b,j)=>b+': '+q.i.filter(x=>x[1]===j).map(x=>x[0]).join(', ')).join(' / ')}
/* ---------- 시작 ---------- */
$('goPass').onclick=renderPass;$('goTeach').onclick=renderTeach;
const U=new URLSearchParams(location.search);
if(U.get('set')&&U.get('st')&&U.get('n')){const set=+U.get('set'),st=+U.get('st'),n=+U.get('n');if(set>=1&&set<=3&&n>=4&&n<=8&&st>=1&&st<=n)openMission(set,st,n);else show('home')}else show('home');
window.__hunt={BANK,qOf,chunks,openMission,renderFinal,load,parseCode};
</script>
</body>
</html>
