<script>

const D=DATA[LV];const SKEY=LV==='normal'?KEY:KEY+'-'+LV;

const josa=(w,a,b)=>{const c=w.charCodeAt(w.length-1)-0xAC00;return w+((c>=0&&c<11172&&c%28)?a:b)};
const wait=ms=>new Promise(r=>setTimeout(r,FAST?Math.min(ms,8):ms));
function h(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
/* ── 상태 ── */
let S;

function save(){try{localStorage.setItem(SKEY,JSON.stringify(S))}catch(e){}}
S=load();
/* 하루마다 같은 결과가 나오는 난수 */
function RNG(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
let rnd=RNG(S.seed+S.day*7919);
const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
const pick=a=>a[Math.floor(rnd()*a.length)];
/* ── 소리 ── */
let MUTE=false;try{MUTE=localStorage.getItem('kid-mute')==='1'}catch(e){}
const mb=$('#mute');const sm=()=>mb.textContent=MUTE?'🔕':'🔔';sm();mb.onclick=()=>{MUTE=!MUTE;sm();try{localStorage.setItem('kid-mute',MUTE?'1':'0')}catch(e){}};
let AC=null;
function tone(f,d,type,vol,at){if(MUTE||FAST)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+(at||0);o.type=type||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol||.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
const SND={
  good:()=>{tone(660,.1);tone(990,.15,'sine',.12,.09)},
  bad:()=>tone(160,.25,'square',.05),
  coin:()=>{tone(1320,.06,'square',.05);tone(1760,.12,'square',.05,.06)},
  pop:()=>tone(520+Math.random()*300,.08,'triangle',.1),
  click:()=>tone(800,.04,'triangle',.06),
  fan:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.25,'sine',.12,i*.12)),
  boom:()=>{tone(90,.4,'sawtooth',.06);tone(300,.3,'triangle',.05,.05)},
  splash:()=>{tone(400,.12,'sine',.06);tone(250,.15,'sine',.05,.07)},
};
/* ── 효과 ── */
const FX={
  at(el){const r=el.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]},
  float(x,y,txt,color){if(FAST)return;const e=h('div','fx float',txt);e.style.left=x+'px';e.style.top=y+'px';if(color)e.style.color=color;document.body.appendChild(e);setTimeout(()=>e.remove(),1400)},
  floatOn(el,txt,color){const[x,y]=FX.at(el);FX.float(x,y,txt,color)},
  burst(x,y,emos,n){if(FAST)return;n=n||10;for(let i=0;i<n;i++){const e=h('div','fx part',emos[i%emos.length]);e.style.left=x+'px';e.style.top=y+'px';document.body.appendChild(e);const a=Math.random()*Math.PI*2,r=50+Math.random()*70;requestAnimationFrame(()=>{e.style.transform=`translate(calc(-50% + ${Math.cos(a)*r}px),calc(-50% + ${Math.sin(a)*r}px)) scale(.6)`;e.style.opacity=0});setTimeout(()=>e.remove(),1100)}},
  burstOn(el,emos,n){const[x,y]=FX.at(el);FX.burst(x,y,emos,n)},
  coins(fromEl,n){if(FAST)return;const[x,y]=FX.at(fromEl),[tx,ty]=FX.at($('#hMoney'));n=Math.min(n||5,10);for(let i=0;i<n;i++){setTimeout(()=>{const e=h('div','fx coinfly','🪙');e.style.left=(x+Math.random()*30-15)+'px';e.style.top=(y+Math.random()*20-10)+'px';document.body.appendChild(e);requestAnimationFrame(()=>requestAnimationFrame(()=>{e.style.left=tx+'px';e.style.top=ty+'px';e.style.transform='translate(-50%,-50%) scale(.5)'}));setTimeout(()=>{e.remove();SND.coin()},720)},i*70)}},
  shake(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')},
  confetti(){if(FAST)return;const em=['🎉','⭐','🎈','✨','🌟','🍬','💖'];for(let i=0;i<34;i++){const c=h('div','conf',em[i%em.length]);c.style.left=Math.random()*100+'vw';c.style.animationDelay=Math.random()*.8+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),3400)}},
  fireworks(n){if(FAST)return;const sc=$('#scene');const cols=['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#c77dff','#fff'];for(let k=0;k<(n||4);k++)setTimeout(()=>{const x=15+Math.random()*70,y=10+Math.random()*30;SND.boom();for(let i=0;i<18;i++){const p=h('div','firework');const a=i/18*Math.PI*2,r=50+Math.random()*30;p.style.left=x+'%';p.style.top=y+'%';p.style.background=cols[i%cols.length];p.style.setProperty('--dx',Math.cos(a)*r+'px');p.style.setProperty('--dy',Math.sin(a)*r+'px');p.style.boxShadow=`0 0 8px ${cols[i%cols.length]}`;sc.appendChild(p);setTimeout(()=>p.remove(),1300)}},k*450)},
};

function setTime(t){const sky=$('#sky'),sun=$('#sun'),sc=$('#scene');let a=SKY[0],b=SKY[SKY.length-1];for(let i=0;i<SKY.length-1;i++)if(t>=SKY[i][0]&&t<=SKY[i+1][0]){a=SKY[i];b=SKY[i+1];break}
  const k=(t-a[0])/((b[0]-a[0])||1);const mix=(c1,c2)=>{const p=x=>[1,3,5].map(i=>parseInt(x.substr(i,2),16));const A=p(c1),B=p(c2);return'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*k)).join(',')+')'};
  sky.style.background=`linear-gradient(${mix(a[1],b[1])},${mix(a[2],b[2])})`;
  const night=t<.12||t>.9;sc.classList.toggle('night',night);sun.textContent=night?'🌙':'☀️';
  const st=night?(t>.9?(t-.9)/.1:t/.12+.0):(t-.12)/.78;sun.style.left=(8+84*Math.min(1,Math.max(0,st)))+'%';sun.style.top=(40-30*Math.sin(Math.PI*Math.min(1,Math.max(0,st))))+'%'}
function weather(w){const wx=$('#wx');wx.innerHTML='';$('#sun').style.opacity=(w==='rain'||w==='snow'||w==='storm')?.25:1;

  if(w==='heat')wx.appendChild(h('div','heat'))}
function clouds(n){const sc=$('#scene');sc.querySelectorAll('.cloud').forEach(c=>c.remove());for(let i=0;i<n;i++){const c=h('div','cloud','☁️');c.style.top=(4+Math.random()*18)+'%';c.style.animationDelay=(-Math.random()*40)+'s';c.style.animationDuration=(30+Math.random()*25)+'s';sc.appendChild(c)}}

    if(useInput){const inp=h('input','inbox');inp.inputMode='decimal';inp.placeholder='숫자';const b=h('button','btn go','확인');b.onclick=()=>{if(inp.value.trim())judge(inp.value.trim(),null)};inp.onkeydown=e=>{if(e.key==='Enter')b.click()};box.append(h('div','row'),msg);box.children[1].append(inp,h('span','jua',q.unit||''),b);setTimeout(()=>inp.focus(),60)}
    else{const row=h('div','opts');(q.opts||numOpts(q.ans)).forEach(o=>{const b=h('button','opt',typeof o==='number'?o.toLocaleString()+(q.unit||''):o);b.dataset.v=o;b.onclick=()=>{if(b.classList.contains('no')||b.classList.contains('ok'))return;judge(o,b)};row.appendChild(b)});box.append(row,msg)}
    $('#ov').classList.remove('hide')})}

  if(misOk){earn(S.g.mis.r,$('#hMoney'));S.rep=Math.min(100,S.rep+5);FX.confetti();SND.fan();hud()}
  const lq=G.ledger(rep);

  S.hist.push({day:S.day,money:S.money,net});
  S.day++;
  if(S.day>D.days||G.done&&G.done()){return finish()}
  save();morning();
}

<script>

    const g=S.g,s=g.slots[i];
    if(!s.r){return this.buildMenu(i)}
    const R=RIDE[s.r];const up=Math.round(R.cost*.6*s.lv/D.M)*D.M,ref=Math.round(s.inv*.5/D.M)*D.M,fix=Math.round(R.cost*D.repair/D.M)*D.M;
    const btns=[];const acts=[];
    if(s.broken){btns.push([`🔧 수리 ${won(fix)}`,'go']);acts.push('fix')}
    if(R.fun>0&&s.lv<3&&F.has('upgrade')){btns.push([`⬆️ Lv${s.lv+1} ${won(up)}`,'go']);acts.push('up')}
    btns.push([`🔨 철거 (+${won(ref)})`,'']);acts.push('del');btns.push(['닫기','ghost']);acts.push('x');
    modal(`<div class="big">${R.e}</div><h2>${R.n}${s.lv>1?' Lv'+s.lv:''}${s.broken?' 🔧고장':''}</h2><div class="rep"><span>재미</span><b>${this.rf(s)}</b><span>하루에 태우는 손님</span><b>${this.rc(s)}명</b><span>운영비</span><b>${won(R.up)}</b></div>${R.fun>0&&s.lv<3&&F.has('upgrade')?`<div class="hint">업그레이드하면 재미 +1, 태우는 손님 +15명</div>`:''}`,btns).then(k=>{
      const a=acts[k];const el2=()=>document.querySelector(`.slot[data-i="${i}"]`);
      if(a==='fix'){if(!canPay(fix)){SND.bad();return}earn(-fix,null);g.spent+=fix;s.broken=false;SND.good();this.scene();FX.burstOn(el2(),['✨','🔧','⭐'],8)}
      if(a==='up'){if(!canPay(up)){SND.bad();FX.floatOn(el2(),'돈이 모자라요','#e04848');return}earn(-up,null);g.spent+=up;s.inv+=up;s.lv++;SND.fan();this.scene();const e=el2();e.classList.add('popin');FX.burstOn(e,['⬆️','✨','⭐'],10);FX.floatOn(e,`${R.n} Lv${s.lv}!`,'#7048e8')}
      if(a==='del'){const e=el2();FX.burstOn(e,['💥','🧱','💨'],12);SND.boom();earn(ref,e);g.slots[i]={r:null,lv:1,broken:false,inv:0};this.scene()}
      this.panel($('#panel'));save()});
  },
  buildMenu(i){
    const box=h('div','');box.innerHTML=`<h2>🏗️ 무엇을 지을까요?</h2><div class="hint">가진 돈 ${won(S.money)}</div>`;const grid=h('div','shopgrid');
    D.rides.filter(R=>!R.feat||F.has(R.feat)).forEach(R=>{const b=h('button','shopitem',`<b>${R.e}</b><span class="nm">${R.n}</span><span class="ds">${R.desc||`재미 ${R.fun} · ${R.cap}명`}<br>운영비 ${won(R.up)}</span><span class="pr">${won(R.cost)}</span>`);b.dataset.r=R.id;if(!canPay(R.cost))b.disabled=true;
      b.onclick=()=>{closeModal();this.build(i,R.id)};grid.appendChild(b)});
    box.appendChild(grid);modal(box,[['취소','ghost']]);
  },
  build(i,id){const R=RIDE[id],g=S.g;if(!canPay(R.cost))return;earn(-R.cost,null);g.spent+=R.cost;g.slots[i]={r:id,lv:1,broken:false,inv:R.cost};SND.pop();this.scene();
    const el=document.querySelector(`.slot[data-i="${i}"]`);el.classList.add('popin');FX.burstOn(el,['✨','🎉','⭐'],10);FX.floatOn(el,R.n+' 완성!','#7048e8');g.exp=Math.round(this.expVis());this.panel($('#panel'));save()},
  missions(){const g=S.g,e=g.exp||20,M=D.M;return[
    {t:`손님 ${Math.round(e*1.05)}명 넘기기`,test:r=>r.vis>=Math.round(e*1.05)},
    {t:'만족도 80% 이상',test:r=>r.sat>=80},
    {t:'화난 손님 0명',test:r=>r.vis>0&&r.angry===0},
    {t:`오늘 수입 ${won(Math.round(e*this.price()*.9/M)*M)} 넘기기`,test:r=>r.ticket+r.stall>=Math.round(e*this.price()*.9/M)*M},
  ]},
  async day(){
    const g=S.g,fun=this.fun(),cap=this.cap(),p=this.price(),fair=this.fair();
    const pm=Math.max(.15,Math.min(1.4,1.25-.2*(p/D.M-fair)));
    let vis=Math.round(this.expVis()*pm)+(g.ev==='group'?D.group:0);if(fun===0)vis=Math.min(vis,3);
    const served=Math.min(vis,cap),angry=vis-served;
    const toilets=this.count('toilet'),flowers=this.count('flower');
    const trashN=(g.trash||[]).length;
    let sat=72+4*flowers+6*Math.min(2,toilets)+4*g.staff.clean+(p/D.M<fair-.5?8:0)-(p/D.M>fair+1?14:0)-Math.round(45*angry/Math.max(1,vis))-(g.wx==='rain'?6:0)+(g.ev==='festival'?5:0)-2*Math.min(8,trashN);
    if(fun===0)sat=20;sat=Math.max(0,Math.min(100,sat));
    // 가게 수입
    const base=Math.min(vis,D.snackCap)*D.snackP;
    const stall=this.count('snack')*base+this.count('ice')*Math.round(base*({heat:2.2,sun:1.2,cloud:.6,rain:.15}[g.wx]))+this.count('umbrella')*Math.round(base*({rain:2.6,cloud:.3,sun:.05,heat:0}[g.wx]));
    const stallR=Math.round(stall/D.M)*D.M;
    // 애니메이션
    weather(g.wx);document.querySelectorAll('.ride').forEach(r=>r.classList.add('run'));
    const w=$('#world');const rides=[...document.querySelectorAll('.slot.built:not(.broken)')];
    const shown=Math.min(vis,FAST?0:22);
    for(let k=0;k<shown;k++){const pp=h('div','walker',pick(PEOPLE));pp.style.left='4%';pp.style.top='86%';w.appendChild(pp);
      const tgt=rides.length?pick(rides):null;const isAngry=k>=served*shown/Math.max(1,vis);
      setTimeout(()=>{if(tgt){pp.style.left=tgt.style.left;pp.style.top=`calc(${tgt.style.top} + 30px)`}else{pp.style.left='30%';pp.style.top='80%'}},40+k*90);
      setTimeout(()=>{const b=h('span','say',isAngry?pick(['😡','😤','⏳']):trashN>3&&k%4===0?'🤢':pick(['😆','😍','🤩','😄','🎉']));pp.appendChild(b);if(!isAngry&&k%3===0)SND.pop()},900+k*90);
      if(k%5===0)setTimeout(()=>{const tk=$('#tk');if(tk)FX.floatOn(tk,'+'+won(p*5),'#e0a000')},300+k*90)}
    for(let t=.3;t<=.8;t+=.1){setTime(t);await wait(380)}
    const ticket=vis*p;let up=0;g.slots.forEach(s=>{if(s.r)up+=RIDE[s.r].up});const wages=(g.staff.clean+g.staff.mech)*D.wage;
    S.rep=Math.max(0,Math.min(100,S.rep+(sat-62)/6));
    earn(ticket+stallR,$('#gate'));await wait(400);earn(-(up+wages),null);
    setTime(.9);document.querySelectorAll('.walker').forEach(e=>e.remove());document.querySelectorAll('.ride').forEach(r=>r.classList.remove('run'));
    if(sat>=75){banner('🎆 불꽃놀이!');FX.fireworks(5);await wait(1600)}
    g.total+=vis;g.best=Math.max(g.best,vis);
    // 밤사이 쓰레기
    if(F.has('trash')){const n=Math.max(0,Math.round(vis/D.trashPer)-2*g.staff.clean);for(let k=0;k<n&&g.trash.length<12;k++)g.trash.push({e:pick(['🥤','🍌','📰','🍿','🧃']),x:ri(8,92),y:ri(52,94)})}
    g.ad=0;
    const lines=[[`🧑 손님 ${vis}명 × 입장료 ${won(p)}`,won(ticket),'#1f9d55']];
    if(stallR)lines.push([`🍿 가게 수입`,won(stallR),'#1f9d55']);
    lines.push(['🔧 놀이기구 운영비','−'+won(up),'#e04848']);if(wages)lines.push(['🧑‍🔧 직원 월급','−'+won(wages),'#e04848']);if(g.spent)lines.push(['🏗️ 짓기·수리·상점에 쓴 돈','−'+won(g.spent),'#e04848']);
    lines.push(['😊 손님 만족도',sat+'%',sat>=70?'#1f9d55':sat>=50?'#e0a000':'#e04848']);
    const note=angry?`줄이 너무 길어서 ${angry}명이 화가 났어요. 놀이기구를 더 짓거나 업그레이드해 봐요!`:trashN>3?'쓰레기가 많아서 손님들이 싫어했어요.':p/D.M>fair+1?'입장료가 비싸서 손님이 줄었어요.':fun===0?'놀이기구가 없어서 손님이 실망했어요!':'';
    save();
    return{lines,net:ticket+stallR-up-wages-g.spent,emoji:sat>=75?'🎆':'🎡',note,vis,p,ticket,up:up+wages,sat,spent:g.spent,angry,stall:stallR};
  },
  ledger(r){
    if(GRADE===1){const a=Math.min(9,Math.max(2,Math.round(r.vis/5))),b=Math.min(9,Math.max(1,Math.round(r.vis/7)));return{text:`회전목마에 <b>${a}명</b>, 범퍼카에 <b>${b}명</b>이 줄을 섰어요.<br>모두 몇 명일까요?`,ans:a+b,unit:'명',pic:'🎠🚗'}}
    if(GRADE===2){const k=ri(3,9),n=ri(2,6);return{text:`관람차 한 칸에 <b>${n}명</b>씩 탈 수 있어요. <b>${k}칸</b>이 꽉 찼다면 모두 몇 명일까요?`,ans:k*n,unit:'명',pic:'🎡',h:`${n}단 곱셈구구`}}
    if(GRADE===3)return{text:`오늘 손님 <b>${r.vis}명</b>이 입장료 <b>${won(r.p)}</b>씩 냈어요.<br>입장료로 번 돈은 모두 얼마일까요?`,ans:r.vis*r.p,unit:U,h:`${r.p} × ${r.vis}`};
    if(GRADE===4&&r.ticket>=r.up)return{text:`오늘 입장료로 <b>${josa(won(r.ticket),'을','를')}</b> 벌고, 운영비와 월급으로 <b>${josa(won(r.up),'을','를')}</b> 냈어요.<br>입장료에서 운영비를 빼면?`,ans:r.ticket-r.up,unit:U};
    if(GRADE===4)return{text:`놀이기구 운영비가 하루에 <b>${josa(won(r.up||D.rides[0].up),'이에요','예요')}</b>. <b>15일</b> 동안 운영하면 운영비는 모두 얼마일까요?`,ans:(r.up||D.rides[0].up)*15,unit:U};
    if(GRADE===5){const hs=S.g.visHist=(S.g.visHist||[]).concat([r.vis]).slice(-3);const sum=hs.reduce((a,b)=>a+b,0);
      if(hs.length===3&&sum%3===0)return{text:`최근 3일 동안 손님이 <b>${hs.join('명, ')}명</b> 왔어요.<br>하루 평균 몇 명일까요?`,ans:sum/3,unit:'명',h:'세 수를 더해서 3으로 나눠요'};
      return{text:`입장료 <b>${josa(won(r.p),'을','를')}</b> 내일부터 <b>1.2배</b>로 올리려고 해요. 새 입장료는?`,ans:Math.round(r.p*1.2),unit:U,h:`${r.p} × 1.2`}}
    const asked=50,yes=Math.round(r.sat/2);return{text:`손님 <b>${asked}명</b>에게 물었더니 <b>${yes}명</b>이 "또 오고 싶어요!"라고 했어요.<br>또 오고 싶은 손님은 몇 %일까요?`,ans:yes*2,unit:'%',h:`${yes} ÷ ${asked} × 100`};
  },
  bot(){
    const g=S.g,left=D.days-S.day;
    g.trash=[];
    g.slots.forEach(s=>{if(s.r&&s.broken){const c=Math.round(RIDE[s.r].cost*D.repair/D.M)*D.M;if(canPay(c)){earn(-c,null);g.spent+=c;s.broken=false}}});
    const tryBuy=(id,cost,lv,max)=>{if(lv<max&&canPay(cost)&&S.money-cost>D.rides[0].cost){earn(-cost,null);g.spent+=cost;this.buy(id);return true}return false};
    if(left>=3){
      const empty=g.slots.findIndex(s=>!s.r);
      if(empty>=0){const need=this.cap()<this.expVis()*1.1;const opts=D.rides.filter(R=>(!R.feat||F.has(R.feat))&&R.fun>0&&canPay(R.cost)&&R.cost<=S.money*.9).sort((a,b)=>need?(b.cap/b.cost)-(a.cap/a.cost):(b.fun/b.cost)-(a.fun/a.cost));if(opts[0])this.build(empty,opts[0].id)}
      else if(F.has('land')){const it=this.shopItems().find(x=>x.id==='land');if(it)tryBuy('land',it.cost,it.lv,it.max)}
      if(F.has('upgrade')){const cand=g.slots.map((s,i)=>[s,i]).filter(([s])=>s.r&&RIDE[s.r].fun>0&&s.lv<3).sort((a,b)=>RIDE[b[0].r].cost-RIDE[a[0].r].cost);for(const[s]of cand){const c=Math.round(RIDE[s.r].cost*.6*s.lv/D.M)*D.M;if(canPay(c)&&S.money-c>D.rides[1].cost){earn(-c,null);g.spent+=c;s.inv+=c;s.lv++;break}}}
      if(F.has('staff')){tryBuy('clean',D.hire,g.staff.clean,1);tryBuy('mech',D.hire,g.staff.mech,1)}
      if(F.has('parking'))tryBuy('park',D.parkCost,g.park,1);
    }
    if(F.has('ads')&&g.ev!=='festival'&&S.money>D.adCost*4)tryBuy('ad',D.adCost,g.ad,1);
    const f=this.fair();let best=0,bd=1e9;D.prices.forEach((p,i)=>{const d=Math.abs(p/D.M-(f+.3));if(d<bd){bd=d;best=i}});g.pi=best;this.scene();this.panel($('#panel'));
  },
};

</script>
<script>
G=GAMEDEF;
if(S.over){G.scene();hud();finish()}else intro();
</script>
