<script>
const GRADE=6,GAME='race',KEY='arc-race-v1',TITLE='계산 레이싱 그랑프리',EMOJI='🏎️';
</script>
<script>
'use strict';
const $=s=>document.querySelector(s);
const LVN={easy:'🟢 쉬움',normal:'🟡 보통',hard:'🔴 어려움'};
const QS=new URLSearchParams(location.search);
let LV=QS.get('lv');if(!LVN[LV]){try{LV=localStorage.getItem('class-level')}catch(e){}}if(!LVN[LV])LV='normal';
const FAST=QS.get('fast')==='1';
const SKEY=LV==='normal'?KEY:KEY+'-'+LV;
const SAVE_V=1;
const L=(e,n,h)=>LV==='easy'?e:LV==='hard'?h:n;
$('#lvPill').textContent=LVN[LV];
window.addEventListener('error',e=>{console.error(e.message);$('#err').style.display='flex'});
$('#errReset').onclick=()=>{try{localStorage.removeItem(SKEY)}catch(e){}location.href=location.pathname+'?lv='+LV};
function loadSave(fresh){try{if(QS.get('reset')==='1')localStorage.removeItem(SKEY);const s=JSON.parse(localStorage.getItem(SKEY));if(s&&s.v===SAVE_V)return Object.assign(fresh(),s)}catch(e){}return fresh()}
function save(){try{localStorage.setItem(SKEY,JSON.stringify(S))}catch(e){}}
function markDone(){try{const id=GAME+'@'+LV;if(localStorage.getItem('class-done-skip-'+id)===String(S.end))return;const d=JSON.parse(localStorage.getItem('class-done')||'{}')||{};if(!d[id]){d[id]={how:'auto',at:new Date().toISOString()};localStorage.setItem('class-done',JSON.stringify(d))}}catch(e){}}
function h(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
const fmt=n=>{n=Math.floor(n);if(n<10000)return n.toLocaleString();if(n<1e8){const m=n/1e4;return (m<100?(Math.floor(m*10)/10):Math.floor(m)).toLocaleString()+'만'}return (Math.floor(n/1e6)/100).toLocaleString()+'억'};
/* ── 소리 ── */
let MUTE=false;try{MUTE=localStorage.getItem('arc-mute')==='1'}catch(e){}
$('#mute').textContent=MUTE?'🔇':'🔊';$('#mute').onclick=()=>{MUTE=!MUTE;$('#mute').textContent=MUTE?'🔇':'🔊';try{localStorage.setItem('arc-mute',MUTE?'1':'0')}catch(e){}};
let AC=null;function tone(f,d,type,vol){if(MUTE||FAST)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.value=vol||.12;o.connect(g);g.connect(AC.destination);const t=AC.currentTime;g.gain.setValueAtTime(vol||.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d)}catch(e){}}
const SND={good:()=>{tone(660,.12,'triangle');setTimeout(()=>tone(990,.16,'triangle'),70)},bad:()=>tone(160,.3,'sawtooth',.08),boom:()=>{tone(90,.35,'square',.12);tone(60,.4,'sawtooth',.08)},coin:()=>tone(1200,.08,'square',.05),win:()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.25,'triangle'),i*130)),lose:()=>[392,330,262].forEach((f,i)=>setTimeout(()=>tone(f,.3,'sawtooth',.07),i*180)),go:()=>tone(880,.4,'square',.06),beep:()=>tone(440,.15,'square',.06)};
/* ── 효과 ── */
function floatAt(x,y,txt,color){const e=h('div','fx float',txt);e.style.left=x+'px';e.style.top=y+'px';if(color)e.style.color=color;document.body.appendChild(e);setTimeout(()=>e.remove(),1200)}
function burst(x,y,em,n){for(let i=0;i<(n||10);i++){const e=h('div','fx part',em||'✨');e.style.left=x+'px';e.style.top=y+'px';document.body.appendChild(e);const a=Math.random()*6.28,r=40+Math.random()*80;requestAnimationFrame(()=>{e.style.transform=`translate(calc(-50% + ${Math.cos(a)*r}px),calc(-50% + ${Math.sin(a)*r}px)) scale(.5)`;e.style.opacity=0});setTimeout(()=>e.remove(),900)}}
function confetti(n){const em=['🎉','✨','⭐','🎊','💫'];for(let i=0;i<(n||40);i++){const e=h('div','conf',em[i%5]);e.style.left=Math.random()*100+'vw';e.style.animationDelay=Math.random()*1.2+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),4200)}}
function banner(t){const e=h('div','banner',t);document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}
function rect(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}}
/* ── 문제 만들기 ── */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));const pick=a=>a[Math.floor(Math.random()*a.length)];
const gcd=(a,b)=>b?gcd(b,a%b):a;
const rnd=v=>Math.round(v*10000)/10000;
const N=v=>({t:'n',v:rnd(v)});
const FR=(n,d)=>{const g=gcd(Math.abs(n),d);n/=g;d/=g;return d===1?N(n):{t:'f',n,d}};
const aval=a=>a.t==='n'?a.v:a.n/a.d;
const astr=a=>a.t==='n'?String(a.v):`${a.n}/${a.d}`;
const ahtml=a=>a.t==='n'?String(a.v):`<span class="fr"><i>${a.n}</i><i>${a.d}</i></span>`;
const qhtml=s=>s.replace(/\[(\d+)\/(\d+)\]/g,'<span class="fr"><i>$1</i><i>$2</i></span>');
const qfull=q=>qhtml(q)+(/□|[가-힣]/.test(q)?'':' = ?');
const dec=x=>Math.round(x*100)/100;
const D10=(x)=>String(dec(x));
function GEN(){
  const g=GRADE,lv=LV;const Q=(q,a,ex)=>({q,a,exact:!!ex});
  if(g===1){
    if(lv==='easy')return pick([()=>{const a=R(1,9),b=R(1,10-a);return Q(`${a} + ${b}`,N(a+b))},()=>{const a=R(3,10),b=R(1,a-1);return Q(`${a} − ${b}`,N(a-b))}])();
    if(lv==='normal')return pick([()=>{const a=R(5,9),b=R(11-a,9);return Q(`${a} + ${b}`,N(a+b))},()=>{const a=R(11,18),o=a-10,b=R(o+1,9);return Q(`${a} − ${b}`,N(a-b))},()=>{const a=R(1,9),b=R(1,9),c=R(1,9);return Q(`${a} + ${b} + ${c}`,N(a+b+c))}])();
    return pick([()=>{const t1=R(1,7),t2=R(1,9-t1),o1=R(0,8),o2=R(0,9-o1);return Q(`${t1*10+o1} + ${t2*10+o2}`,N((t1+t2)*10+o1+o2))},()=>{const t1=R(3,9),t2=R(1,t1-1),o1=R(2,9),o2=R(0,o1);return Q(`${t1*10+o1} − ${t2*10+o2}`,N((t1-t2)*10+o1-o2))},()=>{const a=R(2,9)*10,b=R(1,9-a/10)*10;return Q(`${a} + ${b}`,N(a+b))},()=>{const a=R(5,9),b=R(11-a,9);return Q(`${a} + ${b}`,N(a+b))}])();
  }
  if(g===2){
    if(lv==='easy')return pick([()=>{const a=R(15,89),b=R(Math.max(2,11-a%10),9);return Q(`${a} + ${b}`,N(a+b))},()=>{const a=R(15,59),b=R(13,39);return Q(`${a} + ${b}`,N(a+b))},()=>{const a=R(31,95),b=R(12,a-10);return Q(`${a} − ${b}`,N(a-b))}])();
    if(lv==='normal')return pick([()=>{const a=R(2,5),b=R(1,9);return Q(`${a} × ${b}`,N(a*b))},()=>{const a=R(2,5),b=R(2,9);return Q(`${b} × ${a}`,N(a*b))},()=>{const a=R(25,79),b=R(16,49);return Q(`${a} + ${b}`,N(a+b))},()=>{const a=R(41,95),b=R(17,a-12);return Q(`${a} − ${b}`,N(a-b))}])();
    return pick([()=>{const a=R(2,9),b=R(2,9);return Q(`${a} × ${b}`,N(a*b))},()=>{const a=R(3,9),b=R(3,9);return Q(`${a} × □ = ${a*b}`,N(b))},()=>{const a=R(6,9),b=R(6,9);return Q(`${a} × ${b}`,N(a*b))},()=>{const a=R(15,49),b=R(15,39),c=R(10,a+b-10);return Q(`${a} + ${b} − ${c}`,N(a+b-c))}])();
  }
  if(g===3){
    if(lv==='easy')return pick([()=>{const a=R(105,599),b=R(108,399);return Q(`${a} + ${b}`,N(a+b))},()=>{const a=R(301,980),b=R(105,a-60);return Q(`${a} − ${b}`,N(a-b))},()=>{const a=R(2,9),b=R(2,9);return Q(`${a*b} ÷ ${a}`,N(b))}])();
    if(lv==='normal')return pick([()=>{const a=R(12,49),b=R(3,9);return Q(`${a} × ${b}`,N(a*b))},()=>{const b=R(3,9),q=R(3,9);return Q(`${b*q} ÷ ${b}`,N(q))},()=>{const b=R(2,4),q=R(11,24);return Q(`${b*q} ÷ ${b}`,N(q))},()=>{const a=R(110,320),b=R(2,3);return Q(`${a} × ${b}`,N(a*b))}])();
    return pick([()=>{const a=R(13,39),b=R(12,29);return Q(`${a} × ${b}`,N(a*b))},()=>{const a=R(102,299),b=R(3,6);return Q(`${a} × ${b}`,N(a*b))},()=>{const b=R(3,9),q=R(21,Math.floor(999/b));return Q(`${b*q} ÷ ${b}`,N(q))}])();
  }

function parseAns(s){s=String(s).trim();if(!s)return null;if(/^\d+\/\d+$/.test(s)){const [n,d]=s.split('/').map(Number);if(!d)return null;return{t:'f',n,d,v:n/d}}if(/^\d*\.?\d+$/.test(s))return{t:'n',v:Number(s)};return null}
function check(input,Qo){const p=parseAns(input);if(!p)return false;if(Qo.exact){if(p.t!=='f')return Qo.a.t==='n'&&Math.abs(p.v-Qo.a.v)<1e-9;return gcd(p.n,p.d)===1&&Math.abs(p.v-aval(Qo.a))<1e-9}return Math.abs(p.v-aval(Qo.a))<1e-6}
function choices(a){const out=[a];const seen=new Set([rnd(aval(a))]);const add=c=>{if(!c)return;const v=rnd(aval(c));if(v>0&&!seen.has(v)&&out.length<4){seen.add(v);out.push(c)}};
  if(a.t==='f'){const {n,d}=a;shuffle([{t:'f',n:n+1,d},{t:'f',n:Math.max(1,n-1),d},{t:'f',n,d:d+1},{t:'f',n:d,d:n},{t:'f',n,d:Math.max(2,d-1)},{t:'f',n:n+2,d}]).forEach(add);let k=3;while(out.length<4)add({t:'f',n:n+k++,d})}
  else{const v=a.v;const dp=(String(v).split('.')[1]||'').length;const st=dp?Math.pow(10,-dp):1;shuffle([v+st,v-st,v+10*st,v-10*st,v+2*st,dp?v*10:v+10,v-2*st,v+st*5]).forEach(x=>add(N(x)));let k=3;while(out.length<4)add(N(v+st*k++))}
  return shuffle(out)}

function keypad(onSubmit,opts){opts=opts||{};const box=h('div','kpwrap');const disp=h('div','disp','&nbsp;');const kp=h('div','kp');let val='';
  const keys=['7','8','9','⌫','4','5','6','OK','1','2','3','0',GRADE>=4?'.':'',GRADE>=4?'/':''];
  const set=v=>{val=v;disp.innerHTML=val?val.replace(/(\d+)\/(\d*)/,'<span class="fr"><i>$1</i><i>$2&#8203;</i></span>'):'&nbsp;'};
  const press=k=>{if(k==='⌫')set(val.slice(0,-1));else if(k==='OK'){if(val)onSubmit(val,api)}else if(val.length<9){if((k==='.'||k==='/')&&(val.includes('.')||val.includes('/')||!val))return;set(val+k)}tone(700,.03,'square',.03)};
  keys.forEach(k=>{if(k===''&&false)return;const b=h('button',k==='OK'?'ok':k==='⌫'?'del':'',k===''?'&nbsp;':k);if(k==='')b.disabled=true,b.style.opacity=.25;else b.onclick=()=>press(k);kp.appendChild(b)});
  box.append(disp,kp);const api={el:box,clear:()=>set(''),flash:ok=>{disp.classList.remove('good','bad');void disp.offsetWidth;disp.classList.add(ok?'good':'bad');setTimeout(()=>disp.classList.remove('good','bad'),500)},press,get:()=>val};
  const onKey=e=>{if(!box.isConnected){document.removeEventListener('keydown',onKey);return}if(/^[0-9]$/.test(e.key))press(e.key);else if(e.key==='Backspace')press('⌫');else if(e.key==='Enter')press('OK');else if(e.key==='.'&&GRADE>=4)press('.');else if(e.key==='/'&&GRADE>=4)press('/')};

      <div class="podium">${[1,0,2].map(k=>`<div class="pd p${k+1}"><div class="pc"><span class="flip">${order[k]===0?CARS[S.car]:AI[order[k]-1].c}</span></div><b>${this.names[order[k]]}</b><div>${c.pts[order[k]]}점</div><div class="blk">${k+1}</div></div>`).join('')}</div>
      <p>${rank===1?'🎉 우승! 최고의 계산 레이서예요!':rank<=3?`${rank}등으로 시상대에 올랐어요! 👏`:'완주 성공! 다음엔 시상대에 올라 봐요! 💪'}</p>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn" id="again">🔁 다시 달리기</button>${LV!=='hard'?`<a class="btn ghost" style="text-decoration:none" href="${file}?lv=${LV==='easy'?'normal':'hard'}">다음 단계 →</a>`:''}<a class="btn ghost" style="text-decoration:none" href="index.html">🏠 게임 교실</a></div></div>`);
    document.body.appendChild(md);md.querySelector('#again').onclick=()=>{md.remove();this.intro()};this.done=true},
};
document.addEventListener('keydown',e=>{if(GAMEDEF.r&&/^[1-4]$/.test(e.key)&&$('#ch')&&$('#ch').children.length)GAMEDEF.pick(+e.key-1)});
window.__auto=()=>new Promise(res=>{AUTO=true;TS=20;GAMEDEF.cup={race:0,pts:[0,0,0,0],t0:Date.now()};GAMEDEF.race();const iv=setInterval(()=>{if(GAMEDEF.done){clearInterval(iv);res({ok:!!S.end,pts:GAMEDEF.cup.pts})}},50)});

</script>
<script>
GAMEDEF.boot();
</script>
